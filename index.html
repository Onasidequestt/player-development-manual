/* ---- tokens. One theme: the cover is navy and gold, the app follows it.
   Data marks use --mark (gold), --mark3 (light gold, games) and --mark2 (grey, baseline) only;
   text never wears a series colour. Display face = Barlow Condensed (OFL, embedded by build.py). ---- */
:root{
  --bg:#0b1630;
  --panel:#132447;
  --panel2:#1b2f57;
  --line:#26395f;
  --ink:#f2f0ea;
  --ink2:#c3c8d6;
  --mute:#8e97ad;
  --gold:#e0a62c;
  --gold2:#f3c65b;
  --mark:#c98500;
  --mark2:#8e97ad;
  --mark3:#f3c65b;
  --good:#3fbf7f;
  --warn:#e07b39;
  --focus:#7fb3ff;
  --r:16px;
  --disp:"PDM Display","Barlow Condensed","Arial Narrow",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
main{max-width:760px;margin:0 auto;padding:0 16px}
h1{font:800 34px/1 var(--disp);text-transform:uppercase;letter-spacing:.3px;margin:22px 0 6px}
h2{font:700 19px/1.1 var(--disp);margin:0 0 10px;color:var(--gold2);text-transform:uppercase;letter-spacing:.9px}
h3{font-size:15px;margin:14px 0 6px}
p{margin:6px 0}
.sub{color:var(--ink2);font-size:14px}
.mute{color:var(--mute);font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.card.quiet{background:transparent}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto}
.right{margin-left:auto}
button{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-height:44px;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button.primary{background:var(--gold);color:#1a1200;border-color:var(--gold);font-weight:700}
button.ghost{background:transparent}
button.link{background:none;border:0;color:var(--gold2);padding:6px 0;min-height:32px;font-weight:600}
button:disabled{opacity:.45;cursor:default}
input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-height:44px;margin:3px 0}
textarea{min-height:76px;resize:vertical}
label.f{display:block;margin:12px 0 4px;font-size:13px;color:var(--ink2)}
.hidden{display:none !important}
.num{font-family:var(--disp);font-variant-numeric:tabular-nums}
/* five-point chips */
.scale{display:flex;gap:6px;margin:4px 0 2px}
.scale button{flex:1 1 0;padding:8px 0;min-width:0;font:700 18px var(--disp)}
.scale button[aria-pressed="true"]{background:var(--gold);color:#1a1200;border-color:var(--gold)}
.scale-key{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-bottom:6px}
.item{padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .nm{font-size:15px;margin-bottom:4px}
/* ---- brand header: built from type and shapes, echoing the cover (gold slashes, #7) ---- */
.brand{position:relative;overflow:hidden;border-radius:var(--r);margin-top:12px;padding:18px 18px 16px;min-height:176px;border:1px solid var(--line);background:linear-gradient(160deg,#15306a 0%,#0e1d40 55%,#0a1530 100%)}
.brand svg.bands{position:absolute;inset:0;width:100%;height:100%}
.brand .seven{position:absolute;right:-6px;bottom:-40px;font:800 200px/1 var(--disp);color:transparent;-webkit-text-stroke:2px rgba(242,240,234,.38);letter-spacing:-4px;pointer-events:none}
.brand .ticks{display:flex;gap:4px;margin-bottom:10px}
.brand .ticks i{display:block;width:9px;height:14px;background:var(--gold);transform:skewX(-24deg)}
.brand .ticks i:nth-child(n+3){opacity:.55}
.brand .t1{position:relative;font:600 14px/1 var(--disp);letter-spacing:2.2px;text-transform:uppercase;color:var(--gold2)}
.brand .t2{position:relative;font:800 50px/.9 var(--disp);text-transform:uppercase;margin:8px 0 10px;letter-spacing:.2px;color:var(--ink)}
.brand .t2 span{display:block}
.brand .t3{position:relative;color:var(--ink2);font-size:14px}
/* ---- readiness state: ring + 7-day strip ---- */
.state{display:grid;grid-template-columns:128px 1fr;gap:16px;align-items:center}
.ring{position:relative;width:128px;height:128px}
.ring svg{width:128px;height:128px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11}
.ring .trk{stroke:var(--panel2)}
.ring .arc{stroke:var(--gold);stroke-linecap:round}
.ring .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .v b{font:800 38px/1 var(--disp);font-variant-numeric:tabular-nums}
.ring .v small{font-size:11px;color:var(--mute);margin-top:2px}
.state .lbl{font-size:12px;color:var(--mute)}
.minis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.mini{background:var(--panel2);border-radius:12px;padding:10px 12px}
.mini .lbl{font-size:12px;color:var(--mute)}
.mini .val{font:800 26px/1.1 var(--disp);font-variant-numeric:tabular-nums}
/* morning check stepper */
.stepper .q{font:800 30px/1.05 var(--disp);text-transform:uppercase;margin:6px 0 10px}
.dots{display:flex;gap:5px}
.dots i{width:18px;height:5px;border-radius:3px;background:var(--panel2)}
.dots i.on{background:var(--gold)}
.dots i.cur{background:var(--ink)}
.stepper .scale button{min-height:58px;font-size:24px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font-size:12px;background:var(--panel2);border-radius:999px;padding:4px 10px;color:var(--ink2)}
.chip b{color:var(--ink);font-family:var(--disp);font-size:14px;margin-left:4px}
/* percentage bars. Track + fill, a 2px surface gap to the baseline marker ring */
.bar{position:relative;height:10px;background:var(--panel2);border-radius:5px;overflow:visible;margin:8px 0}
.bar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--mark);border-radius:5px}
.bar .prev{position:absolute;top:-3px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--mark2);border:2px solid var(--panel)}
.pct{font:800 20px var(--disp);font-variant-numeric:tabular-nums}
.big{font:800 56px/1 var(--disp);letter-spacing:-.5px;font-variant-numeric:tabular-nums}
/* then-vs-now per section: HTML positioned in %, so nothing stretches */
.dumb{position:relative;height:18px;margin:6px 0 2px}
.dumb .trk{position:absolute;left:0;right:0;top:8px;height:2px;background:var(--panel2);border-radius:1px}
.dumb .mid{position:absolute;left:50%;top:3px;width:1px;height:12px;background:var(--line)}
.dumb .span{position:absolute;top:7px;height:4px;background:var(--mark);opacity:.55;border-radius:2px}
.dumb .dot{position:absolute;top:2px;width:14px;height:14px;margin-left:-7px;border-radius:50%}
.dumb .dot.now{background:var(--gold)}
.dumb .dot.base{background:var(--panel);border:2px solid var(--mark2)}
.delta{font:700 13px var(--disp);color:var(--ink2);min-width:30px;text-align:right}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin:2px 0 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.legend i.now{background:var(--gold)} .legend i.base{border:2px solid var(--mark2)}
.legend i.sq{border-radius:2px;background:var(--mark)} .legend i.sq3{border-radius:2px;background:var(--mark3)}
/* charts: rects only inside the svg (it stretches); every label is HTML */
.chartbox{position:relative;margin-top:6px}
.chartbox svg{display:block;width:100%;height:96px}
.chartbox.sm svg{height:64px}
.chartbox rect.col{fill:var(--mark)}
.chartbox rect.col.alt{fill:var(--mark3)}
.chartbox rect.gap{fill:var(--line)}
.chartbox line.ref{stroke:var(--mute);stroke-dasharray:3 4;stroke-width:1;opacity:.7}
.chartbox .lastv{position:absolute;right:0;top:-18px;font:700 14px var(--disp);color:var(--ink)}
.chartbox .reflbl{position:absolute;left:0;font-size:10px;line-height:1;color:var(--ink2);background:var(--panel);padding:1px 4px 1px 0;border-radius:0 3px 3px 0;transform:translateY(-50%)}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-top:4px}
/* log entries: the whole row is the edit button */
.seg{display:flex;gap:6px;margin:10px 0 4px}
.seg button{min-height:36px;padding:6px 12px;font-size:14px;border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.entry{border-top:1px solid var(--line)}
.entry:first-child{border-top:0}
.entry button.rowbtn{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:0;padding:10px 0}
.entry .sc{min-width:56px;text-align:center;background:var(--panel2);border-radius:10px;padding:7px 4px;font:800 19px/1.1 var(--disp);font-variant-numeric:tabular-nums}
.entry .sc small{display:block;font:400 10px -apple-system,sans-serif;color:var(--mute)}
.entry .what{flex:1;min-width:0}
.entry .when{font-size:12px;color:var(--mute)}
.entry .chev{margin-right:4px}
.entry.static{display:flex;gap:12px;align-items:center;padding:10px 0}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--panel2);color:var(--ink2);margin-right:6px}
.tag.g{background:rgba(243,198,91,.16);color:var(--gold2)}
.empty{color:var(--mute);padding:14px 0;text-align:center;font-size:14px}
/* rating sections */
.sec{border-top:1px solid var(--line);padding:10px 0}
.sec:first-child{border-top:0}
.sec .hd{display:flex;align-items:center;gap:10px;cursor:pointer;min-height:44px;background:none;border:0;padding:0;width:100%;text-align:left;color:inherit}
.sec .hd .nm{flex:1;font-size:15px}
.sec .hd .n{font-size:12px;color:var(--mute)}
.sec .body{padding-top:6px}
.chev{width:9px;height:9px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(-45deg);transition:transform .15s;flex:0 0 auto}
.sec.open .chev{transform:rotate(45deg)}
.unsaved{background:rgba(224,166,44,.12);border:1px solid rgba(224,166,44,.4);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px}
/* habits */
.habit{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.habit:first-child{border-top:0}
.habit button.tick{width:44px;height:44px;border-radius:50%;padding:0;font-size:20px;flex:0 0 auto}
.habit button.tick[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#04200f}
.habit .nm{flex:1}
.meter{height:12px;background:var(--panel2);border-radius:6px;overflow:hidden;margin:8px 0}
.meter i{display:block;height:100%;background:var(--mark)}
/* standard card */
.says{border-left:3px solid var(--gold);padding:2px 0 2px 12px;margin:8px 0}
.says .k{font:600 12px var(--disp);letter-spacing:1.4px;text-transform:uppercase;color:var(--mute)}
.says p{margin:2px 0;font-size:15px}
.says ul{margin:4px 0;padding-left:18px;font-size:15px}
/* read */
.front{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center}
.front img{width:120px;border-radius:6px;box-shadow:0 10px 24px rgba(0,0,0,.45);display:block}
.chgrid{display:grid;grid-template-columns:1fr;gap:10px}
.chgrid button{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;text-align:left;padding:14px;border-radius:14px;background:var(--panel)}
.chgrid .no{font:800 34px/1 var(--disp);color:var(--gold)}
.chgrid .ti{font-weight:600;line-height:1.25}
.chgrid small{display:block;color:var(--mute);font-size:12px;margin-top:3px}
.chgrid .st{font-size:12px;color:var(--good)}
.prose{max-width:66ch}
.prose .kick{font:700 14px var(--disp);letter-spacing:2px;text-transform:uppercase;color:var(--gold)}
.prose h2.title{font:800 38px/1 var(--disp);color:var(--ink);text-transform:uppercase;margin:6px 0 18px;letter-spacing:.2px}
.prose h3{font:700 22px/1.15 var(--disp);color:var(--gold2);margin:28px 0 8px;text-transform:uppercase;letter-spacing:.4px}
.prose p{color:var(--ink);line-height:1.7;font-size:17px;margin:10px 0}
.field{background:var(--panel2);border:1px solid var(--gold);border-radius:14px;padding:12px 14px;margin:14px 0}
.field label{display:block;font:700 15px var(--disp);letter-spacing:1px;text-transform:uppercase;color:var(--gold2);margin-bottom:4px}
.field .mute{margin-bottom:4px}
.flash{background:var(--gold);color:#1a1200;border-radius:12px;padding:10px 12px;margin:10px 0;font-weight:600}
/* bottom tab bar, inline SVG icons */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(19,36,71,.97);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs button{flex:1 1 0;max-width:150px;border:0;border-radius:0;background:none;padding:8px 0 8px;font-size:11px;letter-spacing:.3px;color:var(--mute);min-height:58px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button .ic{display:block;width:24px;height:24px}
nav.tabs button .ic svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--gold2);font-weight:700}
section[data-tab]{display:none}
section[data-tab].on{display:block}
.cols{display:block}
@media (min-width:960px){
  main{max-width:1080px;padding:0 28px}
  .cols{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;align-items:start}
  .brand{min-height:210px;padding:26px 28px}
  .brand .t2{font-size:64px}
  .brand .t2 span{display:inline;margin-right:.25em}
  .brand .seven{font-size:260px;bottom:-56px;right:24px}
  .chgrid{grid-template-columns:1fr 1fr}
  #sections{columns:2;column-gap:28px}
  #sections .sec{break-inside:avoid}
  .narrow{max-width:760px}
}
@media print{ nav.tabs,button,.hidden{display:none !important} body{background:#fff;color:#000;padding:0} .card{border-color:#999} section[data-tab]{display:none} section[data-tab].on{display:block} .bar .fill{background:#333} .brand{min-height:0} }

const SECTIONS = [{"name":"Skating","items":["First-Step Quickness","Acceleration","Top Speed","Ability to Change Pace","Edge Control","Balance and Stability","Lateral Movement","Directional Transitions","Stops and Starts","Skating With the Puck","Skating Without the Puck","Maintaining Speed Under Pressure","Movement Through Contact"],"key":"sk"},{"name":"Puck Skill","items":["Receiving Passes","Receiving Passes in Motion","Handling Difficult Passes","Puck Control at Speed","Puck Control in Tight Space","Puck Protection","Passing Accuracy","Passing Speed and Timing","Passing Under Pressure","Deception With the Puck","Backhand Skill","Wall Play and Retrievals","Ability to Make a Play After Contact"],"key":"pk"},{"name":"Shooting and Scoring","items":["Release Speed","Accuracy","Shot Power","Shooting in Stride","Changing the Shooting Angle","Shooting Through Traffic","One-Touch Finishing","Backhand Finishing","Rebounds and Net-Front Finishing","Shot Selection","Ability to Find Scoring Space","Willingness to Attack Inside Ice","Finishing Under Physical Pressure"],"key":"sh"},{"name":"Offensive Play","items":["Puck Support","Timing and Spacing","Offensive-Zone Entries","Defensive-Zone Exits","Transition Play","Forechecking","Offensive-Zone Movement","Creating Inside Position","Extending Possession","Attacking Defenders","Creating for Teammates","Net-Front Play","Play Below the Goal Line","Decisions With Time and Space","Decisions Under Immediate Pressure"],"key":"of"},{"name":"Defensive Play","items":["Backpressure and Tracking","Defensive-Zone Positioning","Awareness Away From the Puck","Protecting Dangerous Space","Wall Responsibilities","Stick Position","Body Position","Closing Speed","Support Below the Puck","Defensive Communication","Reaction After Turnovers","Puck Management Near Blue Lines","Penalty-Killing Habits","Patience and Positional Discipline"],"key":"df"},{"name":"Hockey Sense and Decision Making","items":["Scanning Before Receiving the Puck","Awareness of Pressure","Awareness of Teammates","Recognition of Open Space","Anticipation","Time-and-Score Awareness","Risk Management","Ability to Play Ahead of Pressure","Ability to Adapt During Games","Use of Deception","Recognition of Numerical Advantages","Understanding Team Systems","Ability to Learn Through Video"],"key":"hs"},{"name":"Practice Habit","items":["Punctuality and Preparation","Attention During Instruction","Effort","Execution and Detail","Competitiveness","Communication","Response to Correction","Engagement Between Repetitions","Willingness to Work on Weaknesses","Quality Late in Practice","Post-Practice Recovery"],"key":"ph"},{"name":"Game Habit","items":["Readiness at the Beginning of Games","Shift-to-Shift Consistency","Execution at Game Speed","Decisions Under Pressure","Response After Mistakes","Emotional Control","Discipline","Role Execution","Ability to Adjust During the Game","Performance Late in Games","Response to Reduced Ice Time","Response to Physical Play","Team-First Behavior"],"key":"gh"},{"name":"Mental Performance","items":["Focus","Confidence","Pregame Preparation","Response to Mistakes","Emotional Regulation","Handling Pressure","Ability to Reset","Self-Talk","Resilience","Ability to Remain Present","Response to Comparison","Ability to Ask for Help","Identity Outside Hockey"],"key":"mp"},{"name":"Communication and Coachability","items":["Listening","Body Language During Feedback","Asking Questions","Honesty","Applying Feedback","Follow-Through","Discussing My Role","Communicating Health Concerns","Handling Disagreement"],"key":"cc"},{"name":"Team Contribution","items":["Encouragement","Reliability","Bench Engagement","Practice Energy","Response to Teammates' Success","Response to Teammates' Mistakes","Inclusion and Respect","Willingness to Perform an Unglamorous Role","Leadership","Contribution During Personal Difficulty"],"key":"tc"},{"name":"Recovery and Health","items":["Recurring soreness or symptoms","Medical communication","Treatment follow-through","Cooldown habits","Mobility and recovery work","Post-activity hydration","Post-activity nutrition","Travel recovery","Willingness to rest when directed"],"key":"rh"},{"name":"Nutrition and Hydration","items":["Eating regular meals","Breakfast consistency","Pre-training and pregame fueling","Post-training recovery nutrition","Daily hydration","Travel-food preparation","Energy throughout the day"],"key":"nh"},{"name":"Sleep","items":["Average nightly sleep","Bedtime consistency","Wake-time consistency","Sleep quality","Ability to fall asleep","Nighttime interruptions","Screen use before bed","Caffeine timing","Travel sleep","Morning energy"],"key":"sl"},{"name":"Professional and Personal Conduct","items":["Punctuality","Equipment Care","Treatment of Coaches and Staff","Billet or Home Responsibilities","Academic Responsibility","Public Conduct","Social-Media Conduct","Honesty","Rule Compliance","Handling Commitments","Accountability After Mistakes","Gratitude"],"key":"pc"}];
const CHAPTERS = [{"n":"ONE","title":"The Opportunity","blocks":[{"h":"","p":["Very few athletes receive the opportunity to compete at this level.","For years, hockey may have been measured by practices, tournaments, long drives, early mornings, friendships, victories, disappointments, and the simple enjoyment of playing the game. Reaching the Western Hockey League does not erase any of those things, but it changes what the opportunity requires.","The game becomes faster. The players become stronger. Decisions must be made sooner. Mistakes are exposed more quickly. Expectations rise, both on and off the ice.","At this level, talent is no longer unusual. Nearly every player was one of the best players on his previous team. Nearly every player has experienced success. Nearly every player has been told that he has potential.","Potential may open the door, but it does not determine how long the door remains open.","What separates players over time is their willingness to develop. It is their ability to listen, adjust, recover, prepare, and continue working when progress is slow or recognition is absent. It is the discipline to do ordinary things well, repeatedly, even when no one is watching.","Playing in the WHL is not the completion of the journey. It is the beginning of a more demanding stage of it."]},{"h":"Gratitude Becomes Responsibility","p":["An opportunity of this size should create gratitude, but gratitude is more than feeling fortunate.","It means treating practice as a privilege rather than an obligation. It means respecting the coaches, teammates, billet families, trainers, equipment staff, teachers, volunteers, family members, and communities that make the opportunity possible.","It means taking care of your equipment, your body, your responsibilities, and the people around you.","It means understanding that every role matters. There may be nights when you play significant minutes and nights when your role is smaller. There may be stretches when your progress is obvious and stretches when it feels as though nothing is changing. There may be moments when confidence comes easily and moments when it does not.","Prepare honestly. Compete fully. Learn continuously. Treat people well."]},{"h":"The Standard Changes","p":["The habits that brought a player to this level may not be enough to carry him through it.","That is not an insult to what came before. It is a natural part of development.","As competition improves, the standard must improve with it.","A workout is no longer only about completing the exercises. It is about movement quality, intent, consistency, and understanding why the work matters.","Recovery is no longer something to consider only when the body feels tired. It becomes part of training itself.","Nutrition is not simply eating when hungry. It is providing the body with the energy and nutrients required to practice, compete, recover, grow, and remain healthy through a demanding season.","Sleep is not unused time. It is one of the most important periods of physical and mental development.","Video review is not punishment for making mistakes. It is an opportunity to see the game more clearly and shorten the distance between experience and improvement.","Feedback is not a judgment of personal worth. It is information.","The professional approach is not to perform every habit perfectly. No athlete does that. The professional approach is to recognize what the standard requires and continually move closer to it."]},{"h":"Honesty Before Improvement","p":["This manual will only be useful if it is used honestly.","There is no value in recording what sounds impressive. There is no benefit in giving yourself high marks when the effort was incomplete, ignoring soreness that should be reported, or pretending to understand feedback that remains unclear.","Improvement begins with an accurate assessment of where you are.","Some days will be excellent. Record them honestly and determine what helped produce them.","Some days will be poor. Record them honestly without turning one difficult practice or game into a judgment about who you are as a player.","The purpose is not self-criticism. The purpose is self-awareness.","You may discover that your best games tend to follow consistent sleep. You may notice that poor food preparation affects your energy during travel. You may see that certain mistakes occur when you stop scanning before receiving the puck. You may recognize that frustration after one bad shift sometimes carries into the next.","A single entry may not reveal much. Weeks and months of honest entries can reveal a great deal.","That information creates an advantage only when you are willing to act on it."]},{"h":"Discipline When Motivation Changes","p":["Motivation is valuable, but it is unreliable.","There will be days when you cannot wait to get to the rink. There will also be days when your body is tired, your confidence is low, your role is uncertain, or your progress feels invisible.","A serious player cannot depend entirely on how motivated he feels.","When motivation fades, discipline remains.","Discipline means following the plan when the work is repetitive. It means completing recovery when you would rather move on with the day. It means preparing properly for a practice that no scouts will watch. It means making a good decision after a teammate, coach, official, or opponent has frustrated you.","Discipline also means knowing when to communicate.","Playing through every problem is not always toughness. There are times when the responsible action is to report pain, illness, fatigue, or uncertainty to the appropriate member of the team staff. Professional habits include asking for help before a manageable problem becomes a larger one.","The objective is not to become emotionless or mechanically perfect. The objective is to remain dependable while emotions and circumstances change."]},{"h":"Preparation Creates Confidence","p":["Confidence is often treated as a feeling that a player either possesses or loses.","A more durable form of confidence comes from evidence.","You build that evidence when you complete the work your coaches prescribe, practice skills with intention, prepare your body, study the game, recover properly, and respond constructively to feedback.","Preparation does not guarantee that every game will go well. Hockey is too unpredictable for that. A good shot may hit the post. A smart play may not produce a point. A strong performance may be overlooked. A mistake may lead directly to a goal against.","Preparation does guarantee that you have given yourself the best available chance to perform.","When confidence feels strong, preparation keeps you grounded.","When confidence feels weak, preparation gives you something solid to rely upon.","You may not always be able to control the outcome, but you can control whether you were ready to meet the moment."]},{"h":"The Player And The Person","p":["The pursuit of hockey development should not be separated from personal development.","The habits that make someone a dependable player often make him a dependable person: punctuality, honesty, humility, resilience, communication, respect, and the willingness to take responsibility.","It will test how you respond when another player receives the opportunity you wanted. It will test how you treat teammates when you are playing well and when you are struggling. It will test whether you can receive difficult feedback without becoming defensive. It will test whether you can remain respectful when disappointed.","It will also provide opportunities to lead, encourage, contribute, and represent something larger than yourself.","Statistics matter. Results matter. Advancement matters. It is appropriate to pursue all of them seriously.","But statistics will eventually fade. Seasons will end. Teams will change. The person you become through pursuing excellence will remain.","That is what this manual is ultimately designed to support."]},{"h":"Use The Opportunity Well","p":["You do not need to know today exactly how far hockey will take you.","You do need to decide how you will approach the opportunity in front of you.","Every practice is an opportunity to become more skilled.","Every workout is an opportunity to become more physically prepared.","Every recovery session is an opportunity to protect future performance.","Every meal is an opportunity to provide your body with what it needs.","Every video session is an opportunity to understand the game more deeply.","Every difficult moment is an opportunity to strengthen your response.","Every interaction is an opportunity to establish what kind of teammate and person you will be.","No single day will define your career. Your direction will be shaped by what you do repeatedly."]},{"h":"Player Reflection","p":["Consider what first drew you to the game, what you enjoy about it now, and what makes the work meaningful to you beyond recognition, statistics, or advancement.","Consider what reaching this level represents, who helped you get here, and what responsibility comes with the opportunity.","Describe the qualities, habits, skills, and style of play you want others to associate with you.","What kind of teammate do I want to become?","Think about how you want teammates to experience your presence during success, adversity, competition, travel, practice, and everyday team life.","What kind of man do I hope hockey helps me become?","Think beyond the rink. Consider character, relationships, responsibility, resilience, leadership, and the values you want to carry throughout your life."]}]},{"n":"TWO","title":"My Identity As A Player","blocks":[{"h":"","p":["Sometimes that reputation is built through goals, assists, highlight-reel plays, or physical ability. More often, it is built through hundreds of smaller moments: how a player competes for a loose puck, whether he supports the play away from the puck, how quickly he responds after a mistake, whether his teammates trust him, and how consistently his habits appear from one day to the next.","A player’s identity is not a slogan. It is the collection of qualities, decisions, and behaviors that repeatedly show up in his game.","At lower levels, natural ability may allow a player to succeed without clearly understanding what makes him effective. At higher levels, that understanding becomes increasingly important. The competition is stronger, roles are more specific, and coaches need to know what they can reliably expect from each player.","This chapter is designed to help you identify the player you are today, the player others currently experience, and the player you are working to become.","The objective is not to place yourself into a permanent category. Your identity should continue evolving as your skills, body, experience, and understanding of the game develop."]},{"h":"Identity Is Built Through Repetition","p":["You do not establish your identity by describing yourself once.","You establish it through repeated evidence.","A player cannot simply declare that he is dependable. Dependability is demonstrated by consistently being in the correct position, managing the puck responsibly, communicating, preparing properly, and responding well when circumstances become difficult.","A player cannot simply declare that he is competitive. Competitiveness appears in races, battles, second efforts, backchecks, net-front play, practice habits, and the willingness to stay engaged when the game is not going his way.","A player cannot simply declare that he is skilled. Skill becomes valuable when it can be executed at speed, under pressure, within the structure of the team, and at the moments when the game demands it.","The player you believe yourself to be matters. The player your coaches and teammates experience matters more. A useful player identity must be visible through behavior."]},{"h":"Knowing What You Bring","p":["Every player enters a team with a different combination of abilities.","Some players create offense through speed. Some protect the puck and extend possession. Some recognize developing plays before others do. Some are especially effective below the goal line, around the net, on the penalty kill, or in transition.","Some players bring calm. Some bring energy. Some make linemates better through communication and support. Some can change the momentum of a game through physical play, pressure, or relentless effort.","Understanding what you bring does not mean becoming satisfied with your current strengths. It means recognizing what already gives you value so that you can continue strengthening it.","Your strongest qualities can become the foundation upon which the rest of your game is built.","Development should add dimensions to your game without erasing your foundation."]},{"h":"Strengths Must Survive Pressure","p":["A quality is not yet a reliable strength simply because it appears during drills or low-pressure situations.","At higher levels, strengths must survive speed, pressure, fatigue, physical contact, uncertainty, and limited time.","The question is not only, “What can I do?” The more useful question is, “What can I do consistently under the conditions of the game?”","A professional-level strength is not merely impressive. It is repeatable."]},{"h":"Your Role And Your Identity Are Connected","p":["A player’s role may change throughout a season.","You may move between lines. You may receive more or less ice time. You may play different special-teams roles. Injuries, matchups, roster changes, and team needs may all affect how you are used.","Your role describes what the team needs from you in a particular situation. Your identity describes the qualities you bring regardless of the role.","A strong player identity provides stability when the role changes.","A smaller role is not an instruction to become passive. It is an opportunity to demonstrate that your habits can be trusted."]},{"h":"Do Not Confuse Identity With Statistics","p":["Statistics are useful, but they do not provide a complete description of a player.","Goals and assists reveal part of what happened. They do not always reveal why it happened, whether the player made strong decisions throughout the game, or how much he contributed away from the puck.","A player can perform well without scoring. A player can also score while playing an otherwise incomplete game.","If your identity depends entirely on production, confidence may rise and fall with every point. A complete player learns to evaluate both production and process."]},{"h":"The Difference Between Who You Are And Who You Want To Become","p":["An honest player identity includes both strengths and limitations.","It is tempting to describe only the finished player you hope to become. That vision matters, but it should not replace an accurate assessment of the present.","The gap between your present and future identity is not a reason for discouragement. It is the location of the work."]},{"h":"Identity Should Guide Training","p":["Training becomes more effective when it is connected to the player you are trying to become.","A vague goal such as “get better at hockey” does not provide much direction. A specific identity creates better questions.","The identity should not become restrictive. A player can be fast, responsible, skilled, physical, intelligent, and creative. The purpose is to identify the qualities that deserve the greatest attention during the current stage of development."]},{"h":"Language Shapes Attention","p":["The language you use to describe yourself affects what you notice and reinforce.","A productive identity describes what you intend to do, not merely what you hope to avoid.","Useful identity language is specific, believable, observable, connected to controllable behavior, demanding without being unrealistic, and capable of guiding daily action."]},{"h":"Identity Must Remain Flexible","p":["A player’s identity should be stable enough to provide direction but flexible enough to allow growth.","Young players sometimes become trapped by labels. Labels can become limits when treated as permanent.","You are not required to remain the exact player you were last season. Continue asking whether your identity reflects who you are becoming."]},{"h":"The Identity Others Experience","p":["Self-assessment is valuable, but it is incomplete. Every player has blind spots.","This is why feedback matters. Ask coaches specific questions about what makes you valuable, what they trust you to do, the role they see for you, and what must improve before that role can expand.","The most accurate identity is usually built from several perspectives: your own assessment, coach feedback, video evidence, performance trends, teammate experience, measurable development, and repeated behavior under pressure."]},{"h":"Your Identity Statement","p":["A player identity statement is a short description of the player you are committed to becoming.","It should not sound like a slogan created for social media. It should be useful during preparation, training, competition, and review.","For example: I am developing into a fast, dependable two-way forward who pressures the puck, makes responsible decisions, creates offense through pace and support, and remains composed and competitive in every role.","That statement does not claim perfection. It describes direction."]},{"h":"Proving The Identity","p":["Once you have written your identity statement, ask one final question: What would another person need to observe to know that this identity is true?","Your identity becomes real when it can be recognized without explanation.","You do not need to prove everything in one game. You build the evidence one practice, one shift, one decision, and one response at a time."]},{"h":"Player Identity Assessment","p":["Describe your game as it exists today. Do not describe the player you eventually hope to become.","Which of my strengths remain dependable when the game becomes faster, more physical, or more difficult?","Which strengths become less consistent under pressure?","What conditions make those strengths less dependable?","Creating offense | Finishing | Puck possession | Forechecking | Defensive responsibility | Transition | Puck support | Physical engagement | Net-front play | Special teams | Communication | Energy | Leadership | Practice habits | Emotional composure","What do I believe my coaches currently need from me?","What parts of my current role do I understand clearly?","How do I believe my coaches would describe me?","How do I believe my teammates would describe me?","What qualities do I hope they already trust?","What might they need to see more consistently?","What part of my game is currently limiting my effectiveness the most?","What part becomes least dependable under pressure?","What do I sometimes avoid working on because it is uncomfortable or difficult?","Describe the player you want to become over the next two to three seasons."]},{"h":"Coach Feedback Conversation","p":["What qualities currently make me valuable to the team?","What part of my game must improve before my role can expand?","What habit do you most want me to demonstrate more consistently?","What should I focus on during the next four weeks?"]}]},{"n":"THREE","title":"My Personal Standard","blocks":[{"h":"","p":["Goals describe what you want to accomplish.","Standards describe how you choose to operate while pursuing those goals.","A goal may be to earn more ice time, become a stronger skater, contribute offensively, make a special-teams unit, or advance to the next level. Each of those outcomes matters, but none of them is entirely within your control.","A coach determines the lineup. Teammates and opponents affect results. Injuries occur. Roles change. Opportunities arrive at different times. Even a well-played game may not produce the result you hoped for.","Your standard remains available regardless of circumstances.","It determines how you prepare when you are excited and when you are tired. It determines how you behave when you are praised and when you are criticized. It determines what teammates can expect from you when your role is large, when your role is small, and when your future feels uncertain.","A personal standard is not a demand that you perform perfectly.","It is a commitment to behaviors and values that should remain recognizable through changing circumstances.","The objective of this chapter is to define the standard you expect from yourself as a player, teammate, and person."]},{"h":"The Difference Between Goals And Standards","p":["I want to become one of the most trusted forwards on the team.","I ask questions when something is unclear.","I complete recovery work even when no one is watching.","This distinction is important because athletes often become overly focused on outcomes. When the desired result does not arrive quickly, motivation drops. The player may begin questioning whether the work matters.","A standard provides a way to succeed within the process.","You may not control whether you score tonight. You can control whether you arrive mentally prepared, attack the game with purpose, support teammates, compete through difficult shifts, and learn from what happens.","Standards create stability when outcomes fluctuate."]},{"h":"Your Standard Is What You Repeat","p":["A personal standard is not defined by your best day.","Most athletes can perform strong habits when they feel healthy, confident, rested, and motivated.","The standard becomes visible on the difficult days.","It appears when the team returns late from travel. It appears during a scoring drought. It appears after reduced ice time, an uncomfortable meeting, a poor practice, or a mistake that contributed to a goal against.","Your standard is revealed by what you repeatedly return to.","One poor response does not erase your standard. Every player becomes frustrated, distracted, or discouraged at times. The important question is how quickly you recognize that you have moved away from your standard and how deliberately you return to it.","A strong standard does not make you perfect."]},{"h":"Standards Must Be Observable","p":["A standard should describe behavior clearly enough that you can determine whether you followed it.","Statements such as “work hard,” “be better,” or “stay positive” may sound useful, but they are difficult to evaluate.","Does it mean finishing every drill with intent? Winning the race back into position? Remaining engaged while waiting for your next repetition? Completing prescribed recovery? Staying mentally present during video review?","What does being a good teammate look like?","Does it mean communicating on the ice, encouraging a teammate after a mistake, respecting every role, helping maintain team energy, or refusing to make personal frustration the team’s problem?","Does it mean controlling body language, avoiding retaliation, listening fully before responding, using a reset breath, or returning attention to the next play?","The more specific it becomes, the more effectively it can guide action."]},{"h":"The Standard Does Not Depend On Your Role","p":["A player’s role may change frequently, especially during his first season at a higher level.","There may be nights when you play important minutes and nights when opportunities are limited. You may move between lines, sit during certain situations, or be asked to contribute in a way that differs from the role you previously held.","A smaller role does not lower the standard for preparation, communication, practice habits, recovery, or respect.","In fact, the periods when your role is limited may be when your standard matters most.","Coaches notice whether a player remains engaged. Teammates notice whether his attitude changes. Staff notice whether he continues preparing seriously. These moments provide evidence about whether the player can be trusted with greater responsibility.","You cannot always control the role you receive.","You can control the quality with which you perform it."]},{"h":"Your Standard In Practice","p":["Practice is where many aspects of your identity are built.","Games are highly visible, but practice provides far more repetitions. It is where coaches observe learning, consistency, attention, response to feedback, and willingness to compete without the energy of a crowd.","arriving early enough to prepare without rushing;","understanding the purpose of the session;","executing drills correctly before trying to impress;","asking questions when assignments are unclear;","responding to correction without visible resistance;","finishing the session with the same attention used at the beginning;","completing recovery responsibilities afterward.","A player should not expect details ignored during the week to appear automatically under pressure."]},{"h":"Your Standard During Games","p":["A game standard should focus on controllable behaviors rather than demanding a specific statistical result.","You cannot promise yourself that you will score.","You can commit to skating with purpose, supporting the puck, finishing routes, getting inside the play, tracking responsibly, communicating, and responding to every shift.","preparing for the first shift before the puck is dropped;","beginning with simple, purposeful execution;","managing the puck according to time, score, and location;","staying prepared during periods of limited ice time;","supporting teammates regardless of personal production;","finishing the game with the same responsibility used to begin it.","The standard should remain intact whether you score two goals or record no points.","Production matters, but your behavior cannot be dependent upon it."]},{"h":"Your Standard After A Mistake","p":["Mistakes are unavoidable in a fast and complex game.","Attempting to eliminate every mistake can make a player cautious, hesitant, and afraid to make decisions. The objective is not to avoid all failure. The objective is to make increasingly better decisions and respond effectively when execution breaks down.","The moments immediately after a mistake are especially important.","showing frustration through body language;","returning attention to the next responsibility.","This means performing the next useful action before allowing frustration to control the moment.","A player who responds well to mistakes becomes easier to trust because coaches know that one error is less likely to become several."]},{"h":"Your Standard When Receiving Feedback","p":["Some feedback will be encouraging. Some will be direct, uncomfortable, or difficult to hear. The delivery may not always be ideal, but the player is still responsible for deciding how to use the information.","making sure you understand what is being requested;","separating the feedback from your personal worth;","following up when progress needs to be reviewed.","You are not required to agree immediately with every opinion.","You are required to listen carefully enough to understand it.","What specifically do you want me to do differently?","In which situations does this problem appear?","It is the ability to receive information, evaluate it honestly, and turn useful feedback into action."]},{"h":"Your Standard As A Teammate","p":["A team consists of players experiencing different roles, pressures, expectations, and personal circumstances.","A good teammate does not need to be the loudest person in the room. He does need to understand that his behavior affects other people.","communicating honestly and constructively;","celebrating team success without jealousy;","avoiding gossip and unnecessary division;","helping younger or newer teammates feel included;","handling personal disappointment without damaging the group;","being dependable during travel and team activities;","acknowledging the work of trainers, equipment staff, billets, coaches, and volunteers;","addressing conflict directly and appropriately;","refusing to embarrass teammates publicly or online.","A player’s character is often revealed by how he treats people who cannot improve his status.","Respect should not depend upon a person’s role, title, age, popularity, or influence."]},{"h":"Your Standard Away From The Rink","p":["Development does not stop when practice ends.","Decisions away from the rink affect energy, recovery, trust, health, and reputation.","treating billet families and hosts respectfully;","communicating schedules and needs clearly;","asking for help before an issue becomes unmanageable.","Living like a professional does not mean removing all enjoyment from life.","It means understanding that choices have consequences and accepting responsibility for those consequences.","Freedom and accountability must develop together."]},{"h":"Your Standard For Body Language","p":["Body language communicates before words do.","Coaches and teammates notice whether a player looks engaged, frustrated, dismissive, nervous, defeated, or ready.","Body language does not need to be artificially enthusiastic. Players have different personalities. Some are expressive, while others are quiet and composed.","The standard is not constant performance.","The standard is avoiding behavior that weakens trust or affects the team unnecessarily.","reacting dramatically to reduced ice time;","showing disgust toward a teammate’s mistake;","remaining seated or disengaged when the bench needs energy.","showing teammates that you remain involved.","Your body language should communicate that you are prepared for the next responsibility."]},{"h":"Your Standard Under Pressure","p":["Pressure may come from competition, expectations, scouts, statistics, injuries, family, social media, or your own ambitions.","A player may become focused on proving himself, avoiding mistakes, or controlling outcomes that cannot be controlled. The result can be rushed decisions, hesitation, frustration, and disconnection from the game.","Pressure does not always require a dramatic mental strategy.","Often it requires returning to the fundamentals of your role."]},{"h":"Your Minimum Standard","p":["Every player will have days when his energy, confidence, or physical readiness is lower than normal.","The minimum standard defines the behaviors that remain non-negotiable even on difficult days.","It should not require you to hide an injury, ignore illness, or pretend to be fully recovered. Honest communication with medical and performance staff is part of the standard.","The best available effort will not look identical every day.","The minimum standard concerns commitment and conduct, not pretending that physical and emotional capacity never changes."]},{"h":"Raising The Standard","p":["What once required conscious effort may become an established habit. At that point, a higher level of detail may deserve attention.","A young player may initially focus on arriving prepared and understanding assignments. Later, his standard may expand to include leadership, advanced tactical preparation, mentoring teammates, and managing the demands of a larger role.","Raising the standard does not mean constantly criticizing yourself.","It means recognizing when you are capable of more.","What behavior would make me more dependable?","What detail would separate me from other players with similar ability?","The standard should challenge you without becoming impossible to maintain.","A standard that demands perfection will eventually be ignored.","A strong standard is demanding, realistic, and repeatable."]},{"h":"Correcting A Broken Standard","p":["There will be moments when you fail to meet your own expectations.","You may react poorly, arrive unprepared, ignore recovery, become defensive, take an unnecessary penalty, or allow frustration to affect others.","Accountability does not require pretending that it did not happen.","It also does not require endless self-punishment.","1. Acknowledge it. State honestly what happened.","2. Take responsibility. Avoid blaming circumstances or other people for your response.","3. Repair what is necessary. Apologize, communicate, or correct the practical consequence.","4. Identify the trigger. Understand what made the standard difficult to maintain.","5. Choose the next action. Decide what you will do differently when the situation returns.","6. Move forward. Do not turn accountability into an excuse to remain stuck in the mistake.","A standard becomes stronger when it includes a reliable path back to it."]},{"h":"The Standard You Represent","p":["As your career develops, younger players may watch how you behave.","They may notice your preparation, confidence, equipment, skill, and success. They will also notice how you treat people, respond to correction, carry yourself after a loss, and act when your role is not what you hoped it would be.","Whether you intend to or not, your behavior teaches.","The standard you establish affects more than your own performance.","It contributes to the culture of the team and becomes part of how people remember playing with you.","What should people consistently experience when they work, compete, travel, and spend time with me?","The answer should be visible in daily life."]},{"h":"Personal Standard Assessment","p":["Describe how you currently prepare, practice, compete, recover, communicate, and respond to adversity.","Be honest about what is already strong and what remains inconsistent.","When is it easiest for me to operate at my best?","Consider confidence, role, sleep, preparation, health, team environment, and recent performance.","Which circumstances make it harder for me to maintain strong habits and behavior?","What do I tend to do when I become frustrated, embarrassed, disappointed, tired, or uncertain?","What does my body language communicate during those moments?","How might teammates or coaches experience my response?","What would a stronger response look like?"]},{"h":"My Non-Negotiable Standards","p":["Choose five to eight behaviors that should remain recognizable regardless of results, role, confidence, travel, fatigue, or outside pressure."]},{"h":"My Personal Standard Statement","p":["Use the work from this chapter to create a short statement describing how you intend to operate.","It should address preparation, competition, response to adversity, treatment of others, and responsibility away from the rink."]},{"h":"Daily Standard Check","p":["At the end of the day, answer each question honestly.","Preparation: Did I prepare with purpose?   ☐ Yes   ☐ Partially   ☐ No","Effort: Did I give the best effort available to me today?   ☐ Yes   ☐ Partially   ☐ No","Coachability: Did I listen and respond constructively to feedback?   ☐ Yes   ☐ Partially   ☐ No","Team: Did my behavior help the people around me?   ☐ Yes   ☐ Partially   ☐ No","Responsibility: Did I handle my commitments away from the rink?   ☐ Yes   ☐ Partially   ☐ No","Recovery: Did I support tomorrow’s performance through my choices today?   ☐ Yes   ☐ Partially   ☐ No","Response: Did I recover effectively from mistakes, frustration, or adversity?   ☐ Yes   ☐ Partially   ☐ No"]}]},{"n":"FOUR","title":"Long Term Vision","blocks":[{"h":"","p":["A hockey career develops one day at a time, but daily work becomes more meaningful when it is connected to a larger direction.","The purpose of a long-term vision is not to predict exactly what will happen.","No player can know with certainty which team he will play for several years from now, what role he will hold, how his body will develop, which coaches will influence him, or what opportunities and setbacks will appear.","A long-term vision creates direction without pretending that the future is guaranteed.","It helps you understand what you are working toward, why the work matters, and which qualities must be developed before the next opportunity arrives.","It should also remain flexible enough to change as you learn more about yourself, the game, and the demands of higher levels.","The goal is not to create pressure by deciding that only one future outcome will count as success.","The goal is to build a clear picture of the player and person you intend to become, then use that picture to guide the choices available today."]},{"h":"Direction Without Prediction","p":["Athletes are often asked where they expect to be in one year, three years, or five years.","These questions can be useful, but they can also create the false impression that a career should unfold according to a fixed schedule.","Development rarely follows a straight line.","One player may receive an early opportunity and then struggle. Another may require more time before his abilities become visible. A player may grow physically, change positions, discover a new role, suffer an injury, respond to a different coach, or develop a skill that changes the direction of his career.","Your vision should identify the direction of travel.","It should not become a deadline that causes you to judge every season as ahead or behind.","If I have not reached a certain level by a certain age, I have failed.","I am committed to becoming capable of succeeding at the highest level available to me, and I will continue evaluating the next step honestly.","This creates ambition without requiring certainty."]},{"h":"The Vision Must Include More Than A League","p":["A league, team, draft, contract, or roster position may be part of your vision.","A useful long-term vision should describe what kind of player would be capable of earning and sustaining those opportunities.","If your vision is only to play professional hockey, it does not tell you how that future player skates, thinks, competes, prepares, communicates, or handles adversity.","can create and finish offense against strong defenders;","is trusted in important defensive situations;","The player capable of sustaining the opportunity is the real development project."]},{"h":"Build The Player Before Chasing The Result","p":["It is natural to think about points, rankings, drafts, contracts, and advancement.","These outcomes provide motivation and can help define ambition.","They can also distract from the development required to earn them.","Why is another player receiving more attention?","What happens if I do not produce immediately?","These questions are understandable, but most of them do not create useful action.","What would I need to become capable of doing consistently for the next level to trust me?","That question returns attention to development.","The answer may involve skating, strength, decision-making, defensive responsibility, puck skill, emotional control, preparation, communication, or health.","Recognition often arrives after the evidence has been built.","The player’s responsibility is to build the evidence."]},{"h":"The One-Year Vision","p":["The one-year vision should be specific enough to guide the current season.","It may include the role you hope to earn, the habits you want to establish, the physical qualities you need to improve, and the skills you want to make more dependable.","Because one year is relatively close, this vision should be grounded in your current situation.","What will the next level of responsibility require?","Which part of my game most needs to improve this season?","What role would represent meaningful progress?","What physical development is realistic and appropriate?","What would coaches need to trust me to do?","What kind of teammate do I want to be known as by the end of the year?","What evidence would show that the season was productive even if every outcome did not go as planned?","A strong one-year vision should describe progress you can influence.","It may include statistical goals, but it should not depend entirely upon them.","Over the next year, I intend to become a dependable WHL forward who can play with pace, contribute in different situations, manage the puck under pressure, and earn greater responsibility through consistent preparation and two-way play.","That vision provides direction for training, practice, video review, and feedback."]},{"h":"The Three-Year Vision","p":["The three-year vision allows you to think beyond the immediate season.","By that point, your body, skill set, experience, and role may be significantly different.","The purpose is not to identify an exact team or contract.","The purpose is to imagine what a more developed version of your game could look like.","What level of competition do I want to be prepared for?","What qualities must become advanced rather than merely adequate?","What role do I want to be capable of handling?","What kind of physical maturity will the game require?","What weaknesses could limit advancement if they remain unchanged?","What leadership responsibilities might I be ready to accept?","What professional habits must become automatic?","What qualities would separate me from players with similar talent?","A three-year vision should encourage you to think about complete development.","A player who hopes to advance cannot rely indefinitely on one dominant strength.","Speed matters, but speed without decisions may become ineffective.","Skill matters, but skill without pace or pressure tolerance may disappear.","Physical strength matters, but strength without positioning or discipline may create little value.","Offense matters, but offensive ability without trust away from the puck may limit opportunity.","The three-year vision should describe how your qualities will work together."]},{"h":"The Five-Year Vision","p":["The five-year vision should be ambitious but open.","At this distance, too many variables exist to create a reliable prediction.","The value lies in considering the level of professionalism, maturity, and capability you hope to have developed.","What kind of player do I want to be capable of becoming?","What qualities would allow me to remain at that level?","What kind of reputation do I want to have among coaches and teammates?","What type of life do I want to be building away from hockey?","How do I want to handle money, education, relationships, and responsibility?","What kind of example do I want to provide for younger players?","What opportunities would I like hockey to create, even beyond playing?","The five-year vision should not force you to choose between total success and failure.","It should create a meaningful destination while recognizing that the exact route may change."]},{"h":"Vision And Sacrifice","p":["Training takes time. Recovery requires discipline. Travel affects relationships and school. Competition may require moving away from home. Opportunities may come with uncertainty, pressure, and reduced control over your schedule.","A long-term vision should help you decide which sacrifices are meaningful and which are unnecessary.","Not every sacrifice improves performance.","Sleeping less to perform extra low-quality training is not necessarily commitment.","Ignoring injury symptoms to appear tough may reduce future opportunity.","Separating yourself from all friendships and interests does not guarantee success.","Does this choice support the player and person I am trying to become?","Some sacrifices are temporary and purposeful.","Others can damage health, relationships, judgment, or enjoyment without providing meaningful development.","Your vision should help you distinguish discipline from self-destruction."]},{"h":"The Cost Of The Vision","p":["Ambition has a cost, but that cost should be understood rather than romanticized.","sacrificing education without a responsible plan;","allowing hockey to determine your entire personal worth.","A sustainable vision challenges you while protecting the person who is pursuing it."]},{"h":"Keeping The Vision Personal","p":["Coaches, parents, teammates, advisors, scouts, fans, and social media may all have opinions about what your career should become.","Others may create pressure, confusion, or comparison.","Your long-term vision should be informed by people you trust, but it must still belong to you.","Would I still pursue improvement if recognition arrived more slowly?","Which parts of the vision come from my own ambition?","Which parts come from fear of disappointing other people?","What would success mean to me beyond approval?","What kind of life do I hope hockey helps me build?","A vision borrowed entirely from someone else will be difficult to sustain when the work becomes hard."]},{"h":"Avoiding Comparison Timelines","p":["Comparison is difficult to avoid in competitive hockey.","You will see players who are bigger, faster, more highly ranked, more productive, or receiving opportunities you want.","It becomes harmful when another player’s timeline is treated as proof of your future.","Their bodies, roles, teams, opportunities, injuries, strengths, and support systems differ.","What part of my own development requires attention?","Am I improving relative to my previous standard?","Another player’s advancement does not remove your responsibility or your opportunity to develop."]},{"h":"Vision Must Become A Plan","p":["A vision without action becomes imagination.","Once you have described the future player, work backward.","What should improve during the next ninety days?","Become a fast, strong, intelligent two-way forward capable of playing professional hockey.","Be trusted against top competition, contribute consistently, and perform on special teams.","Improve skating power, decisions under pressure, and defensive reliability.","Develop stronger first-step acceleration and improve scanning before receiving the puck.","Complete prescribed skating work, review selected video clips, and track scanning habits during practice.","Enter practice with one skating cue and one awareness cue.","This process connects ambition to behavior.","The vision becomes useful when it changes what you do."]},{"h":"Reviewing The Vision","p":["Your long-term vision should be reviewed, not rewritten impulsively.","One poor game should not cause you to abandon it.","One strong game should not cause you to assume it has already been achieved.","when a major role or health change occurs.","What new opportunity or limitation has appeared?","A vision should evolve through evidence, not emotion alone."]},{"h":"Success Within The Vision","p":["The highest outcome may remain uncertain.","A season can be successful even when every desired result is not achieved.","You may become more dependable, physically prepared, skilled, resilient, self-aware, or coachable. You may learn to manage travel, pressure, nutrition, recovery, or adversity. You may discover a role that fits your game differently than expected.","They increase future capability and remain valuable beyond hockey.","A long-term vision should motivate serious ambition while allowing you to recognize meaningful growth along the way."]},{"h":"The Person Inside The Vision","p":["You are building more than a hockey player.","You are learning how to work, respond, communicate, lead, recover, and take responsibility.","These qualities will matter regardless of how long you play.","prepared to handle opportunity with maturity.","Hockey may provide the environment in which these qualities are tested."]},{"h":"Hold The Vision, Work The Day","p":["It can also become overwhelming if you attempt to live several years in the future.","You do not need to solve your entire career today.","You need to understand the direction and perform the next useful action.","Prepare for the current practice. Complete the current recovery session. Learn from the current game. Ask the current question. Improve the current habit.","The future player will be built through the quality of those actions."]},{"h":"Long-Term Vision Assessment","p":["Why do I want to continue pursuing hockey at a high level?","What experiences do I hope hockey provides?","What would make the pursuit meaningful even if the exact future changes?","At the highest level, what do I hope to accomplish as a player?","Which parts of this ambition are within my control?","The Player Capable of Reaching That Level"]},{"h":"My Long-Term Vision Statement","p":["Write a clear description of the player and person you intend to become.","Include the level of competition you hope to reach, the qualities you want to develop, the role you want to be capable of performing, and the way you intend to conduct yourself."]},{"h":"Vision Review","p":["Complete this review at scheduled points during the season.","What has changed since I created or last reviewed this vision?","Which areas have not progressed as expected?","Does the overall direction still feel meaningful?","Does any part of the vision need to change?"]}]},{"n":"FIVE","title":"My Development Team","blocks":[{"h":"","p":["Every player reaches higher levels with help from other people. Coaches teach systems, identify weaknesses, create opportunities, and establish expectations. Strength and conditioning professionals help build physical capacity. Athletic trainers and medical staff protect health and guide recovery. Teammates create the environment in which skills are practiced and tested. Family members, billet families, teachers, advisors, and mentors provide stability beyond the rink.","The player remains responsible for doing the work.","The development team helps make that work more informed, coordinated, and sustainable.","A strong development team is not simply a collection of people who support your ambitions. It is a group of people with different responsibilities, expertise, and perspectives who can help you make better decisions.","Some members of the team will challenge you.","Some will offer perspective when hockey begins to feel larger than everything else.","The purpose of this chapter is to identify the people involved in your development, understand the role each person should play, and establish how you will communicate with them."]},{"h":"You Are Responsible For The Center","p":["Your development team can provide information, structure, expertise, accountability, and support.","It cannot perform your responsibilities for you.","A coach can explain a correction, but you must apply it.","A strength coach can design a program, but you must complete it with the required intent.","A trainer can provide treatment, but you must communicate symptoms honestly and follow the recovery plan.","A nutrition professional can recommend a fueling strategy, but you must make the daily choices.","A parent, billet, mentor, or advisor can offer perspective, but you must learn to make increasingly responsible decisions.","The player belongs at the center of the development system—not because every decision belongs to him, but because his communication, effort, honesty, and follow-through connect the entire system.","As you mature, you should become more active in your own development.","take increasing responsibility without pretending to know everything.","You will not control every decision involving your role, schedule, health, or career. Ownership means taking full responsibility for the actions and communication that belong to you."]},{"h":"Different People Have Different Roles","p":["Problems often occur when responsibilities are unclear.","A player may ask a skills coach to resolve an injury issue that belongs with medical staff. A parent may attempt to interpret a tactical decision that should be discussed directly with a coach. A trainer may provide recovery guidance while someone outside the organization recommends additional work that conflicts with the team plan.","Support becomes less useful when everyone attempts to perform the same role.","A strong development system respects areas of responsibility.","The head coach may determine role, lineup decisions, tactical expectations, and team standards.","Assistant coaches may focus on specific systems, positions, special teams, video, and individual teaching.","Strength and conditioning staff may direct physical training, testing, workload, and return-to-performance progressions.","Athletic trainers and medical professionals may assess injuries, treatment needs, restrictions, and return-to-play decisions.","Nutrition professionals may guide fueling, hydration, recovery nutrition, and body-composition goals.","Skills coaches may support technical development when their work is coordinated with the team plan.","Family members and billets may support stability, transportation, meals, communication, rest, and life away from the rink.","Teachers and academic staff may help manage education through travel and competition.","Mentors and advisors may provide perspective, help evaluate important decisions, and protect against impulsive choices.","The player should know who is responsible for what."]},{"h":"The Head Coach","p":["The head coach has a broad responsibility to the team.","This includes performance, culture, roster decisions, player roles, team systems, discipline, and competitive results. The coach must consider the needs of the entire roster, not only the development preferences of one player.","This can make the coach’s perspective different from the player’s perspective.","A player may want more minutes, more offensive opportunities, or a particular linemate. The coach may be evaluating defensive reliability, practice habits, matchup needs, team balance, special-teams performance, consistency, and trust.","A productive relationship with the head coach begins with understanding this difference.","What must I do consistently to earn more responsibility?","Which parts of my game do you currently trust?","What does the team need from me right now?","Which habit should receive my greatest attention?","When would be an appropriate time to follow up?","Questions such as “Why am I not playing more?” may be understandable, but they can lead to a defensive conversation unless the player is prepared to hear a direct answer.","“I want to understand what I need to demonstrate more consistently. Can you help me identify the most important priority?”","The objective is not to make every conversation comfortable.","The objective is to leave with greater clarity."]},{"h":"Assistant And Positional Coaches","p":["Assistant coaches often provide more detailed and frequent individual instruction.","They may work with forwards or defensemen, special teams, faceoffs, video, tactical habits, or specific parts of team structure.","Because of this closer technical focus, assistant coaches can become important members of a player’s development team.","Use these relationships to clarify details such as routes, positioning, pressure responsibilities, puck support, entries and exits, wall play, defensive-zone coverage, forechecking reads, special-teams decisions, faceoff responsibilities, and individual video examples.","When speaking with an assistant coach, arrive with a specific question.","“On our defensive-zone coverage, I am sometimes uncertain about when I should hold the wall and when I should collapse inside. Can we review an example?”","Specific questions produce specific teaching.","Record the answer so it can become a practice cue rather than a conversation that is quickly forgotten."]},{"h":"Strength And Conditioning Staff","p":["The strength and conditioning staff helps develop the physical qualities required for performance.","Depending on the program, this may include strength, speed, power, conditioning, movement quality, mobility, testing, workload management, warm-ups, recovery, offseason planning, and return-to-performance progressions.","The player’s responsibility is not simply to complete exercises.","He should learn the purpose of the training phase, which quality each exercise develops, what correct execution feels like, what level of effort is intended, when a load is too heavy to perform correctly, when pain or restriction should be reported, and how training changes during games, travel, and recovery periods.","Adding unscheduled workouts, conditioning, or skill sessions may interfere with the program, especially during a demanding season. Fatigue from extra training may reduce practice quality, slow recovery, or increase injury risk.","Before adding outside physical work, communicate with the team’s performance staff.","“I would like to improve this quality. How can I address it without interfering with the current program?”","A coordinated plan is usually more effective than several separate plans competing with one another."]},{"h":"Athletic Trainers And Medical Staff","p":["A player may fear losing ice time, disappointing the team, appearing weak, or being treated differently after reporting symptoms. These concerns are real, but hiding health information can create greater risk.","Pain, illness, concussion symptoms, unusual fatigue, restricted movement, or changes in function should be reported to the appropriate staff member.","This is particularly important when symptoms involve headache, dizziness, confusion, vision changes, balance problems, nausea, unusual sensitivity to light or noise, weakness, numbness, difficulty breathing, chest pain, severe or increasing pain, inability to move normally, or symptoms that worsen during activity.","The journal should never be used to privately track symptoms that medical staff need to know.","Record keeping can improve communication, but it cannot replace evaluation.","The player should understand who to contact, when to report, what restrictions are in place, which treatments have been prescribed, what activities are allowed, what progression is required, who makes the return-to-play decision, and when follow-up should occur.","Following the process is part of professional responsibility."]},{"h":"Nutrition Professionals","p":["Performance nutrition becomes increasingly important as training, travel, growth, and competition demands increase.","A qualified sports dietitian or nutrition professional may help with daily energy needs, game-day fueling, post-training recovery, hydration, travel food, body-composition objectives, gaining strength or mass, maintaining energy through a long season, food allergies or intolerances, supplement evaluation, and meal planning.","Nutrition advice should be individualized.","A strategy that works for another player may not match your body, schedule, health, or performance needs.","Be cautious with advice from social media, supplement companies, influencers, and people who do not understand the demands of your sport.","A professional nutrition relationship requires honest information.","This may include what you actually eat, which meals you miss, when appetite is low, gastrointestinal problems, energy changes, weight changes, food access during travel, financial or practical limitations, supplements being used, and concerns about body image or eating.","The objective is to create a plan that can actually be followed."]},{"h":"Skills Coaches","p":["An outside or specialized skills coach can help develop technical areas such as skating, shooting, puck control, passing, deception, and position-specific execution.","This support can be valuable when it is connected to the player’s actual needs.","Problems arise when training focuses on impressive drills that do not transfer to games, or when an outside coach gives advice that conflicts with team systems and expectations.","Before beginning additional skills work, identify the specific development need, the evidence supporting that need, how the skill appears in games, what the team coaches have requested, how progress will be measured, and how the work fits the current training load.","A good skills coach should be willing to coordinate with the larger development plan."]},{"h":"Teammates","p":["Teammates are part of the development environment.","They compete with you for roles and opportunities, but they also help you improve every day.","Strong teammates provide practice pressure, honest feedback, tactical c
