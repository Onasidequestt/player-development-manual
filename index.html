ctical or decision-making priority","Recovery or lifestyle priority","Personal or team priority","Weekly Actions","The actions that should appear during a normal week are:","Daily Behaviors","The behaviors I can control today are:"],"w":["Five-Year Direction","The player and person I am trying to become:",3,"Three-Year Capability","To move toward that vision, I must become capable of:",3,"One-Year Development","During the next year, I need to improve:",3,"Ninety-Day Priorities","Hockey skill priority",1,"Physical priority",1,"Tactical or decision-making priority",1,"Recovery or lifestyle priority",1,"Personal or team priority",1,"Weekly Actions","The actions that should appear during a normal week are:",3,"Daily Behaviors","The behaviors I can control today are:",3]},{"h":"Development Milestones","p":["A milestone is evidence that you are moving toward the vision. It is not a guarantee of a particular outcome.","Milestone 1","The development milestone is:","Why it matters:","What evidence will show it has been reached:","Target review period:","Milestone 2","The development milestone is:","Why it matters:","What evidence will show it has been reached:","Target review period:","Milestone 3","The development milestone is:","Why it matters:","What evidence will show it has been reached:","Target review period:","Milestone 4","The development milestone is:","Why it matters:","What evidence will show it has been reached:","Target review period:","Milestone 5","The development milestone is:","Why it matters:","What evidence will show it has been reached:","Target review period:"],"w":["A milestone is evidence that you are moving toward the vision. It is not a guarantee of a particular outcome.","Milestone 1","The development milestone is:",1,"Why it matters:",1,"What evidence will show it has been reached:",1,"Target review period:",1,"Milestone 2","The development milestone is:",1,"Why it matters:",1,"What evidence will show it has been reached:",1,"Target review period:",1,"Milestone 3","The development milestone is:",1,"Why it matters:",1,"What evidence will show it has been reached:",1,"Target review period:",1,"Milestone 4","The development milestone is:",1,"Why it matters:",1,"What evidence will show it has been reached:",1,"Target review period:",1,"Milestone 5","The development milestone is:",1,"Why it matters:",1,"What evidence will show it has been reached:",1,"Target review period:",1]},{"h":"People Who Support The Vision","p":["Family","The support I need from my family is:","The responsibilities I have to my family are:","Coaches","The support and feedback I need from coaches are:","The responsibilities I have to my coaches are:","Strength, Medical, and Performance Staff","The support I need from performance staff is:","The information I must communicate honestly is:","Teammates","The support I need from teammates is:","The support I will provide to teammates is:","Mentors or Advisors","The people I can speak with about career decisions, pressure, or perspective are:"],"w":["Family","The support I need from my family is:",2,"The responsibilities I have to my family are:",2,"Coaches","The support and feedback I need from coaches are:",2,"The responsibilities I have to my coaches are:",2,"Strength, Medical, and Performance Staff","The support I need from performance staff is:",2,"The information I must communicate honestly is:",2,"Teammates","The support I need from teammates is:",2,"The support I will provide to teammates is:",2,"Mentors or Advisors","The people I can speak with about career decisions, pressure, or perspective are:",2]},{"h":"If The Path Changes","p":["An injury, role change, roster decision, personal event, or new opportunity may alter the path.","If my path changes, I want to remember:","The qualities I will still control are:","The people I will communicate with are:","The questions I will ask before making a major decision are:"],"w":["An injury, role change, roster decision, personal event, or new opportunity may alter the path.","If my path changes, I want to remember:",2,"The qualities I will still control are:",2,"The people I will communicate with are:",2,"The questions I will ask before making a major decision are:",3]},{"h":"My Long-Term Vision Statement","p":["Write a clear description of the player and person you intend to become.","Include the level of competition you hope to reach, the qualities you want to develop, the role you want to be capable of performing, and the way you intend to conduct yourself.","Working Draft","Final Long-Term Vision"],"w":["Write a clear description of the player and person you intend to become.","Include the level of competition you hope to reach, the qualities you want to develop, the role you want to be capable of performing, and the way you intend to conduct yourself.","Working Draft",6,"Final Long-Term Vision",6]},{"h":"Vision Review","p":["Complete this review at scheduled points during the season.","What has changed since I created or last reviewed this vision?","What progress is supported by evidence?","Which areas have not progressed as expected?","What have I learned about my game?","Does the overall direction still feel meaningful?","Explain:","Does any part of the vision need to change?","My next development priority is:","The action I will take this week is:"],"w":["Complete this review at scheduled points during the season.","Review date: ___","Current team and role: ___","What has changed since I created or last reviewed this vision?",3,"What progress is supported by evidence?",3,"Which areas have not progressed as expected?",3,"What have I learned about my game?",3,"Does the overall direction still feel meaningful?","☐ Yes   ☐ Mostly   ☐ Uncertain   ☐ No","Explain:",2,"Does any part of the vision need to change?",2,"My next development priority is:",2,"The action I will take this week is:",2]},{"h":"Chapter Commitment","p":["I understand that a long-term vision provides direction, not certainty.","I will pursue ambitious goals without allowing one outcome, ranking, draft, team, statistic, or timeline to determine my entire sense of success.","I will focus on becoming the player capable of earning future opportunities rather than focusing only on whether those opportunities have already arrived.","I will review my vision honestly as my game, body, role, and understanding develop.","I will accept the meaningful work and sacrifice required while protecting my health, character, education, and important relationships.","I will avoid allowing another player’s timeline to define my own.","I will hold the long-term vision while returning my attention to the work available today."]}]},{"n":"FIVE","title":"My Development Team","blocks":[{"h":"","p":["Individual performance is visible.","Development is rarely individual.","Every player reaches higher levels with help from other people. Coaches teach systems, identify weaknesses, create opportunities, and establish expectations. Strength and conditioning professionals help build physical capacity. Athletic trainers and medical staff protect health and guide recovery. Teammates create the environment in which skills are practiced and tested. Family members, billet families, teachers, advisors, and mentors provide stability beyond the rink.","The player remains responsible for doing the work.","The development team helps make that work more informed, coordinated, and sustainable.","A strong development team is not simply a collection of people who support your ambitions. It is a group of people with different responsibilities, expertise, and perspectives who can help you make better decisions.","Some members of the team will challenge you.","Some will protect you.","Some will provide technical knowledge.","Some will offer perspective when hockey begins to feel larger than everything else.","The purpose of this chapter is to identify the people involved in your development, understand the role each person should play, and establish how you will communicate with them."]},{"h":"You Are Responsible For The Center","p":["Your development team can provide information, structure, expertise, accountability, and support.","It cannot perform your responsibilities for you.","A coach can explain a correction, but you must apply it.","A strength coach can design a program, but you must complete it with the required intent.","A trainer can provide treatment, but you must communicate symptoms honestly and follow the recovery plan.","A nutrition professional can recommend a fueling strategy, but you must make the daily choices.","A parent, billet, mentor, or advisor can offer perspective, but you must learn to make increasingly responsible decisions.","The player belongs at the center of the development system—not because every decision belongs to him, but because his communication, effort, honesty, and follow-through connect the entire system.","As you mature, you should become more active in your own development.","This means learning to:","understand why work is being prescribed;","recognize when something is unclear;","ask useful questions;","communicate concerns early;","identify conflicting advice;","record important feedback;","follow through on agreed actions;","report progress accurately;","take increasing responsibility without pretending to know everything.","Ownership is not the same as control.","You will not control every decision involving your role, schedule, health, or career. Ownership means taking full responsibility for the actions and communication that belong to you."]},{"h":"Different People Have Different Roles","p":["Problems often occur when responsibilities are unclear.","A player may ask a skills coach to resolve an injury issue that belongs with medical staff. A parent may attempt to interpret a tactical decision that should be discussed directly with a coach. A trainer may provide recovery guidance while someone outside the organization recommends additional work that conflicts with the team plan.","Support becomes less useful when everyone attempts to perform the same role.","A strong development system respects areas of responsibility.","The head coach may determine role, lineup decisions, tactical expectations, and team standards.","Assistant coaches may focus on specific systems, positions, special teams, video, and individual teaching.","Strength and conditioning staff may direct physical training, testing, workload, and return-to-performance progressions.","Athletic trainers and medical professionals may assess injuries, treatment needs, restrictions, and return-to-play decisions.","Nutrition professionals may guide fueling, hydration, recovery nutrition, and body-composition goals.","Skills coaches may support technical development when their work is coordinated with the team plan.","Family members and billets may support stability, transportation, meals, communication, rest, and life away from the rink.","Teachers and academic staff may help manage education through travel and competition.","Mentors and advisors may provide perspective, help evaluate important decisions, and protect against impulsive choices.","The player should know who is responsible for what.","When the answer is unclear, ask."]},{"h":"The Head Coach","p":["The head coach has a broad responsibility to the team.","This includes performance, culture, roster decisions, player roles, team systems, discipline, and competitive results. The coach must consider the needs of the entire roster, not only the development preferences of one player.","This can make the coach’s perspective different from the player’s perspective.","A player may want more minutes, more offensive opportunities, or a particular linemate. The coach may be evaluating defensive reliability, practice habits, matchup needs, team balance, special-teams performance, consistency, and trust.","A productive relationship with the head coach begins with understanding this difference.","Useful questions for a head coach include:","What role do you currently see for me?","What must I do consistently to earn more responsibility?","Which parts of my game do you currently trust?","What is limiting my role?","What does the team need from me right now?","Which habit should receive my greatest attention?","How will I know that I am improving?","When would be an appropriate time to follow up?","These questions focus on action.","Questions such as “Why am I not playing more?” may be understandable, but they can lead to a defensive conversation unless the player is prepared to hear a direct answer.","A stronger approach is:","“I want to understand what I need to demonstrate more consistently. Can you help me identify the most important priority?”","The objective is not to make every conversation comfortable.","The objective is to leave with greater clarity."]},{"h":"Assistant And Positional Coaches","p":["Assistant coaches often provide more detailed and frequent individual instruction.","They may work with forwards or defensemen, special teams, faceoffs, video, tactical habits, or specific parts of team structure.","Because of this closer technical focus, assistant coaches can become important members of a player’s development team.","Use these relationships to clarify details such as routes, positioning, pressure responsibilities, puck support, entries and exits, wall play, defensive-zone coverage, forechecking reads, special-teams decisions, faceoff responsibilities, and individual video examples.","When speaking with an assistant coach, arrive with a specific question.","Instead of asking, “How do I get better defensively?” ask:","“On our defensive-zone coverage, I am sometimes uncertain about when I should hold the wall and when I should collapse inside. Can we review an example?”","Specific questions produce specific teaching.","Record the answer so it can become a practice cue rather than a conversation that is quickly forgotten."]},{"h":"Strength And Conditioning Staff","p":["The strength and conditioning staff helps develop the physical qualities required for performance.","Depending on the program, this may include strength, speed, power, conditioning, movement quality, mobility, testing, workload management, warm-ups, recovery, offseason planning, and return-to-performance progressions.","The player’s responsibility is not simply to complete exercises.","He should learn the purpose of the training phase, which quality each exercise develops, what correct execution feels like, what level of effort is intended, when a load is too heavy to perform correctly, when pain or restriction should be reported, and how training changes during games, travel, and recovery periods.","More work is not always better work.","Adding unscheduled workouts, conditioning, or skill sessions may interfere with the program, especially during a demanding season. Fatigue from extra training may reduce practice quality, slow recovery, or increase injury risk.","Before adding outside physical work, communicate with the team’s performance staff.","A useful question is:","“I would like to improve this quality. How can I address it without interfering with the current program?”","A coordinated plan is usually more effective than several separate plans competing with one another."]},{"h":"Athletic Trainers And Medical Staff","p":["Medical communication must be honest.","A player may fear losing ice time, disappointing the team, appearing weak, or being treated differently after reporting symptoms. These concerns are real, but hiding health information can create greater risk.","Pain, illness, concussion symptoms, unusual fatigue, restricted movement, or changes in function should be reported to the appropriate staff member.","This is particularly important when symptoms involve headache, dizziness, confusion, vision changes, balance problems, nausea, unusual sensitivity to light or noise, weakness, numbness, difficulty breathing, chest pain, severe or increasing pain, inability to move normally, or symptoms that worsen during activity.","The journal should never be used to privately track symptoms that medical staff need to know.","Record keeping can improve communication, but it cannot replace evaluation.","The player should understand who to contact, when to report, what restrictions are in place, which treatments have been prescribed, what activities are allowed, what progression is required, who makes the return-to-play decision, and when follow-up should occur.","Returning too early may delay recovery.","Following the process is part of professional responsibility."]},{"h":"Nutrition Professionals","p":["Performance nutrition becomes increasingly important as training, travel, growth, and competition demands increase.","A qualified sports dietitian or nutrition professional may help with daily energy needs, game-day fueling, post-training recovery, hydration, travel food, body-composition objectives, gaining strength or mass, maintaining energy through a long season, food allergies or intolerances, supplement evaluation, and meal planning.","Nutrition advice should be individualized.","A strategy that works for another player may not match your body, schedule, health, or performance needs.","Be cautious with advice from social media, supplement companies, influencers, and people who do not understand the demands of your sport.","A professional nutrition relationship requires honest information.","This may include what you actually eat, which meals you miss, when appetite is low, gastrointestinal problems, energy changes, weight changes, food access during travel, financial or practical limitations, supplements being used, and concerns about body image or eating.","The objective is not judgment.","The objective is to create a plan that can actually be followed."]},{"h":"Skills Coaches","p":["An outside or specialized skills coach can help develop technical areas such as skating, shooting, puck control, passing, deception, and position-specific execution.","This support can be valuable when it is connected to the player’s actual needs.","Problems arise when training focuses on impressive drills that do not transfer to games, or when an outside coach gives advice that conflicts with team systems and expectations.","Before beginning additional skills work, identify the specific development need, the evidence supporting that need, how the skill appears in games, what the team coaches have requested, how progress will be measured, and how the work fits the current training load.","A good skills coach should be willing to coordinate with the larger development plan.","The objective is not to collect drills.","The objective is to improve performance."]},{"h":"Teammates","p":["Teammates are part of the development environment.","They compete with you for roles and opportunities, but they also help you improve every day.","Strong teammates provide practice pressure, honest feedback, tactical communication, accountability, emotional support, examples of effective habits, knowledge about opponents and situations, and energy during difficult periods.","You can learn from teammates without copying them completely.","Observe how experienced players prepare, communicate, organize equipment, use video, recover, manage travel, speak with coaches, respond after poor games, handle reduced roles, and interact with staff.","Ask respectful questions.","A veteran player may be able to explain a league, travel demand, tactical detail, or professional habit in a way that is immediately useful.","You also have responsibilities to teammates.","Do not treat relationships only as sources of personal benefit.","Offer communication, effort, encouragement, honesty, and respect in return."]},{"h":"Family","p":["Family support may include years of transportation, financial sacrifice, emotional encouragement, equipment, travel, meals, scheduling, and time.","As the player becomes more independent, the family’s role may change.","Parents and relatives may no longer have access to every conversation, practice, decision, or detail. This transition can be difficult for both the player and the family.","Healthy family support may include listening, maintaining perspective, helping with practical needs, encouraging honest communication, recognizing effort and growth, providing a stable relationship outside performance, helping evaluate major decisions, and respecting appropriate boundaries with coaches and staff.","Family involvement becomes less helpful when every game is analyzed immediately, every coach decision is challenged, or the player feels responsible for managing a family member’s emotional response to performance.","A player should be able to communicate what kind of support is useful.","For example:","“After games, I may need some time before discussing the performance. It helps me more when you ask how I am doing before asking about the game.”","The player should also remain grateful and respectful.","Independence does not remove appreciation."]},{"h":"Billet Families","p":["For many junior players, a billet family becomes an important part of daily life.","Billets may provide housing, meals, transportation, stability, encouragement, and a place to recover away from the rink.","Living in another person’s home requires maturity.","The player should communicate clearly about schedules, meals, travel, transportation, guests, curfews, household rules, laundry, shared spaces, allergies, sleep needs, and changes in plans.","Respect appears through ordinary behavior.","Clean up after yourself. Help when appropriate. Communicate before schedules change. Express appreciation. Avoid treating the home like a hotel.","If a problem develops, address it early and respectfully. When necessary, involve the team’s billet coordinator or another appropriate staff member.","The billet relationship can become one of the most meaningful parts of junior hockey when both sides communicate well."]},{"h":"Teachers And Academic Support","p":["Education remains part of development.","Travel, games, practices, fatigue, and schedule changes can make school more difficult, but they do not remove the responsibility.","Teachers and academic coordinators can help when the player communicates before problems become urgent.","A strong academic communication standard includes knowing assignment deadlines, understanding travel expectations, asking for work in advance, using road time effectively, attending required sessions, explaining conflicts early, requesting help before falling significantly behind, and taking responsibility for missed work.","Education protects future options.","Even for a player fully committed to hockey, careers can change quickly. Academic skills, discipline, communication, and completed credentials remain valuable."]},{"h":"Agents, Advisors, And Career Representatives","p":["An agent, advisor, or family representative may help with contracts, career decisions, communication, professional opportunities, and long-term planning.","This person should not replace direct communication between the player and the team for ordinary development matters.","The player should understand what the representative is responsible for, how the person is compensated, which decisions require consultation, what information is being communicated, whether advice creates conflicts, who ultimately makes the decision, and what promises can and cannot realistically be made.","A good representative provides clear information rather than constant reassurance.","Be cautious of people who guarantee outcomes they do not control, create unnecessary conflict with teams, discourage independent questions, use pressure to force rapid decisions, exaggerate access or influence, avoid explaining fees or agreements, or tell the player only what he wants to hear.","Career guidance should protect long-term interests, not simply reduce short-term discomfort."]},{"h":"Mentors","p":["A mentor may be a former player, coach, family friend, teacher, relative, or trusted adult who provides perspective.","The mentor’s value often comes from being slightly removed from daily team decisions.","A mentor may help you process disappointment, evaluate feedback, prepare for a difficult conversation, maintain perspective, think through a major decision, recognize repeated patterns, separate emotion from action, and remember who you are outside hockey.","The mentor should not become another person attempting to control your career.","The most useful mentors ask strong questions and help you think clearly."]},{"h":"Mental Performance And Mental Health Support","p":["Mental performance and mental health are related, but they are not identical.","A mental-performance coach may help with focus, confidence, routines, visualization, emotional regulation, competition preparation, response to mistakes, and pressure management.","A licensed mental-health professional may help address anxiety, depression, grief, trauma, panic, severe stress, relationship problems, substance concerns, disordered eating, loss of enjoyment, thoughts of self-harm, or other mental-health conditions.","Seeking help is not evidence that a player is weak or uncommitted.","It is responsible use of expertise.","If mental or emotional symptoms begin affecting sleep, school, relationships, health, safety, or daily function, communicate with a qualified adult or professional.","Performance strategies should not be used to hide a health problem that requires treatment."]},{"h":"Who Should Know What","p":["Not every member of the development team needs every piece of information.","Medical details should be shared according to appropriate privacy and team procedures.","A skills coach may need to know about movement restrictions but may not need the full medical history.","A teacher may need to understand travel demands but not tactical concerns.","A family member may need to know that the player is struggling without receiving every detail of a private coach conversation.","The player should learn to ask who needs this information, why they need it, what the appropriate level of detail is, whether the information is private, whether withholding it creates a health or safety risk, and who can help decide what should be shared.","Privacy should be respected.","Privacy should not become secrecy that places the player or others at risk."]},{"h":"Coordinating Advice","p":["A developing player may receive advice from many sources.","The advice may be sincere and still conflict.","One coach may want faster puck movement. Another may emphasize possession. A skills coach may encourage creativity. A team coach may need lower-risk decisions in a particular role. A strength coach may reduce workload while the player feels pressure to train more.","When advice conflicts, do not attempt to satisfy everyone privately.","Clarify the context.","Ask whether the advice applies to the same situation, whether one person is discussing technique while another is discussing tactics, whether one person has greater responsibility for the decision, whether the advice fits the current team role, whether there is a health or workload concern, and whether the relevant people can communicate directly.","The team’s coaches, performance staff, and medical staff generally need to remain informed about outside training that could affect performance, fatigue, or health.","Coordination protects development."]},{"h":"Asking Better Questions","p":["The quality of the answer often depends upon the quality of the question.","Weak questions are broad, emotional, or focused only on outcomes.","Examples include:","Am I doing okay?","Why does the coach not like me?","How do I get more points?","Do you think I will make it?","What is wrong with my game?","These questions may reflect genuine concerns, but they are difficult to answer productively.","Stronger questions are specific and connected to action:","Which part of my defensive positioning is currently least dependable?","What did you see on the turnover in the second period?","What does the coaching staff need from me on the forecheck?","Which physical quality should be my priority during this training phase?","How should I fuel before a late game after a day of travel?","What symptom would mean I should stop and report immediately?","What behavior would show you that I have applied this feedback?","When should we review progress again?","A useful question reduces uncertainty and identifies a next step."]},{"h":"Preparing For A Development Conversation","p":["Do not approach every important conversation without preparation.","Before meeting with a coach, trainer, advisor, or mentor, write down the purpose of the conversation, the most important question, relevant examples, what you currently understand, what remains unclear, what decision may be required, and what action you are prepared to take.","During the conversation, listen fully, take notes where appropriate, ask for clarification, avoid arguing before understanding, summarize what you heard, confirm the next action, and identify when follow-up should occur.","After the conversation, record the key lesson, translate it into behavior, complete the agreed action, and return for follow-up when necessary.","Good communication is a development skill."]},{"h":"Disagreement Within The Development Team","p":["There may be times when you disagree with a coach, trainer, advisor, family member, or other person involved in your development.","Disagreement does not automatically mean disrespect.","The way you handle it matters.","Begin by making sure you understand the decision or instruction.","Ask for the reasoning.","Describe your concern without accusation.","Use specific examples.","Recognize the other person’s responsibility.","When appropriate, request another conversation after emotions have settled.","A useful approach might be:","“I want to make sure I understand the expectation. My concern is that I am experiencing pain during this movement. Can we review whether I should continue or be evaluated?”","Or:","“I understand that my role is currently limited. I would like to know which two behaviors would most help me earn greater trust.”","If a concern involves safety, abuse, harassment, serious health risk, or unethical conduct, speak with another trusted adult or appropriate authority rather than attempting to manage it alone.","Respect does not require silence when something is unsafe."]},{"h":"Trust Is Built Through Follow-Through","p":["People become more willing to invest in a player who follows through.","If you ask for feedback and ignore it, future conversations lose value.","If you report a problem but do not follow the agreed recovery plan, trust weakens.","If you request additional training and then approach it without effort, the opportunity may not continue.","Follow-through means doing what you agreed to do, communicating when circumstances change, reporting the result honestly, asking for help when the plan is not working, returning for review, and taking responsibility when you did not complete the action.","Trust does not require perfect execution.","It requires honesty and reliability."]},{"h":"Warning Signs In A Development Relationship","p":["Most people involved in hockey want to help.","Players should still recognize relationships that may be unhealthy or inappropriate.","Warning signs may include someone who asks you to hide important information from parents, medical staff, or the team; pressures you to train through serious pain or concussion symptoms; guarantees advancement, contracts, or selections; demands personal loyalty over your health or judgment; isolates you from other trusted people; uses humiliation as a regular method of control; retaliates when reasonable questions are asked; encourages illegal or unsafe behavior; provides unapproved substances or supplements; makes inappropriate sexual comments or contact; requests private communication that violates team or family rules; creates financial arrangements that are unclear; or threatens your career to prevent disclosure.","If something feels unsafe, manipulative, or inappropriate, speak with a trusted adult and the appropriate team or legal authority.","No development opportunity is worth accepting abuse or exploitation."]},{"h":"The Player’s Communication Standard","p":["A professional communication standard includes honesty, clarity, respect, appropriate timing, directness, listening, confidentiality where appropriate, willingness to ask questions, willingness to receive difficult answers, and follow-through.","Avoid relying on rumors, indirect messages, and assumptions.","When possible, speak directly with the person responsible.","Do not ask several people the same question only to choose the answer you prefer.","Do not use family members, teammates, or advisors to communicate ordinary concerns that you are capable of addressing appropriately yourself.","Learning to have direct and respectful conversations is part of becoming a professional."]},{"h":"Building A Team That Can Challenge You","p":["Support does not always feel encouraging.","Sometimes the most useful person is the one willing to tell you something difficult.","A strong development team should include people who can recognize your progress, identify blind spots, challenge excuses, protect your health, distinguish confidence from overconfidence, remind you of the larger perspective, support ambition without making unrealistic promises, tell you when more work is needed, tell you when rest is needed, and help you make decisions based on evidence.","Do not surround yourself only with people who agree with you.","Do not assume that criticism is automatically accurate either.","Look for people who are knowledgeable, honest, consistent, and committed to your long-term well-being."]},{"h":"Gratitude And Professional Relationships","p":["Development involves the time and work of many people.","Express appreciation.","Thank coaches for specific help. Respect appointments. Arrive prepared. Communicate when plans change. Recognize trainers, equipment staff, billets, teachers, volunteers, drivers, and support personnel.","Gratitude should be genuine rather than strategic.","People should not be treated well only because they may influence your career.","Professional relationships are built through ordinary respect."]},{"h":"Your Team Will Change","p":["The people involved in your development will change over time.","Coaches move. Teams change. Roles evolve. New specialists become necessary. Some relationships remain important for years, while others belong to a particular stage.","A change does not erase the value of what someone contributed.","Continue evaluating who is currently responsible for each area, which relationships are productive, where communication is missing, whether any important perspective is absent, whether someone is performing a role beyond his or her expertise, whether a relationship has become unhealthy, who should be added, and who no longer needs to be involved in the same way.","The development team should evolve with the player."]},{"h":"Becoming Your Own Advocate","p":["As you become older, the responsibility for communication should gradually shift toward you.","Self-advocacy means communicating your needs, questions, and concerns clearly.","It does not mean demanding every preferred outcome.","A player who can advocate for himself is able to say:","I do not understand this assignment.","I need clarification.","I am experiencing pain.","I am concerned about my recovery.","I would like feedback on this part of my game.","I need help managing school and travel.","I disagree, but I want to understand.","I made a mistake.","I need support.","I am ready for greater responsibility.","I understand what I need to demonstrate.","These conversations may feel uncomfortable.","They become easier through preparation and practice.","A player who communicates directly and respectfully becomes better prepared for every level of sport and life."]},{"h":"Development Team Map","p":["The Player at the Center","My responsibilities within the development team are:","The information I must communicate honestly is:","The actions only I can complete are:","The areas in which I need more guidance are:"],"w":["The Player at the Center","My responsibilities within the development team are:",3,"The information I must communicate honestly is:",2,"The actions only I can complete are:",2,"The areas in which I need more guidance are:",2]},{"h":"Current Development Team","p":["Head Coach","Assistant or Positional Coach","Strength and Conditioning Coach","Athletic Trainer","Team Physician or Medical Professional","Nutrition Professional","Skills Coach","Academic Contact","Billet or Household Support","Family Contact","Agent, Advisor, or Career Representative","Mentor","Mental Performance or Mental Health Support"],"w":["Head Coach","Name: ___","Primary responsibilities: ___",1,"What this person currently expects from me: ___",1,"What I need to communicate: ___",1,"My most important current question: ___",1,"Next planned conversation: ___","Assistant or Positional Coach","Name: ___","Primary responsibilities: ___",1,"The part of my game we work on: ___",1,"Current feedback: ___",1,"Next action: ___",1,"Strength and Conditioning Coach","Name: ___","Current training phase: ___","Primary physical objective: ___",1,"Restrictions or workload considerations: ___",1,"What I need to report: ___",1,"Next review or test: ___","Athletic Trainer","Name: ___","When I should contact this person: ___",1,"Current health, treatment, or recovery instructions: ___",2,"Next follow-up: ___","Team Physician or Medical Professional","Name: ___","Role: ___","Relevant instructions or restrictions: ___",1,"Next follow-up, if applicable: ___","Nutrition Professional","Name: ___","Current nutri rantees a selection, contract, or advancement","☐ Requests secrecy that creates a safety concern","☐ Uses threats or humiliation to control me","☐ Is physically, sexually, or verbally inappropriate","☐ Is unclear about money, fees, or agreements","☐ Attempts to isolate me from trusted people","☐ Retaliates when I ask a reasonable question","☐ Encourages illegal, dangerous, or unethical behavior","☐ Other: ___","The trusted people I can contact are:","1. ___","2. ___","3. ___","The team or organizational contact is:",1,"The emergency contact is:",1]},{"h":"My Support Gaps","p":["Which area of my development currently lacks enough support?","What type of expertise or relationship may be missing?","Who can help me identify the right person?","What action will I take?"],"w":["Which area of my development currently lacks enough support?",2,"What type of expertise or relationship may be missing?",2,"Who can help me identify the right person?",2,"What action will I take?",2]},{"h":"Quarter-Season Development Team Review","p":["Which relationships have been most useful?","Where has communication improved?","Which feedback have I applied successfully?","Where have I failed to follow through?","Is any advice conflicting or unclear?","Does anyone need to be added to the team?","Does any relationship or role need to change?","The most important conversation I need to have is:","The action I will take this week is:"],"w":["Review date: ___","Which relationships have been most useful?",3,"Where has communication improved?",3,"Which feedback have I applied successfully?",3,"Where have I failed to follow through?",3,"Is any advice conflicting or unclear?",3,"Does anyone need to be added to the team?",2,"Does any relationship or role need to change?",2,"The most important conversation I need to have is:",2,"The action I will take this week is:",2]},{"h":"My Development Team Standard","p":["I will communicate with my development team by:","I will prepare for important conversations by:","I will respond to feedback by:","I will handle disagreement by:","I will report health concerns by:","I will demonstrate gratitude by:","I will build trust through:"],"w":["I will communicate with my development team by:",2,"I will prepare for important conversations by:",2,"I will respond to feedback by:",2,"I will handle disagreement by:",2,"I will report health concerns by:",2,"I will demonstrate gratitude by:",2,"I will build trust through:",2]},{"h":"Chapter Commitment","p":["I understand that my development depends upon my work and upon the coordinated support of other people.","I will take responsibility for the actions, communication, honesty, and follow-through that belong to me.","I will respect the different responsibilities and expertise of coaches, performance staff, medical professionals, teachers, billets, family members, teammates, advisors, and mentors.","I will ask specific questions when expectations are unclear.","I will communicate health and safety concerns honestly and will not hide important symptoms to protect a role or appearance.","I will not collect conflicting advice without attempting to coordinate it.","I will learn to advocate for myself respectfully without expecting control over every decision.","I will recognize warning signs in unhealthy development relationships and seek help when something is unsafe or inappropriate.","I will express gratitude through respect, preparation, communication, and follow-through.","I will work to become a player whose development team can trust him to listen, communicate, act, and report honestly."]}]},{"n":"SIX","title":"Baseline Player Assessment","blocks":[{"h":"","p":["Development becomes easier to direct when the starting point is understood.","A player cannot build an effective plan by focusing only on where he hopes to go. He must also understand where he is now.","The baseline player assessment creates that starting point. It is a structured evaluation of current strengths, limitations, habits, physical qualities, tactical understanding, preparation, recovery, mindset, and conduct. It is not intended to label a player permanently or reduce his game to a collection of scores. It is intended to create an honest record.","A baseline is the first reliable point of comparison. It allows future assessments to show what has improved, what has remained unchanged, which weaknesses have become less limiting, which strengths have become more dependable, and where priorities should change.","Without a baseline, development can become dependent upon memory and emotion. A written assessment creates perspective and makes judgment more deliberate."]},{"h":"Assess The Player You Are Today","p":["This chapter should describe the player who currently appears in practices, games, training, meetings, travel, recovery, and daily team life.","Potential describes possibility. The baseline describes present evidence. Both are useful, but they should not be mistaken for one another.","A player may have the potential to become an excellent skater while still needing significant improvement in acceleration today. He may have offensive creativity while still struggling to execute it against faster pressure. He may want to become a trusted defensive forward while still needing better scanning, positioning, communication, or puck management."]},{"h":"Honesty Without Self-Criticism","p":["An honest assessment is not the same as a negative assessment. Strengths identify the foundation of a player's value. Limitations identify where development is required.","Avoid self-protection: rating every area highly, explaining away weaknesses, blaming circumstances, or describing potential as current performance.","Also avoid self-attack: treating every limitation as a personal failure, ignoring strengths, rating yourself according to your worst performance, or assuming that a weakness cannot change.","The objective is accuracy: This is what I currently do well. This is what remains inconsistent. This is the evidence. This is what I will work on next."]},{"h":"Use Multiple Forms Of Evidence","p":["No single source provides a complete view of a player. A stronger baseline combines self-assessment, coach feedback, game video, practice observation, strength and conditioning data, medical or movement information, statistics, role and usage, and repeated behavior over time.","When several sources point toward the same conclusion, the assessment becomes more reliable."]},{"h":"Rate Consistency, Not Potential","p":["The assessment scales in this chapter should reflect what appears consistently. Do not rate a skill according to the best version you have ever demonstrated or what you can perform during an unpressured drill.","Ask whether the skill appears during games, against strong competition, when tired, under pressure, and when teammates and coaches need to depend upon it.","A professional-level strength is repeatable."]},{"h":"Context Matters","p":["Age, physical maturity, experience, position, role, injuries, and training history can help explain an assessment. Context should create fairness, not excuses.","The useful questions are whether the quality meets the current demands of the role, whether it is improving, whether it limits performance, and what the next useful level would look like."]},{"h":"The Five-Level Development Scale","p":["1 — Major Limitation: The quality significantly restricts current performance or is not developed enough for the role.","2 — Developing: The quality appears in limited situations but remains inconsistent under speed, pressure, fatigue, or physical contact.","3 — Functional: The quality is adequate for many current situations but is not yet a clear advantage.","4 — Strong: The quality is consistently effective and provides meaningful value.","5 — Distinguishing Strength: The quality consistently separates the player from comparable competition and influences games under pressure.","A score of 3 is functional, not poor. A score of 5 should be rare."]},{"h":"Identify Limiting Factors","p":["A limiting factor restricts several other parts of performance. Poor sleep may affect energy, decisions, recovery, strength, mood, and injury risk. Weak scanning may affect puck decisions, creativity, defensive awareness, and play under pressure. Insufficient acceleration may affect races, forechecking, separation, transition, and defensive recovery.","The lowest numerical rating is not always the most important priority. The primary priority should be the issue whose improvement creates the greatest benefit across the player's game."]},{"h":"Protect The Foundation","p":["The assessment should identify foundational strengths as clearly as limitations. These qualities already create value and should remain present while other areas are developed.","Development should expand the game without removing its identity."]},{"h":"Prioritize The Baseline","p":["After completing the assessment, identify three foundational strengths, three current limitations, one primary limiting factor, one habit requiring immediate attention, one area requiring coach clarification, one area requiring professional support, and a small number of priorities for the next ninety days.","Too many priorities create scattered work. The baseline should narrow attention."]},{"h":"The Baseline Is Not The Verdict","p":["This assessment describes a point in time. It is not a prediction.","A weakness can become functional. A functional quality can become strong. A strength can become distinguishing. A role can expand and a habit can become automatic.","Complete the baseline honestly, use it to build the next plan, and return later to compare the evidence."]},{"h":"Rating Scale","p":["1 — Major Limitation: Significantly restricts current performance.","2 — Developing: Appears inconsistently and requires focused work.","3 — Functional: Adequate for many current demands but not a clear advantage.","4 — Strong: Consistently provides meaningful value.","5 — Distinguishing Strength: Clearly separates the player at the current level."]},{"h":"Skating Assessment","p":["First-Step Quickness","Evidence or comments:","Acceleration","Evidence or comments:","Top Speed","Evidence or comments:","Ability to Change Pace","Evidence or comments:","Edge Control","Evidence or comments:","Balance and Stability","Evidence or comments:","Lateral Movement","Evidence or comments:","Directional Transitions","Evidence or comments:","Stops and Starts","Evidence or comments:","Skating With the Puck","Evidence or comments:","Skating Without the Puck","Evidence or comments:","Maintaining Speed Under Pressure","Evidence or comments:","Movement Through Contact","Evidence or comments:"],"w":["First-Step Quickness","Rating: ___","Evidence or comments:",2,"Acceleration","Rating: ___","Evidence or comments:",2,"Top Speed","Rating: ___","Evidence or comments:",2,"Ability to Change Pace","Rating: ___","Evidence or comments:",2,"Edge Control","Rating: ___","Evidence or comments:",2,"Balance and Stability","Rating: ___","Evidence or comments:",2,"Lateral Movement","Rating: ___","Evidence or comments:",2,"Directional Transitions","Rating: ___","Evidence or comments:",2,"Stops and Starts","Rating: ___","Evidence or comments:",2,"Skating With the Puck","Rating: ___","Evidence or comments:",2,"Skating Without the Puck","Rating: ___","Evidence or comments:",2,"Maintaining Speed Under Pressure","Rating: ___","Evidence or comments:",2,"Movement Through Contact","Rating: ___","Evidence or comments:",2]},{"h":"Overall Summary","p":["Primary strength:","Primary limitation:","Game situation in which the limitation appears most clearly:"],"w":["Overall rating: ___","Primary strength:",1,"Primary limitation:",1,"Game situation in which the limitation appears most clearly:",2]},{"h":"Puck-Skill Assessment","p":["Receiving Passes","Evidence or comments:","Receiving Passes in Motion","Evidence or comments:","Handling Difficult Passes","Evidence or comme
