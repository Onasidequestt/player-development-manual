ommunication, accountability, emotional support, examples of effective habits, knowledge about opponents and situations, and energy during difficult periods.","You can learn from teammates without copying them completely.","Observe how experienced players prepare, communicate, organize equipment, use video, recover, manage travel, speak with coaches, respond after poor games, handle reduced roles, and interact with staff.","A veteran player may be able to explain a league, travel demand, tactical detail, or professional habit in a way that is immediately useful.","You also have responsibilities to teammates.","Do not treat relationships only as sources of personal benefit.","Offer communication, effort, encouragement, honesty, and respect in return."]},{"h":"Family","p":["Family support may include years of transportation, financial sacrifice, emotional encouragement, equipment, travel, meals, scheduling, and time.","As the player becomes more independent, the family’s role may change.","Parents and relatives may no longer have access to every conversation, practice, decision, or detail. This transition can be difficult for both the player and the family.","Healthy family support may include listening, maintaining perspective, helping with practical needs, encouraging honest communication, recognizing effort and growth, providing a stable relationship outside performance, helping evaluate major decisions, and respecting appropriate boundaries with coaches and staff.","Family involvement becomes less helpful when every game is analyzed immediately, every coach decision is challenged, or the player feels responsible for managing a family member’s emotional response to performance.","A player should be able to communicate what kind of support is useful.","“After games, I may need some time before discussing the performance. It helps me more when you ask how I am doing before asking about the game.”","The player should also remain grateful and respectful.","Independence does not remove appreciation."]},{"h":"Billet Families","p":["For many junior players, a billet family becomes an important part of daily life.","Billets may provide housing, meals, transportation, stability, encouragement, and a place to recover away from the rink.","Living in another person’s home requires maturity.","The player should communicate clearly about schedules, meals, travel, transportation, guests, curfews, household rules, laundry, shared spaces, allergies, sleep needs, and changes in plans.","Respect appears through ordinary behavior.","Clean up after yourself. Help when appropriate. Communicate before schedules change. Express appreciation. Avoid treating the home like a hotel.","If a problem develops, address it early and respectfully. When necessary, involve the team’s billet coordinator or another appropriate staff member.","The billet relationship can become one of the most meaningful parts of junior hockey when both sides communicate well."]},{"h":"Teachers And Academic Support","p":["Travel, games, practices, fatigue, and schedule changes can make school more difficult, but they do not remove the responsibility.","Teachers and academic coordinators can help when the player communicates before problems become urgent.","A strong academic communication standard includes knowing assignment deadlines, understanding travel expectations, asking for work in advance, using road time effectively, attending required sessions, explaining conflicts early, requesting help before falling significantly behind, and taking responsibility for missed work.","Even for a player fully committed to hockey, careers can change quickly. Academic skills, discipline, communication, and completed credentials remain valuable."]},{"h":"Agents, Advisors, And Career Representatives","p":["An agent, advisor, or family representative may help with contracts, career decisions, communication, professional opportunities, and long-term planning.","This person should not replace direct communication between the player and the team for ordinary development matters.","The player should understand what the representative is responsible for, how the person is compensated, which decisions require consultation, what information is being communicated, whether advice creates conflicts, who ultimately makes the decision, and what promises can and cannot realistically be made.","A good representative provides clear information rather than constant reassurance.","Be cautious of people who guarantee outcomes they do not control, create unnecessary conflict with teams, discourage independent questions, use pressure to force rapid decisions, exaggerate access or influence, avoid explaining fees or agreements, or tell the player only what he wants to hear.","Career guidance should protect long-term interests, not simply reduce short-term discomfort."]},{"h":"Mentors","p":["A mentor may be a former player, coach, family friend, teacher, relative, or trusted adult who provides perspective.","The mentor’s value often comes from being slightly removed from daily team decisions.","A mentor may help you process disappointment, evaluate feedback, prepare for a difficult conversation, maintain perspective, think through a major decision, recognize repeated patterns, separate emotion from action, and remember who you are outside hockey.","The mentor should not become another person attempting to control your career.","The most useful mentors ask strong questions and help you think clearly."]},{"h":"Mental Performance And Mental Health Support","p":["Mental performance and mental health are related, but they are not identical.","A mental-performance coach may help with focus, confidence, routines, visualization, emotional regulation, competition preparation, response to mistakes, and pressure management.","A licensed mental-health professional may help address anxiety, depression, grief, trauma, panic, severe stress, relationship problems, substance concerns, disordered eating, loss of enjoyment, thoughts of self-harm, or other mental-health conditions.","Seeking help is not evidence that a player is weak or uncommitted.","If mental or emotional symptoms begin affecting sleep, school, relationships, health, safety, or daily function, communicate with a qualified adult or professional.","Performance strategies should not be used to hide a health problem that requires treatment."]},{"h":"Who Should Know What","p":["Not every member of the development team needs every piece of information.","Medical details should be shared according to appropriate privacy and team procedures.","A skills coach may need to know about movement restrictions but may not need the full medical history.","A teacher may need to understand travel demands but not tactical concerns.","A family member may need to know that the player is struggling without receiving every detail of a private coach conversation.","The player should learn to ask who needs this information, why they need it, what the appropriate level of detail is, whether the information is private, whether withholding it creates a health or safety risk, and who can help decide what should be shared.","Privacy should not become secrecy that places the player or others at risk."]},{"h":"Coordinating Advice","p":["A developing player may receive advice from many sources.","The advice may be sincere and still conflict.","One coach may want faster puck movement. Another may emphasize possession. A skills coach may encourage creativity. A team coach may need lower-risk decisions in a particular role. A strength coach may reduce workload while the player feels pressure to train more.","When advice conflicts, do not attempt to satisfy everyone privately.","Ask whether the advice applies to the same situation, whether one person is discussing technique while another is discussing tactics, whether one person has greater responsibility for the decision, whether the advice fits the current team role, whether there is a health or workload concern, and whether the relevant people can communicate directly.","The team’s coaches, performance staff, and medical staff generally need to remain informed about outside training that could affect performance, fatigue, or health."]},{"h":"Asking Better Questions","p":["The quality of the answer often depends upon the quality of the question.","Weak questions are broad, emotional, or focused only on outcomes.","These questions may reflect genuine concerns, but they are difficult to answer productively.","Which part of my defensive positioning is currently least dependable?","What did you see on the turnover in the second period?","What does the coaching staff need from me on the forecheck?","Which physical quality should be my priority during this training phase?","How should I fuel before a late game after a day of travel?","What symptom would mean I should stop and report immediately?","What behavior would show you that I have applied this feedback?","A useful question reduces uncertainty and identifies a next step."]},{"h":"Preparing For A Development Conversation","p":["Do not approach every important conversation without preparation.","Before meeting with a coach, trainer, advisor, or mentor, write down the purpose of the conversation, the most important question, relevant examples, what you currently understand, what remains unclear, what decision may be required, and what action you are prepared to take.","During the conversation, listen fully, take notes where appropriate, ask for clarification, avoid arguing before understanding, summarize what you heard, confirm the next action, and identify when follow-up should occur.","After the conversation, record the key lesson, translate it into behavior, complete the agreed action, and return for follow-up when necessary.","Good communication is a development skill."]},{"h":"Disagreement Within The Development Team","p":["There may be times when you disagree with a coach, trainer, advisor, family member, or other person involved in your development.","Disagreement does not automatically mean disrespect.","Begin by making sure you understand the decision or instruction.","Describe your concern without accusation.","Recognize the other person’s responsibility.","When appropriate, request another conversation after emotions have settled.","“I want to make sure I understand the expectation. My concern is that I am experiencing pain during this movement. Can we review whether I should continue or be evaluated?”","“I understand that my role is currently limited. I would like to know which two behaviors would most help me earn greater trust.”","If a concern involves safety, abuse, harassment, serious health risk, or unethical conduct, speak with another trusted adult or appropriate authority rather than attempting to manage it alone.","Respect does not require silence when something is unsafe."]},{"h":"Trust Is Built Through Follow-Through","p":["People become more willing to invest in a player who follows through.","If you ask for feedback and ignore it, future conversations lose value.","If you report a problem but do not follow the agreed recovery plan, trust weakens.","If you request additional training and then approach it without effort, the opportunity may not continue.","Follow-through means doing what you agreed to do, communicating when circumstances change, reporting the result honestly, asking for help when the plan is not working, returning for review, and taking responsibility when you did not complete the action.","Trust does not require perfect execution."]},{"h":"Warning Signs In A Development Relationship","p":["Most people involved in hockey want to help.","Players should still recognize relationships that may be unhealthy or inappropriate.","Warning signs may include someone who asks you to hide important information from parents, medical staff, or the team; pressures you to train through serious pain or concussion symptoms; guarantees advancement, contracts, or selections; demands personal loyalty over your health or judgment; isolates you from other trusted people; uses humiliation as a regular method of control; retaliates when reasonable questions are asked; encourages illegal or unsafe behavior; provides unapproved substances or supplements; makes inappropriate sexual comments or contact; requests private communication that violates team or family rules; creates financial arrangements that are unclear; or threatens your career to prevent disclosure.","If something feels unsafe, manipulative, or inappropriate, speak with a trusted adult and the appropriate team or legal authority.","No development opportunity is worth accepting abuse or exploitation."]},{"h":"The Player’s Communication Standard","p":["A professional communication standard includes honesty, clarity, respect, appropriate timing, directness, listening, confidentiality where appropriate, willingness to ask questions, willingness to receive difficult answers, and follow-through.","Avoid relying on rumors, indirect messages, and assumptions.","When possible, speak directly with the person responsible.","Do not ask several people the same question only to choose the answer you prefer.","Do not use family members, teammates, or advisors to communicate ordinary concerns that you are capable of addressing appropriately yourself.","Learning to have direct and respectful conversations is part of becoming a professional."]},{"h":"Building A Team That Can Challenge You","p":["Support does not always feel encouraging.","Sometimes the most useful person is the one willing to tell you something difficult.","A strong development team should include people who can recognize your progress, identify blind spots, challenge excuses, protect your health, distinguish confidence from overconfidence, remind you of the larger perspective, support ambition without making unrealistic promises, tell you when more work is needed, tell you when rest is needed, and help you make decisions based on evidence.","Do not surround yourself only with people who agree with you.","Do not assume that criticism is automatically accurate either.","Look for people who are knowledgeable, honest, consistent, and committed to your long-term well-being."]},{"h":"Gratitude And Professional Relationships","p":["Development involves the time and work of many people.","Thank coaches for specific help. Respect appointments. Arrive prepared. Communicate when plans change. Recognize trainers, equipment staff, billets, teachers, volunteers, drivers, and support personnel.","Gratitude should be genuine rather than strategic.","People should not be treated well only because they may influence your career.","Professional relationships are built through ordinary respect."]},{"h":"Your Team Will Change","p":["The people involved in your development will change over time.","Coaches move. Teams change. Roles evolve. New specialists become necessary. Some relationships remain important for years, while others belong to a particular stage.","A change does not erase the value of what someone contributed.","Continue evaluating who is currently responsible for each area, which relationships are productive, where communication is missing, whether any important perspective is absent, whether someone is performing a role beyond his or her expertise, whether a relationship has become unhealthy, who should be added, and who no longer needs to be involved in the same way.","The development team should evolve with the player."]},{"h":"Becoming Your Own Advocate","p":["As you become older, the responsibility for communication should gradually shift toward you.","Self-advocacy means communicating your needs, questions, and concerns clearly.","It does not mean demanding every preferred outcome.","I would like feedback on this part of my game.","These conversations may feel uncomfortable.","They become easier through preparation and practice.","A player who communicates directly and respectfully becomes better prepared for every level of sport and life."]},{"h":"Advice Coordination Check","p":["Complete this when two or more people appear to be giving conflicting advice.","Do the recommendations apply to the same situation?","Is one recommendation technical and the other tactical?","Is there a medical, workload, or safety issue involved?","Who has primary responsibility for this area?"]},{"h":"My Support Gaps","p":["Which area of my development currently lacks enough support?","What type of expertise or relationship may be missing?","Who can help me identify the right person?"]},{"h":"Quarter-Season Development Team Review","p":["Which relationships have been most useful?","Which feedback have I applied successfully?","Does anyone need to be added to the team?","Does any relationship or role need to change?"]}]},{"n":"SIX","title":"Baseline Player Assessment","blocks":[{"h":"","p":["Development becomes easier to direct when the starting point is understood.","A player cannot build an effective plan by focusing only on where he hopes to go. He must also understand where he is now.","The baseline player assessment creates that starting point. It is a structured evaluation of current strengths, limitations, habits, physical qualities, tactical understanding, preparation, recovery, mindset, and conduct. It is not intended to label a player permanently or reduce his game to a collection of scores. It is intended to create an honest record.","A baseline is the first reliable point of comparison. It allows future assessments to show what has improved, what has remained unchanged, which weaknesses have become less limiting, which strengths have become more dependable, and where priorities should change.","Without a baseline, development can become dependent upon memory and emotion. A written assessment creates perspective and makes judgment more deliberate."]},{"h":"Assess The Player You Are Today","p":["This chapter should describe the player who currently appears in practices, games, training, meetings, travel, recovery, and daily team life.","Potential describes possibility. The baseline describes present evidence. Both are useful, but they should not be mistaken for one another.","A player may have the potential to become an excellent skater while still needing significant improvement in acceleration today. He may have offensive creativity while still struggling to execute it against faster pressure. He may want to become a trusted defensive forward while still needing better scanning, positioning, communication, or puck management."]},{"h":"Honesty Without Self-Criticism","p":["An honest assessment is not the same as a negative assessment. Strengths identify the foundation of a player's value. Limitations identify where development is required.","Avoid self-protection: rating every area highly, explaining away weaknesses, blaming circumstances, or describing potential as current performance.","Also avoid self-attack: treating every limitation as a personal failure, ignoring strengths, rating yourself according to your worst performance, or assuming that a weakness cannot change.","The objective is accuracy: This is what I currently do well. This is what remains inconsistent. This is the evidence. This is what I will work on next."]},{"h":"Use Multiple Forms Of Evidence","p":["No single source provides a complete view of a player. A stronger baseline combines self-assessment, coach feedback, game video, practice observation, strength and conditioning data, medical or movement information, statistics, role and usage, and repeated behavior over time.","When several sources point toward the same conclusion, the assessment becomes more reliable."]},{"h":"Rate Consistency, Not Potential","p":["The assessment scales in this chapter should reflect what appears consistently. Do not rate a skill according to the best version you have ever demonstrated or what you can perform during an unpressured drill.","Ask whether the skill appears during games, against strong competition, when tired, under pressure, and when teammates and coaches need to depend upon it.","A professional-level strength is repeatable."]},{"h":"Context Matters","p":["Age, physical maturity, experience, position, role, injuries, and training history can help explain an assessment. Context should create fairness, not excuses.","The useful questions are whether the quality meets the current demands of the role, whether it is improving, whether it limits performance, and what the next useful level would look like."]},{"h":"The Five-Level Development Scale","p":["1 — Major Limitation: The quality significantly restricts current performance or is not developed enough for the role.","2 — Developing: The quality appears in limited situations but remains inconsistent under speed, pressure, fatigue, or physical contact.","3 — Functional: The quality is adequate for many current situations but is not yet a clear advantage.","4 — Strong: The quality is consistently effective and provides meaningful value.","5 — Distinguishing Strength: The quality consistently separates the player from comparable competition and influences games under pressure.","A score of 3 is functional, not poor. A score of 5 should be rare."]},{"h":"Identify Limiting Factors","p":["A limiting factor restricts several other parts of performance. Poor sleep may affect energy, decisions, recovery, strength, mood, and injury risk. Weak scanning may affect puck decisions, creativity, defensive awareness, and play under pressure. Insufficient acceleration may affect races, forechecking, separation, transition, and defensive recovery.","The lowest numerical rating is not always the most important priority. The primary priority should be the issue whose improvement creates the greatest benefit across the player's game."]},{"h":"Protect The Foundation","p":["The assessment should identify foundational strengths as clearly as limitations. These qualities already create value and should remain present while other areas are developed.","Development should expand the game without removing its identity."]},{"h":"Prioritize The Baseline","p":["After completing the assessment, identify three foundational strengths, three current limitations, one primary limiting factor, one habit requiring immediate attention, one area requiring coach clarification, one area requiring professional support, and a small number of priorities for the next ninety days.","Too many priorities create scattered work. The baseline should narrow attention."]},{"h":"The Baseline Is Not The Verdict","p":["This assessment describes a point in time. It is not a prediction.","A weakness can become functional. A functional quality can become strong. A strength can become distinguishing. A role can expand and a habit can become automatic.","Complete the baseline honestly, use it to build the next plan, and return later to compare the evidence."]},{"h":"Rating Scale","p":["1 — Major Limitation: Significantly restricts current performance.","2 — Developing: Appears inconsistently and requires focused work.","3 — Functional: Adequate for many current demands but not a clear advantage.","4 — Strong: Consistently provides meaningful value.","5 — Distinguishing Strength: Clearly separates the player at the current level."]},{"h":"Recovery And Health Assessment","p":["Any symptom or health concern requiring evaluation must be reported to appropriate medical staff. Recording it in this manual does not replace reporting it."]},{"h":"Development Priority Filter","p":["Use this filter before selecting a major development priority.","Does it significantly affect my current role?","Does it affect several areas of performance?","Has it been identified through more than one source of evidence?","Can it be trained safely during the current phase?","Is there a clear way to measure progress?"]}]},{"n":"SEVEN","title":"Season Goals","blocks":[{"h":"Goals Create Direction","p":["A season can feel long when viewed from the beginning and surprisingly short when viewed from the end. Games accumulate quickly. Practices blend together. Travel, school, recovery, injuries, lineup changes, strong performances, poor performances, and ordinary days all compete for attention.","Without clear goals, a player may work hard while still moving without direction. Season goals create focus. They identify what the player hopes to accomplish, what he needs to improve, which habits must become consistent, and how progress will be recognized.","A useful goal system does more than list desired outcomes. It connects ambition to behavior. The purpose of this chapter is to create a complete season-goal structure that includes performance, development, habits, team contribution, health, education, and personal growth."]},{"h":"Goals Should Guide, Not Define","p":["Goals are intended to guide attention. They should not become constant tests of personal worth.","A player may begin the season with a goal of earning a certain role, producing a particular number of points, playing special teams, or being selected for an opportunity. Those goals can be motivating, but many outcomes depend upon factors beyond the player’s control.","A coach determines usage. Teammates influence production. Injuries affect availability. Roster changes alter opportunities. Opponents, officials, schedules, and circumstances affect results.","A strong goal system separates what the player hopes to achieve from what he can directly control. The player can control preparation, effort, communication, practice habits, recovery, learning, and response to feedback. He cannot guarantee a lineup decision, statistical result, or selection."]},{"h":"The Six Types Of Season Goals","p":["Outcome goals describe results you hope to achieve, such as earning a regular lineup position, reaching a statistical target, receiving special-teams responsibility, or helping the team win.","Performance goals describe the level at which you want to perform, such as creating more quality scoring chances, reducing avoidable turnovers, improving puck recoveries, or executing defensive assignments more consistently.","Development goals identify qualities that need to improve, such as acceleration, puck protection, decisions under pressure, positioning, scanning, shot release, physical capacity, or emotional control.","Habit goals identify repeatable actions, such as completing recovery, protecting sleep, fueling before practice, reviewing video, arriving prepared, and communicating soreness.","Team goals describe how you intend to contribute to the group. Personal and academic goals protect development away from hockey and support the person as well as the player."]},{"h":"Begin With The Season Purpose","p":["Before writing individual goals, identify what the season is primarily about. For a player entering the WHL, the season may be about adaptation to greater speed, stronger players, longer travel, more games, unfamiliar systems, reduced time and space, a different role, living away from home, and increased physical and emotional demands.","A useful season purpose might be: Establish myself as a dependable WHL player by learning the league, building professional habits, and improving the parts of my game required to earn greater responsibility.","A clear season purpose helps evaluate decisions. When several goals compete for attention, the player can ask which one most supports the season’s primary purpose."]},{"h":"Start With The Baseline","p":["Goals should come from evidence. The baseline assessment identifies current strengths, limitations, habits, and role requirements.","The most useful goals emerge from the gap between what the player currently does, what his role requires, and what the next level will demand.","For example, if the baseline shows useful top speed but limited first-step acceleration, the development goal may be to improve first-step explosiveness, the performance goal may be to create more separation during races and transitions, and the habit goal may be to complete prescribed acceleration work with full intent and track the relevant cues."]},{"h":"Limit The Number Of Primary Goals","p":["A player may want to improve everything. That is understandable and impractical. When every area is treated as a priority, none receives enough attention.","A useful structure is one primary role or outcome goal, two or three major performance goals, three development priorities, three to five habit goals, one team goal, and one personal or academic goal.","Some goals may remain active throughout the season. Others should be addressed in shorter development blocks."]},{"h":"Write Goals Clearly","p":["A useful goal should explain exactly what you are trying to accomplish, why it matters, what evidence supports it, what part is within your control, how progress will be measured, what actions support it, who will help, and when it will be reviewed.","A clearer goal says: Become more dependable in the defensive zone by improving scanning, positioning below the puck, wall responsibility, and communication.","The clearer the goal becomes, the easier it is to act upon."]},{"h":"Challenging And Believable","p":["A goal should require growth without becoming so unrealistic that the player stops taking it seriously. Use minimum, target, and stretch levels where appropriate.","The minimum is the lowest result that would still represent meaningful progress. The target is the realistic result being actively pursued. The stretch is a demanding result that may become possible if development and opportunity progress especially well.","This structure allows ambition without turning one number into a pass-or-fail judgment."]},{"h":"Measure What Matters","p":["A measure should help the player understand progress. Useful measures may include coach evaluation, video evidence, physical testing, practice execution, habit completion, role changes, game statistics, health and availability, and repeated performance under pressure.","The measure should match the goal. A defensive-positioning goal should not be judged only by plus-minus. A puck-protection goal should not be judged only by points. A recovery goal should not be judged only by motivation."]},{"h":"Leading And Lagging Indicators","p":["A lagging indicator shows the final result, such as goals, assists, games played, minutes, wins, selections, or physical-test results.","A leading indicator shows whether the player is performing the actions likely to create that result, such as quality repetitions, video review, sleep consistency, recovery completion, scanning frequency, communication, route execution, and coachable responses.","Lagging indicators tell you what happened. Leading indicators help explain why. A useful goal system tracks both."]},{"h":"Connect Goals To Daily Action","p":["A season goal should eventually become a weekly and daily behavior.","A season goal of improving decisions under pressure might become a monthly focus on scanning earlier, a weekly action of reviewing pressure situations, a practice cue to scan before receiving the puck, a game cue to know the next play before possession arrives, and a review question asking whether pressure was recognized early enough.","The goal becomes useful when it changes attention during the day."]},{"h":"Statistical And Role Goals","p":["Statistics are part of competitive hockey, and it is reasonable to set production goals. Support those goals with process goals so the player does not force plays or allow points to control every decision.","Role goals may involve earning regular lineup status, moving into a larger role, receiving special-teams responsibility, playing against stronger competition, or becoming trusted late in games.","The player should focus on becoming capable of the role rather than demanding the role itself. Ask what the role requires, what coaches currently trust, what limits the opportunity, what behavior demonstrates readiness, and how progress will be reviewed."]},{"h":"Team, Health, Academic, And Personal Goals","p":["Individual goals should support the team. A personal scoring goal should not encourage low-percentage decisions that damage team play, and a desire for more ice time should not reduce support for teammates.","Health goals should focus on reporting symptoms, following treatment, protecting sleep, fueling, managing workload, completing rehabilitation, and avoiding unnecessary risk. The objective is not to appear indestructible but to build a body and communication system that support long-term performance.","Academic and personal-development goals should address schoolwork, organization, communication with billets, money management, independence, relationships, social-media discipline, and identity outside hockey."]},{"h":"Review And Adjust","p":["A season plan should be reviewed at scheduled intervals rather than rewritten after every difficult game. Useful review points include after training camp, after the first ten games, monthly, at quarter season, at midseason, after major role changes, and after the regular season.","Changing a goal based upon evidence is not failure. A goal may need adjustment because the baseline was inaccurate, the role changed, an injury occurred, team needs changed, a new limiting factor appeared, or the measurement was poor.","During review, ask what progress is visible, what actions have been completed, what has not improved, whether the measure remains useful, what support is needed, and what the next action should be."]},{"h":"The Development Scoreboard","p":["The most visible scoreboard records goals, assists, wins, losses, and standings. The development scoreboard asks whether the player is becoming more capable, whether strengths are becoming more dependable, whether weaknesses are becoming less limiting, whether habits are becoming more professional, whether trust is increasing, whether health and self-awareness are improving, and whether the player is helping the team.","A successful season should include evidence on both scoreboards."]},{"h":"Baseline Connection","p":["My Three Most Important Current Limitations","The Current Role I Am Preparing to Perform","What the Next Level of Responsibility Requires"]}]},{"n":"NINE","title":"The 90-Day Development Plan","blocks":[{"h":"Why Ninety Days?","p":["A season establishes the larger direction. A 90-day development plan identifies what deserves concentrated attention now.","Ninety days is long enough for meaningful improvement to occur, but short enough to create urgency, maintain focus, and adjust when circumstances change. It allows a player to work toward the long-term vision without attempting to solve his entire career at once.","A strong 90-day plan does not attempt to improve every part of the player’s game equally. It identifies a small number of priorities that can create the greatest benefit during the current stage of development: one hockey skill, one tactical or decision-making quality, one physical-development area, one recovery or lifestyle habit, and one personal or team responsibility.","The structure is simple: assess honestly, choose deliberately, plan specifically, act consistently, review the evidence, and adjust."]},{"h":"A Development Block Is Not A Guarantee","p":["Ninety days of focused work does not guarantee mastery. Some skills develop quickly. Others require several seasons. Physical development may be influenced by age, growth, training history, recovery, health, and the competitive schedule. Tactical learning may improve in practice before it becomes reliable in games.","The purpose of the development block is not to promise a finished result. It is to create evidence of movement and clarity about what is working."]},{"h":"Selecting The Right Priorities","p":["The most important step is choosing what deserves attention. A priority should come from evidence: the baseline assessment, coach feedback, role requirements, video patterns, physical testing, practice performance, recurring game situations, recovery trends, health and availability, and the long-term vision.","Ask which limitation affects the greatest number of situations, which improvement would create the largest benefit, what prevents an existing strength from being used, what coaches repeatedly identify, what the current role requires, what can be trained safely, and how progress can be measured."]},{"h":"Do Not Choose Too Many Priorities","p":["Focus is limited. When every area is treated as a priority, none receives enough attention. The plan should normally contain no more than five primary areas: hockey skill, tactical or decision-making, physical development, recovery or lifestyle, and personal or team contribution.","One or two priorities may deserve greater emphasis than the others. The plan should answer: If only a few areas improve meaningfully during the next ninety days, which improvements would matter most?"]},{"h":"Primary And Supporting Priorities","p":["A primary priority is the most important development need during the current block. Supporting priorities receive attention without competing with the primary work. This protects existing strengths while directing the greatest energy toward the most important limitation."]},{"h":"The Hockey-Skill Priority","p":["The hockey-skill priority should identify a technical quality that can be practiced deliberately and described in game language. “Improve my hands” is vague. “Improve puck control and protection when receiving the puck along the wall under immediate pressure” identifies the skill, situation, pressure, and desired outcome."]},{"h":"Skill Development Requires Progression","p":["Skill development usually moves through technical understanding, controlled repetition, speed, decision-making, pressure, and game transfer. A player may look excellent during controlled repetition and still struggle to access the skill in games. That identifies the next stage of progression rather than proving that practice failed."]},{"h":"The Tactical Or Decision-Making Priority","p":["Technical skill determines what a player can execute. Tactical understanding determines when, where, and why he uses it. A tactical goal should identify the information the player needs to recognize and the action that should follow.","For example: Before receiving the puck in the defensive zone, identify pressure and at least one available outlet so the first decision can be made without stopping the play."]},{"h":"Use Video To Support Tactical Development","p":["Video review should include successful examples, unsuccessful examples, examples from teammates, and examples from strong players in similar roles. The player should identify what information was available, what decision was made, what alternative existed, and what needed to be noticed earlier. The lesson should become a simple practice or game cue."]},{"h":"The Physical-Development Priority","p":["The physical priority must be established with qualified strength and conditioning staff. It may involve strength, power, acceleration, speed, conditioning, mobility, balance, stability, body control, recovery capacity, or movement quality.","The player should understand why the quality matters, how it affects hockey, what work addresses it, what technique is required, how progress will be measured, and what symptoms must be reported. More work is not automatically better work."]},{"h":"In-Season Physical Development","p":["In-season work must balance development with games, travel, practices, school, recovery, injuries, changing ice time, and accumulated fatigue. Some periods allow development; others require maintenance and recovery. Performance staff should determine the emphasis."]},{"h":"The Recovery Or Lifestyle Priority","p":["A recovery or lifestyle priority can benefit every other area. It should be practical and account for travel, late games, school, and schedule changes. A habit that only works under perfect conditions is not yet dependable."]},{"h":"The Personal Or Team Priority","p":["This priority describes visible behavior around other people: communication, body language, bench engagement, response to reduced ice time, billet responsibilities, academic organization, support for teammates, frustration management, or reliability."]},{"h":"Define The Current Baseline","p":["Every priority should include a starting description explaining what currently happens, how often it occurs, where it appears, under which conditions it breaks down, and what evidence supports the conclusion."]},{"h":"Define What Improvement Looks Like","p":["Describe the behavior you want to produce, not merely the problem you want to eliminate. Improvement should be described through execution, consistency, game situations, coach trust, measurable performance, and behavior under pressure."]},{"h":"Identify The Training Actions","p":["Each priority should include specific actions: prescribed exercises, skill repetitions, video sessions, practice cues, coach conversations, recovery routines, nutrition preparation, sleep routines, tracking, and scheduled reviews. The plan should state what will be done, how often, when, with whom, at what quality, and how completion will be recorded."]},{"h":"Build A Weekly Rhythm","p":["The plan must fit the real hockey calendar. It should distinguish non-negotiable habits, flexible development work, staff-directed training, optional work, and work that should be removed when recovery is inadequate."]},{"h":"Use Practice And Game Cues","p":["A cue directs attention toward one useful detail. It should be short enough to remember during action. One or two practice cues are usually enough. Game cues should be even simpler: one preparation cue, one tactical cue, and one response cue."]},{"h":"Track Completion And Quality","p":["Checking a box shows that an action occurred. It does not show how well it was performed. Track both completion and quality, and where useful record difficulty, confidence, pain or restriction, transfer into practice, transfer into games, and staff feedback."]},{"h":"Build Checkpoints","p":["Do not wait until day ninety. Useful checkpoints include Day 14, Day 30, Day 45, Day 60, Day 75, and Day 90. Each checkpoint should ask whether the work is being completed, whether quality is sufficient, whether the priority remains relevant, whether workload is appropriate, whether progress is visible, and whether the plan needs support or adjustment."]},{"h":"Expect A Plateau","p":["Progress may be rapid at first and then slow. A plateau does not automatically mean the plan failed. Review whether the work is still being completed, whether difficulty is appropriate, whether technique is correct, whether fatigue interferes, whether the work transfers to realistic situations, and whether the measure is sensitive enough."]},{"h":"Adjustment Is Part Of The Plan","p":["A plan should be stable enough to create repetition and flexible enough to respond to evidence. Record the reason for adjustments so the plan does not change randomly according to mood."]},{"h":"Maintenance After Improvement","p":["When a priority improves, it may move from primary work to a supporting or maintenance habit. The objective is to retain progress while allowing attention to move toward the next development need."]},{"h":"Who Should Review The Plan?","p":["The plan should be reviewed with the appropriate people: coaches for role and tactics, performance staff for physical work, medical staff for injuries, nutrition professionals for fueling, and other qualified members of the development team for their areas of responsibility."]},{"h":"The Player Owns The Follow-Through","p":["The development team may help design the plan. The player must perform it. Ownership includes knowing the priorities, completing the assigned work, recording useful information, communicating honestly, asking for feedback, and acknowledging when actions were not completed."]},{"h":"Do Not Turn Development Into Constant Self-Judgment","p":["Development is uneven. Evaluate trends rather than attacking yourself after every imperfect repetition. Use language that identifies what improved, what remained inconsistent, what broke down under pressure, what helped, and what should happen next."]},{"h":"The End Of The Block","p":["At the end of ninety days, review each priority by comparing the starting baseline, completed actions, consistency, quality, evidence, staff feedback, practice transfer, game transfer, remaining limitations, and the next decision. The next decision may be to continue, maintain, replace, pause, or seek additional evaluation.","At the end of the block, I want to be more capable of"]},{"h":"Priority Ranking","p":["Evidence strength: ☐ Strong   ☐ Moderate   ☐ Limited","Impact on current role: ☐ High   ☐ Medium   ☐ Low","Can it be trained safely now? ☐ Yes   ☐ No   ☐ Staff guidance required","Evidence strength: ☐ Strong   ☐ Moderate   ☐ Limited","Impact on current role: ☐ High   ☐ Medium   ☐ Low","Can it be trained safely now? ☐ Yes   ☐ No   ☐ Staff guidance required","Evidence strength: ☐ Strong   ☐ Moderate   ☐ Limited","Impact on current role: ☐ High   ☐ Medium   ☐ Low","Can it be trained safely now? ☐ Yes   ☐ No   ☐ Staff guidance required","Evidence strength: ☐ Strong   ☐ Moderate   ☐ Limited","Impact on current role: ☐ High   ☐ Medium   ☐ Low","Can it be trained safely now? ☐ Yes   ☐ No   ☐ Staff guidance required","Evidence strength: ☐ Strong   ☐ Moderate   ☐ Limited","Impact on current role: ☐ High   ☐ Medium   ☐ Low","Can it be trained safely now? ☐ Yes   ☐ No   ☐ Staff guidance required"]}]},{"n":"FINAL","title":"Final Thoughts: The Work Between The Games","blocks":[{"h":"","p":["Talent may create an invitation. A career is shaped by what happens after the invitation: the ordinary preparation, the honest conversation, the repeated correction, the meal packed before travel, the recovery completed after disappointment, and the decision to remain coachable when pride would prefer defensiveness.","This manual cannot perform the work for Gavin. It can help him notice the work, organize it, communicate it, and learn from it. Its value will not be measured by how perfectly every page is completed. It will be measured by whether the pages help him make clearer decisions and become more dependable over time.","There will be seasons when progress is obvious and seasons when development is hidden inside adversity. Roles will change. Teams will change. Statistics will rise and fall. The standard remains available: prepare honestly, compete fully, recover responsibly, learn continuously, and treat people well.","The highest purpose of the system is not to manufacture a flawless athlete. It is to help a serious young player become an increasingly capable, healthy, thoughtful, and responsible professional - and a man whose character remains after the final game."]},{"h":"A Letter To Gavin","p":["Gavin, this manual was created to honor what you have already accomplished and, more importantly, to support what comes next. Winning a state championship and earning the opportunity to enter major junior hockey are extraordinary achievements. They are also beginnings.","Use these pages as a private place for honesty. Record what is true. Ask better questions. Let coaches coach you. Let qualified professionals protect your health. Notice the people helping you. Keep your ambition, but do not allow a result, ranking, role, or statistic to decide your worth.","The goal is not to become perfect. The goal is to become more prepared, more aware, more resilient, more useful to the team, and more capable of carrying responsibility. Keep the opportunity in perspective and treat it with respect.","Excellence is built long before it is recognized. Keep building.","With pride in what you have done and confidence in the work ahead,"]},{"h":"Acknowledgments","p":["Prepared for Gavin Andersen as a family gift commemorating his transition from Warroad hockey into the next stage of his development. This manual recognizes the contribution of family, coaches, teammates, teachers, billets, trainers, medical professionals, volunteers, and communities whose work makes youth and junior hockey possible."]},{"h":"Important Professional Guidance Notice","p":["This manual is an organizational, educational, and reflection tool. It does not provide medical diagnosis, treatment, return-to-play clearance, individualized strength programming, nutrition treatment, mental-health treatment, or legal or career representation. Gavin should follow the direction of his team, licensed medical professionals, qualified strength and conditioning staff, registered dietitians, licensed mental-health professionals, educators, and other appropriately credentialed specialists. Any injury, concussion symptom, serious illness, breathing difficulty, chest pain, severe emotional distress, self-harm thought, disordered eating concern, or safety issue should be reported immediately to a trusted adult and the appropriate professional.","fffggggɉgggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggʄh˄h̄ḧ́h΄hτhggggЄhфh҄hggggӄhgg"]}]}];

/* ================= helpers ================= */
const $ = id => document.getElementById(id);
function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  if(attrs) for(const k of Object.keys(attrs)){
    const v = attrs[k];
    if(v == null) continue;
    if(k === "class") n.className = v;
    else if(k === "id") n.id = v;
    else if(k === "value") n.value = v;
    else if(k === "html") n.innerHTML = v;
    else if(k.slice(0,2) === "on") n[k] = v;
    else n.setAttribute(k, String(v));
  }
  for(const k of kids){ if(k == null || k === false) continue; n.appendChild(typeof k === "object" ? k : document.createTextNode(String(k))); }
  return n;
}
function svgEl(t, a){
  const n = document.createElementNS ? document.createElementNS("http://www.w3.org/2000/svg", t) : el(t);
  Object.keys(a || {}).forEach(k => n.setAttribute(k, String(a[k])));
  if(!document.createElementNS && a && a.class) n.className = a.class;
  return n;
}
function clear(node){ node.textContent = ""; }
function pad(n){ return (n < 10 ? "0" : "") + n; }
function dayOf(ts){ const d = new Date(ts); return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
function tsOfDay(day){ const p = day.split("-"); return new Date(+p[0], +p[1]-1, +p[2]).getTime(); }
/* calendar arithmetic on "YYYY-MM-DD", never on milliseconds: a 23-hour DST day cannot skip a date */
function addDays(day, n){ const p = day.split("-"); return dayOf(new Date(+p[0], +p[1]-1, +p[2] + n).getTime()); }
function daysBetween(a, b){ const pa = a.split("-"), pb = b.split("-"); return Math.round((Date.UTC(+pb[0], +pb[1]-1, +pb[2]) - Date.UTC(+pa[0], +pa[1]-1, +pa[2])) / 864e5); }
function niceDay(day){ const d = new Date(tsOfDay(day)); return d.toLocaleDateString(undefined, {weekday:"short", month:"short", day:"numeric"}); }
function shortDay(day){ const d = new Date(tsOfDay(day)); return d.toLocaleDateString(undefined, {month:"short", day:"numeric"}); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
/* 1..5 -> 0..100. A 1 is 0%, a 3 is 50%, a 5 is 100%: percent of the scale, not percent of 5. */
function pct(vals){
  const v = vals.filter(x => typeof x === "number" && x >= 1 && x <= 5);
  if(!v.length) return null;
  return Math.round((v.reduce((a,b)=>a+b,0)/v.length - 1) / 4 * 100);
}
function pctText(p){ return p == null ? "—" : p + "%"; }
function signed(n){ return n > 0 ? "+" + n : n < 0 ? "−" + (-n) : "±0"; }
function words(ch){ return ch.blocks.reduce((a,b) => a + b.p.join(" ").split(/\s+/).length, 0); }

/* ================= store: one localStorage key, kinds mirror what a server would hold ================= */
const Store = {
  KEY: "pdm.v1",
  data: null,
  blank(){ return {readiness:{}, practices:{}, games:{}, assessments:[], goals:{purpose:"", habits:["","","","",""], primary:"", measure:"", supporting:["","","",""], blockStart:"", checkpoints:{}}, habitsDone:{}, notes:{}, answers:{}, read:{}, drafts:{}, meta:{}}; },
  normalize(d){
    const b = this.blank(), out = Object.assign(b, d || {});
    out.goals = Object.assign(this.blank().goals, out.goals || {});
    ["answers","read","drafts","meta","notes","habitsDone"].forEach(k => { if(!out[k] || typeof out[k] !== "object") out[k] = {}; });
    return out;
  },
  load(){
    let d = null;
    try{ d = JSON.parse(localStorage.getItem(this.KEY) || "null"); }catch(e){ d = null; }
    this.data = this.normalize(d);
    return this.data;
  },
  saveLocal(){ try{ localStorage.setItem(this.KEY, JSON.stringify(this.data)); }catch(e){} },
  save(){ this.saveLocal(); },
  /* readiness: one record per day */
  putReadiness(day, rec){ this.data.readiness[day] = Object.assign({}, this.data.readiness[day] || {}, rec, {at: Date.now()}); this.save(); },
  readinessPct(day){ const r = this.data.readiness[day]; return r ? pct(READY_FIELDS.map(f => r[f[0]])) : null; },
  putPractice(e){ this.data.practices[e.id] = e; this.save(); },
  putGame(e){ this.data.games[e.id] = e; this.save(); },
  drop(kind, id){ delete this.data[kind][id]; this.save(); },
  list(kind){ return Object.values(this.data[kind]).sort((a,b)=> a.date < b.date ? 1 : a.date > b.date ? -1 : (b.at||0)-(a.at||0)); },
  lastAssessment(){ const a = this.data.assessments; return a.length ? a[a.length-1] : null; },
  baseline(){ return this.data.assessments[0] || null; },
  saveAssessment(r){ this.data.assessments.push({at: Date.now(), day: dayOf(Date.now()), r: Object.assign({}, r)}); delete this.data.drafts.ratings; this.save(); },
  setGoals(patch){ Object.assign(this.data.goals, patch); this.save(); },
  habitNames(){ return this.habitSlots().map(h => h.nm); },
  /* ticks are keyed by the habit's SLOT (0..4), so filling or clearing another slot never moves them */
  habitSlots(){ return this.data.goals.habits.map((h, i) => ({i, nm: (h||"").trim()})).filter(h => h.nm); },
  toggleHabit(day, slot){ const d = this.data.habitsDone[day] || (this.data.habitsDone[day] = {}); d[slot] = !d[slot]; this.save(); },
  habitPct(day){ const s = this.habitSlots(); if(!s.length) return null; const d = this.data.habitsDone[day] || {}; return Math.round(s.filter(h => d[h.i]).length / s.length * 100); },
  habitWeekPct(endDay){
    const s = this.habitSlots(); if(!s.length) return null;
    let k = 0;
    for(let j=0;j<7;j++){ const d = this.data.habitsDone[addDays(endDay, -j)] || {}; s.forEach(h => { if(d[h.i]) k++; }); }
    return Math.round(k/(s.length*7)*100);
  },
  setNote(ch, text){ this.data.notes[ch] = text; this.save(); },
  setAnswer(k, text){ this.data.answers[k] = text; this.save(); },
  /* drafts: a half-finished assessment or log entry survives a reload */
  keepDraft(kind, v){ if(v == null) delete this.data.drafts[kind]; else this.data.drafts[kind] = JSON.parse(JSON.stringify(v)); this.save(); },
  /* backup: one JSON file the player keeps; restore replaces everything after a confirm */
  exportText(){ return JSON.stringify({app:"pdm", v:1, at: Date.now(), data: this.data}); },
  parseBackup(text){
    let o = null;
    try{ o = JSON.parse(text); }catch(e){ return {err:"That file could not be read as a backup."}; }
    if(!o || o.app !== "pdm" || !o.data || typeof o.data.readiness !== "object" || !Array.isArray(o.data.assessments)) return {err:"That file is not a Player Development Manual backup."};
    return {data:o.data, at:o.at};
  },
  restore(d){ this.data = this.normalize(JSON.parse(JSON.stringify(d))); this.save(); }
};
const State = { tab:"today", draft:null, ratingsDraft:null, openSec:{}, flash:"", readChapter:null, checkStep:null, logFilter:"all", pendingImport:null, confirmDiscard:false };
/* score of one entry, from its 1..5 fields */
function practiceScore(e){ return pct(PRACTICE_FIELDS.map(f => e[f[0]])); }
function gameScore(e){ return pct(GAME_FIELDS.map(f => e[f[0]])); }
/* section % from a ratings map; only rated items count, and the count is shown beside it */
function sectionPct(sec, r){ const vals = sec.items.map((_,i) => r[sec.key + i]); return {p: pct(vals), n: vals.filter(v => v>=1 && v<=5).length, of: sec.items.length}; }
function overallPct(r){ return pct(SECTIONS.flatMap(s => s.items.map((_,i) => r[s.key+i]))); }
/* the 90-day block: 0% before the start, 100% after day 90 */
function blockProgress(start, now){
  if(!start) return null;
  const days = daysBetween(start, dayOf(now));
  return {days: days, pct: Math.max(0, Math.min(100, Math.round(days / BLOCK_DAYS * 100))), left: Math.max(0, BLOCK_DAYS - days)};
}
/* top / bottom rated items, for Foundation and Watch */
function extremes(r, k){
  const rows = [];
  SECTIONS.forEach(s => s.items.forEach((nm,i) => { const v = r[s.key+i]; if(v>=1 && v<=5) rows.push({nm, sec:s.name, v}); }));
  const hi = rows.slice().sort((a,b)=> b.v - a.v || a.nm.localeCompare(b.nm)).slice(0,k);
  const lo = rows.slice().sort((a,b)=> a.v - b.v || a.nm.localeCompare(b.nm)).slice(0,k);
  return {hi, lo, rated: rows.length};
}
function sameRatings(a, b){ const ka = Object.keys(a||{}).filter(k => a[k]), kb = Object.keys(b||{}).filter(k => b[k]); return ka.length === kb.length && ka.every(k => a[k] === b[k]); }

/* ================= small UI pieces ================= */
function scale(value, onPick, lo, hi){
  const wrap = el("div");
  const row = el("div", {class:"scale"});
  for(let v=1; v<=5; v++) row.appendChild(el("button", {type:"button", "aria-pressed": String(value === v), "data-v": v, onclick: () => onPick(v)}, String(v)));
  wrap.appendChild(row);
  if(lo || hi) wrap.appendChild(el("div", {class:"scale-key"}, el("span", null, "1 " + (lo||"")), el("span", null, "5 " + (hi||""))));
  return wrap;
}
function bar(p, prev){
  const b = el("div", {class:"bar", role:"img", "aria-label": "now " + pctText(p) + (prev == null ? "" : ", baseline " + prev + "%")});
  const f = el("div", {class:"fill"}); f.style.width = (p||0) + "%"; b.appendChild(f);
  if(prev != null){ const m = el("div", {class:"prev", title:"baseline: " + prev + "%"}); m.style.left = prev + "%"; b.appendChild(m); }
  return b;
}
/* then-vs-now: grey ring = baseline, gold dot = now, joined when both exist */
function dumb(now, base){
  const w = el("div", {class:"dumb", role:"img", "aria-label": "now " + pctText(now) + (base == null ? "" : ", baseline " + base + "%")});
  w.appendChild(el("i", {class:"trk"})); w.appendChild(el("i", {class:"mid"}));
  if(now != null && base != null && now !== base){ const s = el("i", {class:"span"}); s.style.left = Math.min(now, base) + "%"; s.style.width = Math.abs(now - base) + "%"; w.appendChild(s); }
  if(base != null){ const d = el("i", {class:"dot base"}); d.style.left = base + "%"; w.appendChild(d); }
  if(now != null){ const d = el("i", {class:"dot now"}); d.style.left = now + "%"; w.appendChild(d); }
  return w;
}
/* column chart. Only rects live in the svg (it stretches to the card); every label is HTML, so
   nothing is ever squashed. A point with v == null is an honest gap: a floor tick, no column.
   The dashed line is 50%, the middle of the 1-5 scale. */
function bars(points, emptyText, opts){
  opts = opts || {};
  const box = el("div", {class:"chartbox" + (opts.small ? " sm" : "")});
  if(!points.some(p => p.v != null)){ box.appendChild(el("div", {class:"empty"}, emptyText)); return box; }
  const W = 320, H = 100, padT = 4, n = points.length, gap = n > 10 ? 3 : 5, cw = (W - gap*(n-1)) / n;
  const svg = svgEl("svg", {viewBox:"0 0 " + W + " " + H, preserveAspectRatio:"none", "aria-hidden":"true"});
  points.forEach((pt, i) => {
    const x = i*(cw+gap);
    if(pt.v == null){ svg.appendChild(svgEl("rect", {class:"gap", x:x, y:H-2, width:cw, height:2})); return; }
    const h = Math.max(3, (H - padT) * (pt.v/100));
    const r = svgEl("rect", {class:"col" + (pt.alt ? " alt" : ""), x:x, y:H-h, width:cw, height:h, rx:2});
    const t = svgEl("title", {}); t.textContent = pt.label + ": " + pt.v + "%"; r.appendChild(t);
    svg.appendChild(r);

    $("habitGoals").querySelectorAll("input")[3].oninput({target:{value:"Video 10 min"}});
    ck("goals: typing a fourth habit adds it to Today's list", Store.habitNames().length === 4);
    ck("goals: the block shows 34% and three checkpoint boxes when a start date is set", /Progress · 34%/.test($("blockGoals").textContent) && $("blockGoals").querySelectorAll("textarea").length === 4);
    State.tab = "read"; State.readChapter = null; renderRead();
    ck("read: nine chapter buttons, none labelled 'Chapter Final'", $("readSlot").querySelectorAll("button").length === 9 && !/Chapter Final/.test($("readSlot").textContent) && /Final Thoughts/.test($("readSlot").textContent));
    $("readSlot").querySelectorAll("button")[0].onclick();
    ck("read: Chapter One opens with its prose and a notes box", /The Opportunity/i.test($("readSlot").textContent) && $("readSlot").querySelectorAll("p").length > 5 && !!$("chNote"));
    $("chNote").oninput({target:{value:"my note"}});
    ck("read: a note saves under the chapter", Store.data.notes.ONE === "my note");
    $("markRead").onclick();
    ck("read: Mark as read records the chapter", Store.data.read.ONE === true && /tap to undo/.test($("markRead").textContent));
    State.readChapter = CHAPTERS.findIndex(c => c.n === "TWO"); renderRead();
    ck("read: Chapter Two has the identity statement field", !!$("ans-identity"));
    $("ans-identity").oninput({target:{value:"I am a two-way forward coaches trust late."}});
    State.readChapter = CHAPTERS.findIndex(c => c.n === "THREE"); renderRead();
    $("ans-nonneg").oninput({target:{value:"Early to the rink\n\nStretch after every skate"}});
    State.tab = "today"; renderToday();
    ck("today: the identity statement and each non-negotiable show on the standard card", /two-way forward coaches trust/.test($("standardCard").textContent) && $("standardCard").querySelectorAll("li").length === 2);
    /* tabs */
    TABS.forEach(t => setTab(t));
    ck("tabs: five buttons with drawn icons, the last one current after cycling", $("tabbar").querySelectorAll("button").length === 5 && $("tabbar").querySelectorAll(".ic").length === 5 && $("tabbar").querySelectorAll("button")[4].getAttribute("aria-current") === "page" && document.body.getAttribute("data-tab") === "read");
    setTab("nope");
    ck("tabs: an unknown tab falls back to Today", State.tab === "today");
    ck("header: built from type — his name, the manual's title, no invented subtitle", /Gavin/.test($("heroText").textContent) && /Andersen/.test($("heroText").textContent) && /Player Development Manual/.test($("heroText").textContent) && !/WHL|rookie/i.test($("heroText").textContent));
    /* tokens */
    const gold = getComputedStyle(document.documentElement).getPropertyValue("--gold").trim();
    ck("tokens: --gold is a hex colour on :root", /^#[0-9a-f]{6}$/i.test(gold));
  } catch(e){
    fail.push("threw: " + (e && e.message || e));
  } finally {
    Store.saveLocal = realSave; Date.now = realNow;
    Store.data = JSON.parse(before);
    const ks = JSON.parse(keepState); State.tab = ks.tab; State.openSec = ks.openSec; State.readChapter = ks.readChapter; State.logFilter = ks.logFilter;
    State.draft = Store.data.drafts.log || null; State.ratingsDraft = null; State.checkStep = null; State.pendingImport = null; State.confirmDiscard = false; State.flash = ""; clearTimeout(flashT);
    /* every tab was painted with seeded data above; repaint ALL of them from the real store,
       not only the visible one — on a #ratings load the seeded Today outlived the restore */
    TABS.forEach(renderTab);
    setTab(State.tab);
  }
  ck("after the self-check the store is byte-identical to before it (nothing seeded ships)", JSON.stringify(Store.data) === before);
  ck("after the self-check the Today tab shows the real (empty) state, not the seeded one", !Store.habitNames().length ? /No habit goals yet/.test($("todaySlot").textContent) : true);
  if(fail.length) console.error("PDM SELF-CHECK FAILED " + fail.length + "/" + ran + ":", fail);
  else console.log("PDM self-check: " + ran + "/" + ran + " checks passed");
})();
</script>
</body></html>
