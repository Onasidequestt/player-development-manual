const SECTIONS = [{"name":"Skating","items":["First-Step Quickness","Acceleration","Top Speed","Ability to Change Pace","Edge Control","Balance and Stability","Lateral Movement","Directional Transitions","Stops and Starts","Skating With the Puck","Skating Without the Puck","Maintaining Speed Under Pressure","Movement Through Contact"],"key":"sk"},{"name":"Puck Skill","items":["Receiving Passes","Receiving Passes in Motion","Handling Difficult Passes","Puck Control at Speed","Puck Control in Tight Space","Puck Protection","Passing Accuracy","Passing Speed and Timing","Passing Under Pressure","Deception With the Puck","Backhand Skill","Wall Play and Retrievals","Ability to Make a Play After Contact"],"key":"pk"},{"name":"Shooting and Scoring","items":["Release Speed","Accuracy","Shot Power","Shooting in Stride","Changing the Shooting Angle","Shooting Through Traffic","One-Touch Finishing","Backhand Finishing","Rebounds and Net-Front Finishing","Shot Selection","Ability to Find Scoring Space","Willingness to Attack Inside Ice","Finishing Under Physical Pressure"],"key":"sh"},{"name":"Offensive Play","items":["Puck Support","Timing and Spacing","Offensive-Zone Entries","Defensive-Zone Exits","Transition Play","Forechecking","Offensive-Zone Movement","Creating Inside Position","Extending Possession","Attacking Defenders","Creating for Teammates","Net-Front Play","Play Below the Goal Line","Decisions With Time and Space","Decisions Under Immediate Pressure"],"key":"of"},{"name":"Defensive Play","items":["Backpressure and Tracking","Defensive-Zone Positioning","Awareness Away From the Puck","Protecting Dangerous Space","Wall Responsibilities","Stick Position","Body Position","Closing Speed","Support Below the Puck","Defensive Communication","Reaction After Turnovers","Puck Management Near Blue Lines","Penalty-Killing Habits","Patience and Positional Discipline"],"key":"df"},{"name":"Hockey Sense and Decision Making","items":["Scanning Before Receiving the Puck","Awareness of Pressure","Awareness of Teammates","Recognition of Open Space","Anticipation","Time-and-Score Awareness","Risk Management","Ability to Play Ahead of Pressure","Ability to Adapt During Games","Use of Deception","Recognition of Numerical Advantages","Understanding Team Systems","Ability to Learn Through Video"],"key":"hs"},{"name":"Practice Habit","items":["Punctuality and Preparation","Attention During Instruction","Effort","Execution and Detail","Competitiveness","Communication","Response to Correction","Engagement Between Repetitions","Willingness to Work on Weaknesses","Quality Late in Practice","Post-Practice Recovery"],"key":"ph"},{"name":"Game Habit","items":["Readiness at the Beginning of Games","Shift-to-Shift Consistency","Execution at Game Speed","Decisions Under Pressure","Response After Mistakes","Emotional Control","Discipline","Role Execution","Ability to Adjust During the Game","Performance Late in Games","Response to Reduced Ice Time","Response to Physical Play","Team-First Behavior"],"key":"gh"},{"name":"Mental Performance","items":["Focus","Confidence","Pregame Preparation","Response to Mistakes","Emotional Regulation","Handling Pressure","Ability to Reset","Self-Talk","Resilience","Ability to Remain Present","Response to Comparison","Ability to Ask for Help","Identity Outside Hockey"],"key":"mp"},{"name":"Communication and Coachability","items":["Listening","Body Language During Feedback","Asking Questions","Honesty","Applying Feedback","Follow-Through","Discussing My Role","Communicating Health Concerns","Handling Disagreement"],"key":"cc"},{"name":"Team Contribution","items":["Encouragement","Reliability","Bench Engagement","Practice Energy","Response to Teammates' Success","Response to Teammates' Mistakes","Inclusion and Respect","Willingness to Perform an Unglamorous Role","Leadership","Contribution During Personal Difficulty"],"key":"tc"},{"name":"Recovery and Health","items":["Recurring soreness or symptoms","Medical communication","Treatment follow-through","Cooldown habits","Mobility and recovery work","Post-activity hydration","Post-activity nutrition","Travel recovery","Willingness to rest when directed"],"key":"rh"},{"name":"Nutrition and Hydration","items":["Eating regular meals","Breakfast consistency","Pre-training and pregame fueling","Post-training recovery nutrition","Daily hydration","Travel-food preparation","Energy throughout the day"],"key":"nh"},{"name":"Sleep","items":["Average nightly sleep","Bedtime consistency","Wake-time consistency","Sleep quality","Ability to fall asleep","Nighttime interruptions","Screen use before bed","Caffeine timing","Travel sleep","Morning energy"],"key":"sl"},{"name":"Professional and Personal Conduct","items":["Punctuality","Equipment Care","Treatment of Coaches and Staff","Billet or Home Responsibilities","Academic Responsibility","Public Conduct","Social-Media Conduct","Honesty","Rule Compliance","Handling Commitments","Accountability After Mistakes","Gratitude"],"key":"pc"}];
const CHAPTERS = [{"n":"ONE","title":"The Opportunity","blocks":[{"h":"","p":["Very few athletes receive the opportunity to compete at this level.","For years, hockey may have been measured by practices, tournaments, long drives, early mornings, friendships, victories, disappointments, and the simple enjoyment of playing the game. Reaching the Western Hockey League does not erase any of those things, but it changes what the opportunity requires.","The game becomes faster. The players become stronger. Decisions must be made sooner. Mistakes are exposed more quickly. Expectations rise, both on and off the ice.","At this level, talent is no longer unusual. Nearly every player was one of the best players on his previous team. Nearly every player has experienced success. Nearly every player has been told that he has potential.","Potential may open the door, but it does not determine how long the door remains open.","What separates players over time is their willingness to develop. It is their ability to listen, adjust, recover, prepare, and continue working when progress is slow or recognition is absent. It is the discipline to do ordinary things well, repeatedly, even when no one is watching.","Playing in the WHL is not the completion of the journey. It is the beginning of a more demanding stage of it."]},{"h":"Gratitude Becomes Responsibility","p":["An opportunity of this size should create gratitude, but gratitude is more than feeling fortunate.","Gratitude becomes responsibility.","It means treating practice as a privilege rather than an obligation. It means respecting the coaches, teammates, billet families, trainers, equipment staff, teachers, volunteers, family members, and communities that make the opportunity possible.","It means arriving prepared.","It means taking care of your equipment, your body, your responsibilities, and the people around you.","It means understanding that every role matters. There may be nights when you play significant minutes and nights when your role is smaller. There may be stretches when your progress is obvious and stretches when it feels as though nothing is changing. There may be moments when confidence comes easily and moments when it does not.","The responsibility remains the same.","Prepare honestly. Compete fully. Learn continuously. Treat people well."]},{"h":"The Standard Changes","p":["The habits that brought a player to this level may not be enough to carry him through it.","That is not an insult to what came before. It is a natural part of development.","As competition improves, the standard must improve with it.","A workout is no longer only about completing the exercises. It is about movement quality, intent, consistency, and understanding why the work matters.","Recovery is no longer something to consider only when the body feels tired. It becomes part of training itself.","Nutrition is not simply eating when hungry. It is providing the body with the energy and nutrients required to practice, compete, recover, grow, and remain healthy through a demanding season.","Sleep is not unused time. It is one of the most important periods of physical and mental development.","Video review is not punishment for making mistakes. It is an opportunity to see the game more clearly and shorten the distance between experience and improvement.","Feedback is not a judgment of personal worth. It is information.","The professional approach is not to perform every habit perfectly. No athlete does that. The professional approach is to recognize what the standard requires and continually move closer to it."]},{"h":"Honesty Before Improvement","p":["This manual will only be useful if it is used honestly.","There is no value in recording what sounds impressive. There is no benefit in giving yourself high marks when the effort was incomplete, ignoring soreness that should be reported, or pretending to understand feedback that remains unclear.","Improvement begins with an accurate assessment of where you are.","Some days will be excellent. Record them honestly and determine what helped produce them.","Some days will be poor. Record them honestly without turning one difficult practice or game into a judgment about who you are as a player.","The purpose is not self-criticism. The purpose is self-awareness.","Honesty allows patterns to emerge.","You may discover that your best games tend to follow consistent sleep. You may notice that poor food preparation affects your energy during travel. You may see that certain mistakes occur when you stop scanning before receiving the puck. You may recognize that frustration after one bad shift sometimes carries into the next.","A single entry may not reveal much. Weeks and months of honest entries can reveal a great deal.","That information creates an advantage only when you are willing to act on it."]},{"h":"Discipline When Motivation Changes","p":["Motivation is valuable, but it is unreliable.","There will be days when you cannot wait to get to the rink. There will also be days when your body is tired, your confidence is low, your role is uncertain, or your progress feels invisible.","A serious player cannot depend entirely on how motivated he feels.","When motivation fades, discipline remains.","Discipline means following the plan when the work is repetitive. It means completing recovery when you would rather move on with the day. It means preparing properly for a practice that no scouts will watch. It means making a good decision after a teammate, coach, official, or opponent has frustrated you.","Discipline also means knowing when to communicate.","Playing through every problem is not always toughness. There are times when the responsible action is to report pain, illness, fatigue, or uncertainty to the appropriate member of the team staff. Professional habits include asking for help before a manageable problem becomes a larger one.","The objective is not to become emotionless or mechanically perfect. The objective is to remain dependable while emotions and circumstances change."]},{"h":"Preparation Creates Confidence","p":["Confidence is often treated as a feeling that a player either possesses or loses.","A more durable form of confidence comes from evidence.","You build that evidence when you complete the work your coaches prescribe, practice skills with intention, prepare your body, study the game, recover properly, and respond constructively to feedback.","Preparation does not guarantee that every game will go well. Hockey is too unpredictable for that. A good shot may hit the post. A smart play may not produce a point. A strong performance may be overlooked. A mistake may lead directly to a goal against.","Preparation does guarantee that you have given yourself the best available chance to perform.","When confidence feels strong, preparation keeps you grounded.","When confidence feels weak, preparation gives you something solid to rely upon.","You may not always be able to control the outcome, but you can control whether you were ready to meet the moment."]},{"h":"The Player And The Person","p":["The pursuit of hockey development should not be separated from personal development.","The habits that make someone a dependable player often make him a dependable person: punctuality, honesty, humility, resilience, communication, respect, and the willingness to take responsibility.","Hockey will test these qualities.","It will test how you respond when another player receives the opportunity you wanted. It will test how you treat teammates when you are playing well and when you are struggling. It will test whether you can receive difficult feedback without becoming defensive. It will test whether you can remain respectful when disappointed.","It will also provide opportunities to lead, encourage, contribute, and represent something larger than yourself.","Statistics matter. Results matter. Advancement matters. It is appropriate to pursue all of them seriously.","But statistics will eventually fade. Seasons will end. Teams will change. The person you become through pursuing excellence will remain.","That is what this manual is ultimately designed to support."]},{"h":"Use The Opportunity Well","p":["You do not need to know today exactly how far hockey will take you.","You do need to decide how you will approach the opportunity in front of you.","Every practice is an opportunity to become more skilled.","Every workout is an opportunity to become more physically prepared.","Every recovery session is an opportunity to protect future performance.","Every meal is an opportunity to provide your body with what it needs.","Every video session is an opportunity to understand the game more deeply.","Every difficult moment is an opportunity to strengthen your response.","Every interaction is an opportunity to establish what kind of teammate and person you will be.","No single day will define your career. Your direction will be shaped by what you do repeatedly.","Treat the opportunity accordingly."]},{"h":"Player Reflection","p":["Why do I play hockey?","Consider what first drew you to the game, what you enjoy about it now, and what makes the work meaningful to you beyond recognition, statistics, or advancement.","What does this opportunity mean to me?","Consider what reaching this level represents, who helped you get here, and what responsibility comes with the opportunity.","What kind of player do I want to become?","Describe the qualities, habits, skills, and style of play you want others to associate with you.","What kind of teammate do I want to become?","Think about how you want teammates to experience your presence during success, adversity, competition, travel, practice, and everyday team life.","What kind of man do I hope hockey helps me become?","Think beyond the rink. Consider character, relationships, responsibility, resilience, leadership, and the values you want to carry throughout your life."],"w":["Why do I play hockey?","Consider what first drew you to the game, what you enjoy about it now, and what makes the work meaningful to you beyond recognition, statistics, or advancement.",7,"What does this opportunity mean to me?","Consider what reaching this level represents, who helped you get here, and what responsibility comes with the opportunity.",7,"What kind of player do I want to become?","Describe the qualities, habits, skills, and style of play you want others to associate with you.",7,"What kind of teammate do I want to become?","Think about how you want teammates to experience your presence during success, adversity, competition, travel, practice, and everyday team life.",7,"What kind of man do I hope hockey helps me become?","Think beyond the rink. Consider character, relationships, responsibility, resilience, leadership, and the values you want to carry throughout your life.",7]},{"h":"Chapter Commitment","p":["The opportunity in front of me was created by talent, work, sacrifice, support, and circumstance.","I understand that the opportunity itself does not guarantee what comes next.","My habits will determine how prepared I am to use it.","I will approach my development honestly. I will remain coachable. I will take responsibility for my preparation, recovery, attitude, communication, and conduct.","I will not expect perfection from myself, but I will expect effort, honesty, and a willingness to improve.","I will respect the game, the people who support me, and the opportunity I have been given."]}]},{"n":"TWO","title":"My Identity As A Player","blocks":[{"h":"","p":["Every player develops a reputation.","Sometimes that reputation is built through goals, assists, highlight-reel plays, or physical ability. More often, it is built through hundreds of smaller moments: how a player competes for a loose puck, whether he supports the play away from the puck, how quickly he responds after a mistake, whether his teammates trust him, and how consistently his habits appear from one day to the next.","A player’s identity is not a slogan. It is the collection of qualities, decisions, and behaviors that repeatedly show up in his game.","At lower levels, natural ability may allow a player to succeed without clearly understanding what makes him effective. At higher levels, that understanding becomes increasingly important. The competition is stronger, roles are more specific, and coaches need to know what they can reliably expect from each player.","This chapter is designed to help you identify the player you are today, the player others currently experience, and the player you are working to become.","The objective is not to place yourself into a permanent category. Your identity should continue evolving as your skills, body, experience, and understanding of the game develop.","The objective is to create direction."]},{"h":"Identity Is Built Through Repetition","p":["You do not establish your identity by describing yourself once.","You establish it through repeated evidence.","A player cannot simply declare that he is dependable. Dependability is demonstrated by consistently being in the correct position, managing the puck responsibly, communicating, preparing properly, and responding well when circumstances become difficult.","A player cannot simply declare that he is competitive. Competitiveness appears in races, battles, second efforts, backchecks, net-front play, practice habits, and the willingness to stay engaged when the game is not going his way.","A player cannot simply declare that he is skilled. Skill becomes valuable when it can be executed at speed, under pressure, within the structure of the team, and at the moments when the game demands it.","The player you believe yourself to be matters. The player your coaches and teammates experience matters more. A useful player identity must be visible through behavior."]},{"h":"Knowing What You Bring","p":["Every player enters a team with a different combination of abilities.","Some players create offense through speed. Some protect the puck and extend possession. Some recognize developing plays before others do. Some are especially effective below the goal line, around the net, on the penalty kill, or in transition.","Some players bring calm. Some bring energy. Some make linemates better through communication and support. Some can change the momentum of a game through physical play, pressure, or relentless effort.","Understanding what you bring does not mean becoming satisfied with your current strengths. It means recognizing what already gives you value so that you can continue strengthening it.","Your strongest qualities can become the foundation upon which the rest of your game is built.","Development should add dimensions to your game without erasing your foundation."]},{"h":"Strengths Must Survive Pressure","p":["A quality is not yet a reliable strength simply because it appears during drills or low-pressure situations.","At higher levels, strengths must survive speed, pressure, fatigue, physical contact, uncertainty, and limited time.","The question is not only, “What can I do?” The more useful question is, “What can I do consistently under the conditions of the game?”","A professional-level strength is not merely impressive. It is repeatable."]},{"h":"Your Role And Your Identity Are Connected","p":["A player’s role may change throughout a season.","You may move between lines. You may receive more or less ice time. You may play different special-teams roles. Injuries, matchups, roster changes, and team needs may all affect how you are used.","Your role describes what the team needs from you in a particular situation. Your identity describes the qualities you bring regardless of the role.","A strong player identity provides stability when the role changes.","A smaller role is not an instruction to become passive. It is an opportunity to demonstrate that your habits can be trusted."]},{"h":"Do Not Confuse Identity With Statistics","p":["Statistics are useful, but they do not provide a complete description of a player.","Goals and assists reveal part of what happened. They do not always reveal why it happened, whether the player made strong decisions throughout the game, or how much he contributed away from the puck.","A player can perform well without scoring. A player can also score while playing an otherwise incomplete game.","If your identity depends entirely on production, confidence may rise and fall with every point. A complete player learns to evaluate both production and process."]},{"h":"The Difference Between Who You Are And Who You Want To Become","p":["An honest player identity includes both strengths and limitations.","It is tempting to describe only the finished player you hope to become. That vision matters, but it should not replace an accurate assessment of the present.","The gap between your present and future identity is not a reason for discouragement. It is the location of the work."]},{"h":"Identity Should Guide Training","p":["Training becomes more effective when it is connected to the player you are trying to become.","A vague goal such as “get better at hockey” does not provide much direction. A specific identity creates better questions.","The identity should not become restrictive. A player can be fast, responsible, skilled, physical, intelligent, and creative. The purpose is to identify the qualities that deserve the greatest attention during the current stage of development."]},{"h":"Language Shapes Attention","p":["The language you use to describe yourself affects what you notice and reinforce.","A productive identity describes what you intend to do, not merely what you hope to avoid.","Useful identity language is specific, believable, observable, connected to controllable behavior, demanding without being unrealistic, and capable of guiding daily action."]},{"h":"Identity Must Remain Flexible","p":["A player’s identity should be stable enough to provide direction but flexible enough to allow growth.","Young players sometimes become trapped by labels. Labels can become limits when treated as permanent.","You are not required to remain the exact player you were last season. Continue asking whether your identity reflects who you are becoming."]},{"h":"The Identity Others Experience","p":["Self-assessment is valuable, but it is incomplete. Every player has blind spots.","This is why feedback matters. Ask coaches specific questions about what makes you valuable, what they trust you to do, the role they see for you, and what must improve before that role can expand.","The most accurate identity is usually built from several perspectives: your own assessment, coach feedback, video evidence, performance trends, teammate experience, measurable development, and repeated behavior under pressure."]},{"h":"Your Identity Statement","p":["A player identity statement is a short description of the player you are committed to becoming.","It should not sound like a slogan created for social media. It should be useful during preparation, training, competition, and review.","For example: I am developing into a fast, dependable two-way forward who pressures the puck, makes responsible decisions, creates offense through pace and support, and remains composed and competitive in every role.","That statement does not claim perfection. It describes direction."]},{"h":"Proving The Identity","p":["Once you have written your identity statement, ask one final question: What would another person need to observe to know that this identity is true?","Your identity becomes real when it can be recognized without explanation.","You do not need to prove everything in one game. You build the evidence one practice, one shift, one decision, and one response at a time."]},{"h":"Player Identity Assessment","p":["My Current Player Profile","The Way I Currently Play","Describe your game as it exists today. Do not describe the player you eventually hope to become.","My Five Strongest Current Qualities","Evidence:","Evidence:","Evidence:","Evidence:","Evidence:","Strength Under Pressure","Which of my strengths remain dependable when the game becomes faster, more physical, or more difficult?","Which strengths become less consistent under pressure?","What conditions make those strengths less dependable?","How I Currently Help My Team","Creating offense | Finishing | Puck possession | Forechecking | Defensive responsibility | Transition | Puck support | Physical engagement | Net-front play | Special teams | Communication | Energy | Leadership | Practice habits | Emotional composure","The three most important ways I currently help my team are:","My Current Role","What do I believe my coaches currently need from me?","What parts of my current role do I understand clearly?","What parts remain unclear?","What do I need to ask a coach?","How Others May Experience Me","How do I believe my coaches would describe me?","How do I believe my teammates would describe me?","What qualities do I hope they already trust?","What might they need to see more consistently?","My Development Gaps","What part of my game is currently limiting my effectiveness the most?","What part becomes least dependable under pressure?","What feedback have I heard repeatedly?","What do I sometimes avoid working on because it is uncomfortable or difficult?","The Player I Am Becoming","Describe the player you want to become over the next two to three seasons.","Future Player Qualities","Present-to-Future Development Map","Quality 1","Quality I want to develop:","Where I am today:","What must improve:","How I will train or practice it:","What evidence will show progress:","Quality 2","Quality I want to develop:","Where I am today:","What must improve:","How I will train or practice it:","What evidence will show progress:","Quality 3","Quality I want to develop:","Where I am today:","What must improve:","How I will train or practice it:","What evidence will show progress:"],"w":["My Current Player Profile","Primary position: ___","Secondary position, if applicable: ___","Shoots: ___","Current team: ___","Current role: ___","Special-teams responsibilities: ___","Situations in which coaches currently use me most: ___","The Way I Currently Play","Describe your game as it exists today. Do not describe the player you eventually hope to become.",6,"My Five Strongest Current Qualities","1. Strength: ___","Evidence:",2,"2. Strength: ___","Evidence:",2,"3. Strength: ___","Evidence:",2,"4. Strength: ___","Evidence:",2,"5. Strength: ___","Evidence:",2,"Strength Under Pressure","Which of my strengths remain dependable when the game becomes faster, more physical, or more difficult?",3,"Which strengths become less consistent under pressure?",3,"What conditions make those strengths less dependable?",3,"How I Currently Help My Team","Creating offense | Finishing | Puck possession | Forechecking | Defensive responsibility | Transition | Puck support | Physical engagement | Net-front play | Special teams | Communication | Energy | Leadership | Practice habits | Emotional composure","The three most important ways I currently help my team are:",3,"My Current Role","What do I believe my coaches currently need from me?",2,"What parts of my current role do I understand clearly?",2,"What parts remain unclear?",2,"What do I need to ask a coach?",2,"How Others May Experience Me","How do I believe my coaches would describe me?",2,"How do I believe my teammates would describe me?",2,"What qualities do I hope they already trust?",2,"What might they need to see more consistently?",2,"My Development Gaps","What part of my game is currently limiting my effectiveness the most?",2,"What part becomes least dependable under pressure?",2,"What feedback have I heard repeatedly?",2,"What do I sometimes avoid working on because it is uncomfortable or difficult?",2,"The Player I Am Becoming","Describe the player you want to become over the next two to three seasons.",6,"Future Player Qualities","1. ___","2. ___","3. ___","4. ___","5. ___","Present-to-Future Development Map","Quality 1","Quality I want to develop:",2,"Where I am today:",2,"What must improve:",2,"How I will train or practice it:",2,"What evidence will show progress:",2,"Quality 2","Quality I want to develop:",2,"Where I am today:",2,"What must improve:",2,"How I will train or practice it:",2,"What evidence will show progress:",2,"Quality 3","Quality I want to develop:",2,"Where I am today:",2,"What must improve:",2,"How I will train or practice it:",2,"What evidence will show progress:",2]},{"h":"Coach Feedback Conversation","p":["What qualities currently make me valuable to the team?","What do you trust me to do consistently?","What role do you currently see for me?","What part of my game must improve before my role can expand?","What habit do you most want me to demonstrate more consistently?","What should I focus on during the next four weeks?","My understanding of the feedback:","Action I will take:","Date I will follow up:"],"w":["Coach: ___","Date: ___","What qualities currently make me valuable to the team?",2,"What do you trust me to do consistently?",2,"What role do you currently see for me?",2,"What part of my game must improve before my role can expand?",2,"What habit do you most want me to demonstrate more consistently?",2,"What should I focus on during the next four weeks?",2,"My understanding of the feedback:",2,"Action I will take:",2,"Date I will follow up:",2]},{"h":"My Player Identity Statement","p":["Use the assessments in this chapter to write a clear description of the player you are committed to becoming.","Working Draft","Final Identity Statement"],"w":["Use the assessments in this chapter to write a clear description of the player you are committed to becoming.","Working Draft","I am developing into a player who ___",4,"Final Identity Statement",4]},{"h":"Evidence Of My Identity","p":["In practice, I will:","During games, I will:","Away from the rink, I will:","When I make a mistake, I will:","When my role is smaller than I want, I will:","When I receive difficult feedback, I will:"],"w":["In practice, I will:",3,"During games, I will:",3,"Away from the rink, I will:",3,"When I make a mistake, I will:",3,"When my role is smaller than I want, I will:",3,"When I receive difficult feedback, I will:",3]},{"h":"Chapter Commitment","p":["I understand that my identity as a player is not created by words alone.","It is created through the habits, decisions, effort, and character that I repeatedly demonstrate.","I will remain honest about the player I am today while continuing to work toward the player I can become.","I will build upon my strengths without allowing them to limit the expansion of my game.","I will seek feedback, examine evidence, and adjust when my self-perception does not match what my coaches, teammates, or performance show me.","I will not allow one game, one statistic, one mistake, or one opinion to define me.","I will establish my identity through consistent action."]}]},{"n":"THREE","title":"My Personal Standard","blocks":[{"h":"","p":["Goals describe what you want to accomplish.","Standards describe how you choose to operate while pursuing those goals.","A goal may be to earn more ice time, become a stronger skater, contribute offensively, make a special-teams unit, or advance to the next level. Each of those outcomes matters, but none of them is entirely within your control.","A coach determines the lineup. Teammates and opponents affect results. Injuries occur. Roles change. Opportunities arrive at different times. Even a well-played game may not produce the result you hoped for.","Your standard remains available regardless of circumstances.","It determines how you prepare when you are excited and when you are tired. It determines how you behave when you are praised and when you are criticized. It determines what teammates can expect from you when your role is large, when your role is small, and when your future feels uncertain.","A personal standard is not a demand that you perform perfectly.","It is a commitment to behaviors and values that should remain recognizable through changing circumstances.","The objective of this chapter is to define the standard you expect from yourself as a player, teammate, and person."]},{"h":"The Difference Between Goals And Standards","p":["Goals give direction.","Standards govern daily behavior.","A goal might be:","I want to become one of the most trusted forwards on the team.","The supporting standards might be:","I arrive prepared and on time.","I understand my assignments.","I communicate clearly.","I manage the puck responsibly.","I compete away from the puck.","I respond quickly after mistakes.","I ask questions when something is unclear.","I complete recovery work even when no one is watching.","The goal may take months to achieve.","The standards can begin today.","This distinction is important because athletes often become overly focused on outcomes. When the desired result does not arrive quickly, motivation drops. The player may begin questioning whether the work matters.","A standard provides a way to succeed within the process.","You may not control whether you score tonight. You can control whether you arrive mentally prepared, attack the game with purpose, support teammates, compete through difficult shifts, and learn from what happens.","Standards create stability when outcomes fluctuate."]},{"h":"Your Standard Is What You Repeat","p":["A personal standard is not defined by your best day.","Most athletes can perform strong habits when they feel healthy, confident, rested, and motivated.","The standard becomes visible on the difficult days.","It appears when the team returns late from travel. It appears during a scoring drought. It appears after reduced ice time, an uncomfortable meeting, a poor practice, or a mistake that contributed to a goal against.","Your standard is revealed by what you repeatedly return to.","One poor response does not erase your standard. Every player becomes frustrated, distracted, or discouraged at times. The important question is how quickly you recognize that you have moved away from your standard and how deliberately you return to it.","A strong standard does not make you perfect.","It makes you accountable."]},{"h":"Standards Must Be Observable","p":["A standard should describe behavior clearly enough that you can determine whether you followed it.","Statements such as “work hard,” “be better,” or “stay positive” may sound useful, but they are difficult to evaluate.","What does working hard look like?","Does it mean finishing every drill with intent? Winning the race back into position? Remaining engaged while waiting for your next repetition? Completing prescribed recovery? Staying mentally present during video review?","What does being a good teammate look like?","Does it mean communicating on the ice, encouraging a teammate after a mistake, respecting every role, helping maintain team energy, or refusing to make personal frustration the team’s problem?","What does staying composed look like?","Does it mean controlling body language, avoiding retaliation, listening fully before responding, using a reset breath, or returning attention to the next play?","A useful standard can be observed.","The more specific it becomes, the more effectively it can guide action."]},{"h":"The Standard Does Not Depend On Your Role","p":["A player’s role may change frequently, especially during his first season at a higher level.","There may be nights when you play important minutes and nights when opportunities are limited. You may move between lines, sit during certain situations, or be asked to contribute in a way that differs from the role you previously held.","Your role may change.","Your standard should not.","A smaller role does not lower the standard for preparation, communication, practice habits, recovery, or respect.","In fact, the periods when your role is limited may be when your standard matters most.","Coaches notice whether a player remains engaged. Teammates notice whether his attitude changes. Staff notice whether he continues preparing seriously. These moments provide evidence about whether the player can be trusted with greater responsibility.","You cannot always control the role you receive.","You can control the quality with which you perform it."]},{"h":"Your Standard In Practice","p":["Practice is where many aspects of your identity are built.","Games are highly visible, but practice provides far more repetitions. It is where coaches observe learning, consistency, attention, response to feedback, and willingness to compete without the energy of a crowd.","A strong practice standard may include:","arriving early enough to prepare without rushing;","understanding the purpose of the session;","beginning mentally engaged;","performing warm-ups with intent;","listening while coaches speak;","executing drills correctly before trying to impress;","competing without becoming reckless;","practicing details at game speed;","communicating with teammates;","remaining involved between repetitions;","asking questions when assignments are unclear;","responding to correction without visible resistance;","finishing the session with the same attention used at the beginning;","completing recovery responsibilities afterward.","Practice habits become game habits.","A player should not expect details ignored during the week to appear automatically under pressure."]},{"h":"Your Standard During Games","p":["A game standard should focus on controllable behaviors rather than demanding a specific statistical result.","You cannot promise yourself that you will score.","You can commit to skating with purpose, supporting the puck, finishing routes, getting inside the play, tracking responsibly, communicating, and responding to every shift.","A useful game standard may include:","preparing for the first shift before the puck is dropped;","beginning with simple, purposeful execution;","playing within the team’s structure;","competing through contact;","keeping shifts disciplined;","managing the puck according to time, score, and location;","remaining aware away from the puck;","communicating from the bench and ice;","responding immediately after turnovers;","avoiding emotional penalties;","resetting after mistakes;","staying prepared during periods of limited ice time;","supporting teammates regardless of personal production;","finishing the game with the same responsibility used to begin it.","The standard should remain intact whether you score two goals or record no points.","Production matters, but your behavior cannot be dependent upon it."]},{"h":"Your Standard After A Mistake","p":["Mistakes are unavoidable in a fast and complex game.","Attempting to eliminate every mistake can make a player cautious, hesitant, and afraid to make decisions. The objective is not to avoid all failure. The objective is to make increasingly better decisions and respond effectively when execution breaks down.","The moments immediately after a mistake are especially important.","A weak response may include:","stopping your feet;","showing frustration through body language;","blaming a teammate;","arguing with an official;","forcing the next play;","becoming overly cautious;","carrying the mistake into future shifts.","A stronger response includes:","recognizing what happened;","returning immediately to the play;","recovering defensively where necessary;","controlling visible frustration;","identifying the lesson;","communicating when appropriate;","returning attention to the next responsibility.","Your standard after a mistake may be summarized simply:","Respond before reacting.","This means performing the next useful action before allowing frustration to control the moment.","A player who responds well to mistakes becomes easier to trust because coaches know that one error is less likely to become several."]},{"h":"Your Standard When Receiving Feedback","p":["Feedback is part of development.","Some feedback will be encouraging. Some will be direct, uncomfortable, or difficult to hear. The delivery may not always be ideal, but the player is still responsible for deciding how to use the information.","A high standard for receiving feedback includes:","listening without interrupting;","controlling defensive body language;","making sure you understand what is being requested;","asking a clear question when necessary;","separating the feedback from your personal worth;","applying the instruction visibly;","following up when progress needs to be reviewed.","You are not required to agree immediately with every opinion.","You are required to listen carefully enough to understand it.","When feedback is unclear, ask:","What specifically do you want me to do differently?","In which situations does this problem appear?","What would improvement look like?","Is there a video example we can review?","What should I focus on first?","Coachability is not passive agreement.","It is the ability to receive information, evaluate it honestly, and turn useful feedback into action."]},{"h":"Your Standard As A Teammate","p":["A team consists of players experiencing different roles, pressures, expectations, and personal circumstances.","A good teammate does not need to be the loudest person in the room. He does need to understand that his behavior affects other people.","A strong teammate standard may include:","respecting every player’s role;","communicating honestly and constructively;","supporting teammates after mistakes;","celebrating team success without jealousy;","avoiding gossip and unnecessary division;","helping younger or newer teammates feel included;","handling personal disappointment without damaging the group;","being dependable during travel and team activities;","respecting shared spaces and equipment;","acknowledging the work of trainers, equipment staff, billets, coaches, and volunteers;","addressing conflict directly and appropriately;","refusing to embarrass teammates publicly or online.","A player’s character is often revealed by how he treats people who cannot improve his status.","Respect should not depend upon a person’s role, title, age, popularity, or influence."]},{"h":"Your Standard Away From The Rink","p":["Development does not stop when practice ends.","Decisions away from the rink affect energy, recovery, trust, health, and reputation.","A personal standard away from hockey may include:","following team rules;","treating billet families and hosts respectfully;","communicating schedules and needs clearly;","completing school responsibilities;","protecting sleep;","eating and hydrating appropriately;","avoiding unnecessary risk;","using social media responsibly;","arriving where you are expected to be;","taking care of personal spaces;","being truthful when problems occur;","asking for help before an issue becomes unmanageable.","Living like a professional does not mean removing all enjoyment from life.","It means understanding that choices have consequences and accepting responsibility for those consequences.","Freedom and accountability must develop together."]},{"h":"Your Standard For Body Language","p":["Body language communicates before words do.","Coaches and teammates notice whether a player looks engaged, frustrated, dismissive, nervous, defeated, or ready.","Body language does not need to be artificially enthusiastic. Players have different personalities. Some are expressive, while others are quiet and composed.","The standard is not constant performance.","The standard is avoiding behavior that weakens trust or affects the team unnecessarily.","Examples include:","slamming equipment;","rolling your eyes during correction;","separating yourself from teammates;","visibly giving up on a play;","reacting dramatically to reduced ice time;","showing disgust toward a teammate’s mistake;","remaining seated or disengaged when the bench needs energy.","Strong body language may be simple:","standing ready;","maintaining eye contact;","returning quickly to position;","listening fully;","communicating clearly;","showing teammates that you remain involved.","Your body language should communicate that you are prepared for the next responsibility."]},{"h":"Your Standard Under Pressure","p":["Pressure may come from competition, expectations, scouts, statistics, injuries, family, social media, or your own ambitions.","Pressure often narrows attention.","A player may become focused on proving himself, avoiding mistakes, or controlling outcomes that cannot be controlled. The result can be rushed decisions, hesitation, frustration, and disconnection from the game.","Your standard under pressure should return attention to simple responsibilities:","breathe;","scan;","move your feet;","communicate;","support the puck;","make the next clear decision;","finish the shift responsibly;","recover;","prepare again.","Pressure does not always require a dramatic mental strategy.","Often it requires returning to the fundamentals of your role."]},{"h":"Your Minimum Standard","p":["Every player will have days when his energy, confidence, or physical readiness is lower than normal.","The minimum standard defines the behaviors that remain non-negotiable even on difficult days.","It should not require you to hide an injury, ignore illness, or pretend to be fully recovered. Honest communication with medical and performance staff is part of the standard.","A minimum standard may include:","arrive on time;","communicate honestly;","listen fully;","give the best available effort;","perform the assigned role;","treat people respectfully;","avoid excuses and blame;","complete required recovery;","identify one lesson;","prepare for the next day.","The best available effort will not look identical every day.","The minimum standard concerns commitment and conduct, not pretending that physical and emotional capacity never changes."]},{"h":"Raising The Standard","p":["Standards should evolve as you develop.","What once required conscious effort may become an established habit. At that point, a higher level of detail may deserve attention.","A young player may initially focus on arriving prepared and understanding assignments. Later, his standard may expand to include leadership, advanced tactical preparation, mentoring teammates, and managing the demands of a larger role.","Raising the standard does not mean constantly criticizing yourself.","It means recognizing when you are capable of more.","Ask periodically:","Which standards have become automatic?","Which standards remain inconsistent?","Where have I become comfortable?","What does the next level require?","What behavior would make me more dependable?","What detail would separate me from other players with similar ability?","The standard should challenge you without becoming impossible to maintain.","A standard that demands perfection will eventually be ignored.","A strong standard is demanding, realistic, and repeatable."]},{"h":"Correcting A Broken Standard","p":["There will be moments when you fail to meet your own expectations.","You may react poorly, arrive unprepared, ignore recovery, become defensive, take an unnecessary penalty, or allow frustration to affect others.","Accountability does not require pretending that it did not happen.","It also does not require endless self-punishment.","Use a clear correction process:","1. Acknowledge it. State honestly what happened.","2. Take responsibility. Avoid blaming circumstances or other people for your response.","3. Repair what is necessary. Apologize, communicate, or correct the practical consequence.","4. Identify the trigger. Understand what made the standard difficult to maintain.","5. Choose the next action. Decide what you will do differently when the situation returns.","6. Move forward. Do not turn accountability into an excuse to remain stuck in the mistake.","A standard becomes stronger when it includes a reliable path back to it."]},{"h":"The Standard You Represent","p":["As your career develops, younger players may watch how you behave.","They may notice your preparation, confidence, equipment, skill, and success. They will also notice how you treat people, respond to correction, carry yourself after a loss, and act when your role is not what you hoped it would be.","Whether you intend to or not, your behavior teaches.","The standard you establish affects more than your own performance.","It contributes to the culture of the team and becomes part of how people remember playing with you.","Your standard should answer this question:","What should people consistently experience when they work, compete, travel, and spend time with me?","The answer should be visible in daily life."]},{"h":"Personal Standard Assessment","p":["What Do I Want to Be Known For?","As a player:","As a teammate:","As a person:","My Current Standard","Describe how you currently prepare, practice, compete, recover, communicate, and respond to adversity.","Be honest about what is already strong and what remains inconsistent.","When My Standard Is Strongest","When is it easiest for me to operate at my best?","Consider confidence, role, sleep, preparation, health, team environment, and recent performance.","When My Standard Becomes Vulnerable","Which circumstances make it harder for me to maintain strong habits and behavior?","Describe the situations that affect me most:","My Typical Response Under Stress","What do I tend to do when I become frustrated, embarrassed, disappointed, tired, or uncertain?","What does my body language communicate during those moments?","How might teammates or coaches experience my response?","What would a stronger response look like?"],"w":["What Do I Want to Be Known For?","As a player:",3,"As a teammate:",3,"As a person:",3,"My Current Standard","Describe how you currently prepare, practice, compete, recover, communicate, and respond to adversity.",3,"Be honest about what is already strong and what remains inconsistent.",3,"When My Standard Is Strongest","When is it easiest for me to operate at my best?",3,"Consider confidence, role, sleep, preparation, health, team environment, and recent performance.",3,"When My Standard Becomes Vulnerable","Which circumstances make it harder for me to maintain strong habits and behavior?",3,"Describe the situations that affect me most:",3,"My Typical Response Under Stress","What do I tend to do when I become frustrated, embarrassed, disappointed, tired, or uncertain?",3,"What does my body language communicate during those moments?",3,"How might teammates or coaches experience my response?",3,"What would a stronger response look like?",3]},{"h":"My Practice Standard","p":["Before practice, I will:","During instruction, I will:","During drills, I will:","When practice becomes difficult, I will:","When I receive correction, I will:","After practice, I will:","The one practice habit I most need to improve is:","The evidence that this habit is improving will be:"],"w":["Before practice, I will:",2,"During instruction, I will:",2,"During drills, I will:",2,"When practice becomes difficult, I will:",2,"When I receive correction, I will:",2,"After practice, I will:",2,"The one practice habit I most need to improve is:",2,"The evidence that this habit is improving will be:",2]},{"h":"My Game Standard","p":["Before the game, I will:","During my first shifts, I will:","Away from the puck, I will:","When I have the puck, I will:","When the game becomes physical, I will:","When my role is limited, I will:","When I make a mistake, I will:","When a teammate makes a mistake, I will:","When the game ends, I will:"],"w":["Before the game, I will:",2,"During my first shifts, I will:",2,"Away from the puck, I will:",2,"When I have the puck, I will:",2,"When the game becomes physical, I will:",2,"When my role is limited, I will:",2,"When I make a mistake, I will:",2,"When a teammate makes a mistake, I will:",2,"When the game ends, I will:",2]},{"h":"My Teammate Standard","p":["My teammates should be able to trust me to:","I will contribute to the team environment by:","When I am personally disappointed, I will avoid:","When another player succeeds in a role I wanted, I will:","When conflict occurs, I will:","I will show respect to coaches, staff, billets, teachers, volunteers, and support personnel by:"],"w":["My teammates should be able to trust me to:",2,"I will contribute to the team environment by:",2,"When I am personally disappointed, I will avoid:",2,"When another player succeeds in a role I wanted, I will:",2,"When conflict occurs, I will:",2,"I will show respect to coaches, staff, billets, teachers, volunteers, and support personnel by:",2]},{"h":"My Standard Away From The Rink","p":["Sleep — My standard for protecting sleep is:","Nutrition and Hydration — My standard for fueling and hydration is:","School and Responsibilities — My standard for school, appointments, and responsibilities is:","Billet or Home Life — My standard for communication, cleanliness, respect, and shared responsibilities is:","Social Media and Public Conduct — My standard for what I post, share, respond to, and represent publicly is:","Health and Injury Communication — My standard for reporting pain, illness, concussion symptoms, fatigue, or other concerns is:"],"w":["Sleep — My standard for protecting sleep is:",2,"Nutrition and Hydration — My standard for fueling and hydration is:",2,"School and Responsibilities — My standard for school, appointments, and responsibilities is:",2,"Billet or Home Life — My standard for communication, cleanliness, respect, and shared responsibilities is:",2,"Social Media and Public Conduct — My standard for what I post, share, respond to, and represent publicly is:",2,"Health and Injury Communication — My standard for reporting pain, illness, concussion symptoms, fatigue, or other concerns is:",2]},{"h":"My Response Standard","p":["After a Mistake — My immediate physical response will be:","My mental reset cue will be:","My next useful action will be:","After Difficult Feedback — I will listen by:","I will make sure I understand by:","I will apply the feedback by:","I will follow up by:","After a Poor Game — Before judging the performance, I will:","I will identify:","I will avoid:","My next development action will be:","After Reduced Ice Time or a Smaller Role — I will control:","I will ask:","I will demonstrate:","I will continue preparing by:"],"w":["After a Mistake — My immediate physical response will be:",2,"My mental reset cue will be:",2,"My next useful action will be:",2,"After Difficult Feedback — I will listen by:",2,"I will make sure I understand by:",2,"I will apply the feedback by:",2,"I will follow up by:",2,"After a Poor Game — Before judging the performance, I will:",2,"I will identify:",2,"I will avoid:",2,"My next development action will be:",2,"After Reduced Ice Time or a Smaller Role — I will control:",2,"I will ask:",2,"I will demonstrate:",2,"I will continue preparing by:",2]},{"h":"My Non-Negotiable Standards","p":["Choose five to eight behaviors that should remain recognizable regardless of results, role, confidence, travel, fatigue, or outside pressure.","1.","My standard:","What it looks like in action:","2.","My standard:","What it looks like in action:","3.","My standard:","What it looks like in action:","4.","My standard:","What it looks like in action:","5.","My standard:","What it looks like in action:","6.","My standard:","What it looks like in action:","7.","My standard:","What it looks like in action:","8.","My standard:","What it looks like in action:"],"w":["Choose five to eight behaviors that should remain recognizable regardless of results, role, confidence, travel, fatigue, or outside pressure.","1.","My standard:",1,"What it looks like in action:",1,"2.","My standard:",1,"What it looks like in action:",1,"3.","My standard:",1,"What it looks like in action:",1,"4.","My standard:",1,"What it looks like in action:",1,"5.","My standard:",1,"What it looks like in action:",1,"6.","My standard:",1,"What it looks like in action:",1,"7.","My standard:",1,"What it looks like in action:",1,"8.","My standard:",1,"What it looks like in action:",1]},{"h":"My Minimum Standard","p":["On a difficult day, when my energy, confidence, or circumstances are not ideal, I will still:","I will communicate with the appropriate staff member when:","I will not use toughness as a reason to hide:"],"w":["On a difficult day, when my energy, confidence, or circumstances are not ideal, I will still:","1. ___","2. ___","3. ___","4. ___","5. ___","I will communicate with the appropriate staff member when:",2,"I will not use toughness as a reason to hide:",2]},{"h":"Standard Correction Plan","p":["When I recognize that I have failed to meet my standard:","I will acknowledge:","I will take responsibility for:","I may need to repair the situation by:","The trigger or condition I need to understand is:","The next action I will take is:","The lesson I will carry forward is:"],"w":["When I recognize that I have failed to meet my standard:","I will acknowledge:",2,"I will take responsibility for:",2,"I may need to repair the situation by:",2,"The trigger or condition I need to understand is:",2,"The next action I will take is:",2,"The lesson I will carry forward is:",2]},{"h":"My Personal Standard Statement","p":["Use the work from this chapter to create a short statement describing how you intend to operate.","It should address preparation, competition, response to adversity, treatment of others, and responsibility away from the rink.","Working Draft","My standard is to:","Final Personal Standard"],"w":["Use the work from this chapter to create a short statement describing how you intend to operate.","It should address preparation, competition, response to adversity, treatment of others, and responsibility away from the rink.","Working Draft","My standard is to:",5,"Final Personal Standard",5]},{"h":"Daily Standard Check","p":["At the end of the day, answer each question honestly.","Preparation: Did I prepare with purpose?   ☐ Yes   ☐ Partially   ☐ No","Effort: Did I give the best effort available to me today?   ☐ Yes   ☐ Partially   ☐ No","Coachability: Did I listen and respond constructively to feedback?   ☐ Yes   ☐ Partially   ☐ No","Team: Did my behavior help the people around me?   ☐ Yes   ☐ Partially   ☐ No","Responsibility: Did I handle my commitments away from the rink?   ☐ Yes   ☐ Partially   ☐ No","Recovery: Did I support tomorrow’s performance through my choices today?   ☐ Yes   ☐ Partially   ☐ No","Response: Did I recover effectively from mistakes, frustration, or adversity?   ☐ Yes   ☐ Partially   ☐ No","The standard I demonstrated best today was:","The standard that requires attention tomorrow is:","The action I will take is:"],"w":["At the end of the day, answer each question honestly.","Preparation: Did I prepare with purpose?   ☐ Yes   ☐ Partially   ☐ No","Effort: Did I give the best effort available to me today?   ☐ Yes   ☐ Partially   ☐ No","Coachability: Did I listen and respond constructively to feedback?   ☐ Yes   ☐ Partially   ☐ No","Team: Did my behavior help the people around me?   ☐ Yes   ☐ Partially   ☐ No","Responsibility: Did I handle my commitments away from the rink?   ☐ Yes   ☐ Partially   ☐ No","Recovery: Did I support tomorrow’s performance through my choices today?   ☐ Yes   ☐ Partially   ☐ No","Response: Did I recover effectively from mistakes, frustration, or adversity?   ☐ Yes   ☐ Partially   ☐ No","The standard I demonstrated best today was:",1,"The standard that requires attention tomorrow is:",1,"The action I will take is:",1]},{"h":"Chapter Commitment","p":["I understand that goals describe what I hope to accomplish, while standards determine how I operate each day.","I will not allow results, statistics, praise, criticism, role, or temporary emotion to determine the quality of my preparation and conduct.","I will establish standards that are demanding, observable, realistic, and repeatable.","I will maintain my responsibility to the team even when my personal circumstances are difficult.","I will listen to feedback, communicate honestly, and respond constructively after mistakes.","I will not expect perfection from myself, but I will take responsibility when my behavior falls below the standard I have chosen.","I will work to become someone whose preparation, effort, character, and conduct can be trusted."]}]},{"n":"FOUR","title":"Long Term Vision","blocks":[{"h":"","p":["A hockey career develops one day at a time, but daily work becomes more meaningful when it is connected to a larger direction.","The purpose of a long-term vision is not to predict exactly what will happen.","No player can know with certainty which team he will play for several years from now, what role he will hold, how his body will develop, which coaches will influence him, or what opportunities and setbacks will appear.","A long-term vision creates direction without pretending that the future is guaranteed.","It helps you understand what you are working toward, why the work matters, and which qualities must be developed before the next opportunity arrives.","A useful vision should challenge you.","It should also remain flexible enough to change as you learn more about yourself, the game, and the demands of higher levels.","The goal is not to create pressure by deciding that only one future outcome will count as success.","The goal is to build a clear picture of the player and person you intend to become, then use that picture to guide the choices available today."]},{"h":"Direction Without Prediction","p":["Athletes are often asked where they expect to be in one year, three years, or five years.","These questions can be useful, but they can also create the false impression that a career should unfold according to a fixed schedule.","Development rarely follows a straight line.","One player may receive an early opportunity and then struggle. Another may require more time before his abilities become visible. A player may grow physically, change positions, discover a new role, suffer an injury, respond to a different coach, or develop a skill that changes the direction of his career.","Your vision should identify the direction of travel.","It should not become a deadline that causes you to judge every season as ahead or behind.","Instead of saying:","If I have not reached a certain level by a certain age, I have failed.","A stronger vision says:","I am committed to becoming capable of succeeding at the highest level available to me, and I will continue evaluating the next step honestly.","This creates ambition without requiring certainty."]},{"h":"The Vision Must Include More Than A League","p":["A league, team, draft, contract, or roster position may be part of your vision.","Those outcomes matter.","They are not enough by themselves.","A useful long-term vision should describe what kind of player would be capable of earning and sustaining those opportunities.","If your vision is only to play professional hockey, it does not tell you how that future player skates, thinks, competes, prepares, communicates, or handles adversity.","A more complete vision may describe a player who:","can create and finish offense against strong defenders;","is trusted in important defensive situations;","processes the game quickly;","plays with pace and physical strength;","remains effective under pressure;","prepares and recovers consistently;","can perform in different roles;","improves the players around him;","communicates professionally;","responds well to coaching;","remains healthy and available;","represents his team with maturity.","The opportunity is the result.","The player capable of sustaining the opportunity is the real development project."]},{"h":"Build The Player Before Chasing The Result","p":["It is natural to think about points, rankings, drafts, contracts, and advancement.","These outcomes provide motivation and can help define ambition.","They can also distract from the development required to earn them.","A player may begin asking:","Am I being noticed?","Where am I ranked?","Why is another player receiving more attention?","What do scouts think?","How quickly will I move up?","What happens if I do not produce immediately?","These questions are understandable, but most of them do not create useful action.","A stronger question is:","What would I need to become capable of doing consistently for the next level to trust me?","That question returns attention to development.","The answer may involve skating, strength, decision-making, defensive responsibility, puck skill, emotional control, preparation, communication, or health.","Recognition often arrives after the evidence has been built.","The player’s responsibility is to build the evidence."]},{"h":"The One-Year Vision","p":["The one-year vision should be specific enough to guide the current season.","It may include the role you hope to earn, the habits you want to establish, the physical qualities you need to improve, and the skills you want to make more dependable.","Because one year is relatively close, this vision should be grounded in your current situation.","Ask:","What will the next level of responsibility require?","Which part of my game most needs to improve this season?","What role would represent meaningful progress?","What habits must become consistent?","What physical development is realistic and appropriate?","What would coaches need to trust me to do?","What kind of teammate do I want to be known as by the end of the year?","What evidence would show that the season was productive even if every outcome did not go as planned?","A strong one-year vision should describe progress you can influence.","It may include statistical goals, but it should not depend entirely upon them.","Over the next year, I intend to become a dependable WHL forward who can play with pace, contribute in different situations, manage the puck under pressure, and earn greater responsibility through consistent preparation and two-way play.","That vision provides direction for training, practice, video review, and feedback."]},{"h":"The Three-Year Vision","p":["The three-year vision allows you to think beyond the immediate season.","By that point, your body, skill set, experience, and role may be significantly different.","The purpose is not to identify an exact team or contract.","The purpose is to imagine what a more developed version of your game could look like.","Consider:","What level of competition do I want to be prepared for?","What qualities must become advanced rather than merely adequate?","What role do I want to be capable of handling?","What kind of physical maturity will the game require?","What weaknesses could limit advancement if they remain unchanged?","What leadership responsibilities might I be ready to accept?","What professional habits must become automatic?","What would make me difficult to replace?","What qualities would separate me from players with similar talent?","A three-year vision should encourage you to think about complete development.","A player who hopes to advance cannot rely indefinitely on one dominant strength.","Higher levels expose incomplete games.","Speed matters, but speed without decisions may become ineffective.","Skill matters, but skill without pace or pressure tolerance may disappear.","Physical strength matters, but strength without positioning or discipline may create little value.","Offense matters, but offensive ability without trust away from the puck may limit opportunity.","The three-year vision should describe how your qualities will work together."]},{"h":"The Five-Year Vision","p":["The five-year vision should be ambitious but open.","At this distance, too many variables exist to create a reliable prediction.","The value lies in considering the level of professionalism, maturity, and capability you hope to have developed.","Ask:","What kind of player do I want to be capable of becoming?","At what level do I hope to compete?","What qualities would allow me to remain at that level?","What kind of reputation do I want to have among coaches and teammates?","What type of life do I want to be building away from hockey?","How do I want to handle money, education, relationships, and responsibility?","What kind of example do I want to provide for younger players?","What opportunities would I like hockey to create, even beyond playing?","The five-year vision should not force you to choose between total success and failure.","It should create a meaningful destination while recognizing that the exact route may change."]},{"h":"Vision And Sacrifice","p":["Every serious goal requires tradeoffs.","Training takes time. Recovery requires discipline. Travel affects relationships and school. Competition may require moving away from home. Opportunities may come with uncertainty, pressure, and reduced control over your schedule.","A long-term vision should help you decide which sacrifices are meaningful and which are unnecessary.","Not every sacrifice improves performance.","Sleeping less to perform extra low-quality training is not necessarily commitment.","Ignoring injury symptoms to appear tough may reduce future opportunity.","Separating yourself from all friendships and interests does not guarantee success.","A useful question is:","Does this choice support the player and person I am trying to become?","Some sacrifices are temporary and purposeful.","Others can damage health, relationships, judgment, or enjoyment without providing meaningful development.","Your vision should help you distinguish discipline from self-destruction."]},{"h":"The Cost Of The Vision","p":["Ambition has a cost, but that cost should be understood rather than romanticized.","The cost may include:","repeated training;","physical discomfort;","missed social opportunities;","difficult travel;","uncertainty;","criticism;","competition for roles;","disappointing results;","long periods without recognition;","asking for help;","changing habits;","accepting feedback;","beginning again after setbacks.","The cost should not include:","hiding serious injuries;","ignoring concussion symptoms;","abusing substances;","tolerating dangerous behavior;","sacrificing education without a responsible plan;","destroying important relationships;","allowing hockey to determine your entire personal worth.","A sustainable vision challenges you while protecting the person who is pursuing it."]},{"h":"Keeping The Vision Personal","p":["Players are surrounded by expectations.","Coaches, parents, teammates, advisors, scouts, fans, and social media may all have opinions about what your career should become.","Some of those opinions will be helpful.","Others may create pressure, confusion, or comparison.","Your long-term vision should be informed by people you trust, but it must still belong to you.","Ask:","Do I genuinely want this?","What do I enjoy about the work itself?","Would I still pursue improvement if recognition arrived more slowly?","Which parts of the vision come from my own ambition?","Which parts come from fear of disappointing other people?","What would success mean to me beyond approval?","What kind of life do I hope hockey helps me build?","A vision borrowed entirely from someone else will be difficult to sustain when the work becomes hard."]},{"h":"Avoiding Comparison Timelines","p":["Comparison is difficult to avoid in competitive hockey.","You will see players who are bigger, faster, more highly ranked, more productive, or receiving opportunities you want.","Comparison can provide information.","It becomes harmful when another player’s timeline is treated as proof of your future.","Players develop at different rates.","Their bodies, roles, teams, opportunities, injuries, strengths, and support systems differ.","The useful question is not:","Why am I not where that player is?","The useful questions are:","What does that player currently do well?","Is there something I can learn from it?","What part of my own development requires attention?","Am I improving relative to my previous standard?","What evidence am I building?","Another player’s advancement does not remove your responsibility or your opportunity to develop.","Stay aware of the competition.","Do not surrender your direction to it."]},{"h":"Vision Must Become A Plan","p":["A vision without action becomes imagination.","Once you have described the future player, work backward.","Ask:","What must be true three years from now?","What must be developed within one year?","What should improve during the next ninety days?","What can I do this week?","What behavior is required today?","For example:","Long-term vision","Become a fast, strong, intelligent two-way forward capable of playing professional hockey.","Three-year requirement","Be trusted against top competition, contribute consistently, and perform on special teams.","One-year requirement","Improve skating power, decisions under pressure, and defensive reliability.","Ninety-day priority","Develop stronger first-step acceleration and improve scanning before receiving the puck.","Weekly action","Complete prescribed skating work, review selected video clips, and track scanning habits during practice.","Daily action","Enter practice with one skating cue and one awareness cue.","This process connects ambition to behavior.","The vision becomes useful when it changes what you do."]},{"h":"Reviewing The Vision","p":["Your long-term vision should be reviewed, not rewritten impulsively.","One poor game should not cause you to abandon it.","One strong game should not cause you to assume it has already been achieved.","Review it at meaningful intervals:","before the season;","after the first quarter;","at midseason;","after the regular season;","after playoffs;","before offseason planning;","when a major role or health change occurs.","During each review, ask:","Does this vision still matter to me?","What has changed?","What have I learned about my game?","Which qualities are developing?","Which assumptions were inaccurate?","What new opportunity or limitation has appeared?","Does the direction need adjustment?","What is the next development priority?","A vision should evolve through evidence, not emotion alone."]},{"h":"Success Within The Vision","p":["The highest outcome may remain uncertain.","Progress does not have to be.","A season can be successful even when every desired result is not achieved.","You may become more dependable, physically prepared, skilled, resilient, self-aware, or coachable. You may learn to manage travel, pressure, nutrition, recovery, or adversity. You may discover a role that fits your game differently than expected.","These forms of development matter.","They increase future capability and remain valuable beyond hockey.","A long-term vision should motivate serious ambition while allowing you to recognize meaningful growth along the way."]},{"h":"The Person Inside The Vision","p":["You are building more than a hockey player.","You are learning how to work, respond, communicate, lead, recover, and take responsibility.","These qualities will matter regardless of how long you play.","A complete vision should include the person you hope to become:","dependable;","honest;","resilient;","thoughtful;","disciplined;","curious;","respectful;","responsible;","capable of asking for help;","able to support others;","prepared to handle opportunity with maturity.","Hockey may provide the environment in which these qualities are tested.","The qualities belong to you."]},{"h":"Hold The Vision, Work The Day","p":["Long-term ambition can create energy.","It can also become overwhelming if you attempt to live several years in the future.","You do not need to solve your entire career today.","You need to understand the direction and perform the next useful action.","Hold the vision.","Work the day.","Prepare for the current practice. Complete the current recovery session. Learn from the current game. Ask the current question. Improve the current habit.","The future player will be built through the quality of those actions."]},{"h":"Long-Term Vision Assessment","p":["What Do I Want from Hockey?","Why do I want to continue pursuing hockey at a high level?","What experiences do I hope hockey provides?","What opportunities do I hope to earn?","What would make the pursuit meaningful even if the exact future changes?","My Highest-Level Ambition","At the highest level, what do I hope to accomplish as a player?","Why does this matter to me?","Which parts of this ambition are within my control?","Which parts are outside my control?","The Player Capable of Reaching That Level","Skating","Puck Skills","Hockey Sense and Decision-Making","Offensive Play","Defensive Play","Physical Preparation","Mental Performance","Preparation and Recovery","Character and Professional Conduct","My One-Year Vision","One year from now, I want to be a player who:","The role I hope to be capable of earning is:","The three most important improvements I need to make are:","The habits that must become consistent are:","The evidence that would show meaningful progress is:","My Three-Year Vision","Three years from now, I want to be capable of:","The level or type of opportunity I hope to be prepared for is:","The role I want coaches to be able to trust me with is:","My game will need to become stronger in:","My greatest current limitation, if left unchanged, could be:","The qualities that could separate me from other players are:","My Five-Year Vision","Five years from now, I hope hockey has helped me become:","The level at which I hope to compete is:","The reputation I want to have among coaches and teammates is:","Away from hockey, I hope to be building:","I want to be prepared to handle responsibility involving:","The person I hope to be at that stage is:"],"w":["Wha
