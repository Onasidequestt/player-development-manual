s it significantly affect my current role?","Does it affect several areas of performance?","Has it been identified through more than one source of evidence?","Can it be trained safely during the current phase?","Is there a clear way to measure progress?","Who should guide the work?","Priority decision"],"w":["Use this filter before selecting a major development priority.","Potential priority",2,"Does it significantly affect my current role?",2,"Does it affect several areas of performance?",2,"Has it been identified through more than one source of evidence?",2,"Can it be trained safely during the current phase?",2,"Is there a clear way to measure progress?",2,"Who should guide the work?",2,"Priority decision",2]},{"h":"My Next Ninety-Day Priorities","p":["Priority One — Hockey Skill","Priority:","Why it matters:","Current evidence:","Action:","Person guiding the work:","Progress measure:","Priority Two — Tactical or Decision-Making","Priority:","Why it matters:","Current evidence:","Action:","Person guiding the work:","Progress measure:","Priority Three — Physical Development","Priority:","Why it matters:","Current evidence:","Action:","Person guiding the work:","Progress measure:","Priority Four — Recovery or Lifestyle","Priority:","Why it matters:","Current evidence:","Action:","Person guiding the work:","Progress measure:","Priority Five — Personal or Team Habit","Priority:","Why it matters:","Current evidence:","Action:","Person guiding the work:","Progress measure:"],"w":["Priority One — Hockey Skill","Priority:",1,"Why it matters:",2,"Current evidence:",2,"Action:",2,"Person guiding the work:",1,"Progress measure:",2,"Priority Two — Tactical or Decision-Making","Priority:",1,"Why it matters:",2,"Current evidence:",2,"Action:",2,"Person guiding the work:",1,"Progress measure:",2,"Priority Three — Physical Development","Priority:",1,"Why it matters:",2,"Current evidence:",2,"Action:",2,"Person guiding the work:",1,"Progress measure:",2,"Priority Four — Recovery or Lifestyle","Priority:",1,"Why it matters:",2,"Current evidence:",2,"Action:",2,"Person guiding the work:",1,"Progress measure:",2,"Priority Five — Personal or Team Habit","Priority:",1,"Why it matters:",2,"Current evidence:",2,"Action:",2,"Person guiding the work:",1,"Progress measure:",2]},{"h":"Baseline Action Plan","p":["The first action I will take","The conversation I need to have","The question I need answered","The habit I will begin tracking","The area requiring professional support","The strength I will continue protecting","My next formal review date"],"w":["The first action I will take",2,"The conversation I need to have",2,"The question I need answered",2,"The habit I will begin tracking",2,"The area requiring professional support",2,"The strength I will continue protecting",2,"My next formal review date",2]},{"h":"Baseline Review Agreement","p":["The information I will share","The questions I will ask","The changes made after feedback"],"w":["☐ Head coach","☐ Assistant coach","☐ Strength and conditioning staff","☐ Athletic trainer","☐ Nutrition professional","☐ Mental-performance professional","☐ Family member","☐ Mentor","☐ Other","The information I will share",3,"The questions I will ask",3,"The changes made after feedback",3]},{"h":"Chapter Commitment","p":["I understand that this baseline assessment describes my current stage of development, not my permanent ability or future potential.","I will assess the player I am today rather than the player I hope to become or the player I was at a previous level.","I will recognize strengths honestly and identify limitations without turning them into personal judgments.","I will use multiple sources of evidence, including feedback, video, performance, habits, and appropriate testing.","I will rate qualities according to their consistency under the conditions of the game.","I will not chase perfect scores or attempt to improve every area at once.","I will protect the strengths that currently create value while addressing the limitations that most restrict my development.","I will communicate relevant health, training, and performance information to the appropriate members of my development team.","I will use this assessment to establish clear priorities and return later to measure progress honestly."]}]},{"n":"SEVEN","title":"Season Goals","blocks":[{"h":"Goals Create Direction","p":["A season can feel long when viewed from the beginning and surprisingly short when viewed from the end. Games accumulate quickly. Practices blend together. Travel, school, recovery, injuries, lineup changes, strong performances, poor performances, and ordinary days all compete for attention.","Without clear goals, a player may work hard while still moving without direction. Season goals create focus. They identify what the player hopes to accomplish, what he needs to improve, which habits must become consistent, and how progress will be recognized.","A useful goal system does more than list desired outcomes. It connects ambition to behavior. The purpose of this chapter is to create a complete season-goal structure that includes performance, development, habits, team contribution, health, education, and personal growth."]},{"h":"Goals Should Guide, Not Define","p":["Goals are intended to guide attention. They should not become constant tests of personal worth.","A player may begin the season with a goal of earning a certain role, producing a particular number of points, playing special teams, or being selected for an opportunity. Those goals can be motivating, but many outcomes depend upon factors beyond the player’s control.","A coach determines usage. Teammates influence production. Injuries affect availability. Roster changes alter opportunities. Opponents, officials, schedules, and circumstances affect results.","A strong goal system separates what the player hopes to achieve from what he can directly control. The player can control preparation, effort, communication, practice habits, recovery, learning, and response to feedback. He cannot guarantee a lineup decision, statistical result, or selection."]},{"h":"The Six Types Of Season Goals","p":["Outcome goals describe results you hope to achieve, such as earning a regular lineup position, reaching a statistical target, receiving special-teams responsibility, or helping the team win.","Performance goals describe the level at which you want to perform, such as creating more quality scoring chances, reducing avoidable turnovers, improving puck recoveries, or executing defensive assignments more consistently.","Development goals identify qualities that need to improve, such as acceleration, puck protection, decisions under pressure, positioning, scanning, shot release, physical capacity, or emotional control.","Habit goals identify repeatable actions, such as completing recovery, protecting sleep, fueling before practice, reviewing video, arriving prepared, and communicating soreness.","Team goals describe how you intend to contribute to the group. Personal and academic goals protect development away from hockey and support the person as well as the player."]},{"h":"Begin With The Season Purpose","p":["Before writing individual goals, identify what the season is primarily about. For a player entering the WHL, the season may be about adaptation to greater speed, stronger players, longer travel, more games, unfamiliar systems, reduced time and space, a different role, living away from home, and increased physical and emotional demands.","A useful season purpose might be: Establish myself as a dependable WHL player by learning the league, building professional habits, and improving the parts of my game required to earn greater responsibility.","A clear season purpose helps evaluate decisions. When several goals compete for attention, the player can ask which one most supports the season’s primary purpose."]},{"h":"Start With The Baseline","p":["Goals should come from evidence. The baseline assessment identifies current strengths, limitations, habits, and role requirements.","The most useful goals emerge from the gap between what the player currently does, what his role requires, and what the next level will demand.","For example, if the baseline shows useful top speed but limited first-step acceleration, the development goal may be to improve first-step explosiveness, the performance goal may be to create more separation during races and transitions, and the habit goal may be to complete prescribed acceleration work with full intent and track the relevant cues."]},{"h":"Limit The Number Of Primary Goals","p":["A player may want to improve everything. That is understandable and impractical. When every area is treated as a priority, none receives enough attention.","A useful structure is one primary role or outcome goal, two or three major performance goals, three development priorities, three to five habit goals, one team goal, and one personal or academic goal.","Some goals may remain active throughout the season. Others should be addressed in shorter development blocks."]},{"h":"Write Goals Clearly","p":["A useful goal should explain exactly what you are trying to accomplish, why it matters, what evidence supports it, what part is within your control, how progress will be measured, what actions support it, who will help, and when it will be reviewed.","A vague goal says: Improve defensively.","A clearer goal says: Become more dependable in the defensive zone by improving scanning, positioning below the puck, wall responsibility, and communication.","The clearer the goal becomes, the easier it is to act upon."]},{"h":"Challenging And Believable","p":["A goal should require growth without becoming so unrealistic that the player stops taking it seriously. Use minimum, target, and stretch levels where appropriate.","The minimum is the lowest result that would still represent meaningful progress. The target is the realistic result being actively pursued. The stretch is a demanding result that may become possible if development and opportunity progress especially well.","This structure allows ambition without turning one number into a pass-or-fail judgment."]},{"h":"Measure What Matters","p":["A measure should help the player understand progress. Useful measures may include coach evaluation, video evidence, physical testing, practice execution, habit completion, role changes, game statistics, health and availability, and repeated performance under pressure.","The measure should match the goal. A defensive-positioning goal should not be judged only by plus-minus. A puck-protection goal should not be judged only by points. A recovery goal should not be judged only by motivation."]},{"h":"Leading And Lagging Indicators","p":["A lagging indicator shows the final result, such as goals, assists, games played, minutes, wins, selections, or physical-test results.","A leading indicator shows whether the player is performing the actions likely to create that result, such as quality repetitions, video review, sleep consistency, recovery completion, scanning frequency, communication, route execution, and coachable responses.","Lagging indicators tell you what happened. Leading indicators help explain why. A useful goal system tracks both."]},{"h":"Connect Goals To Daily Action","p":["A season goal should eventually become a weekly and daily behavior.","A season goal of improving decisions under pressure might become a monthly focus on scanning earlier, a weekly action of reviewing pressure situations, a practice cue to scan before receiving the puck, a game cue to know the next play before possession arrives, and a review question asking whether pressure was recognized early enough.","The goal becomes useful when it changes attention during the day."]},{"h":"Statistical And Role Goals","p":["Statistics are part of competitive hockey, and it is reasonable to set production goals. Support those goals with process goals so the player does not force plays or allow points to control every decision.","Role goals may involve earning regular lineup status, moving into a larger role, receiving special-teams responsibility, playing against stronger competition, or becoming trusted late in games.","The player should focus on becoming capable of the role rather than demanding the role itself. Ask what the role requires, what coaches currently trust, what limits the opportunity, what behavior demonstrates readiness, and how progress will be reviewed."]},{"h":"Team, Health, Academic, And Personal Goals","p":["Individual goals should support the team. A personal scoring goal should not encourage low-percentage decisions that damage team play, and a desire for more ice time should not reduce support for teammates.","Health goals should focus on reporting symptoms, following treatment, protecting sleep, fueling, managing workload, completing rehabilitation, and avoiding unnecessary risk. The objective is not to appear indestructible but to build a body and communication system that support long-term performance.","Academic and personal-development goals should address schoolwork, organization, communication with billets, money management, independence, relationships, social-media discipline, and identity outside hockey."]},{"h":"Review And Adjust","p":["A season plan should be reviewed at scheduled intervals rather than rewritten after every difficult game. Useful review points include after training camp, after the first ten games, monthly, at quarter season, at midseason, after major role changes, and after the regular season.","Changing a goal based upon evidence is not failure. A goal may need adjustment because the baseline was inaccurate, the role changed, an injury occurred, team needs changed, a new limiting factor appeared, or the measurement was poor.","During review, ask what progress is visible, what actions have been completed, what has not improved, whether the measure remains useful, what support is needed, and what the next action should be."]},{"h":"The Development Scoreboard","p":["The most visible scoreboard records goals, assists, wins, losses, and standings. The development scoreboard asks whether the player is becoming more capable, whether strengths are becoming more dependable, whether weaknesses are becoming less limiting, whether habits are becoming more professional, whether trust is increasing, whether health and self-awareness are improving, and whether the player is helping the team.","A successful season should include evidence on both scoreboards."]},{"h":"Season Goal Foundation","p":["My Season Purpose","Why This Matters","At the End of the Season, I Want to Be Able to Say"],"w":["Season: ___","Team: ___","Primary position: ___","Date completed: ___","Planned review dates: ___","My Season Purpose",4,"Why This Matters",3,"At the End of the Season, I Want to Be Able to Say",4]},{"h":"Baseline Connection","p":["My Three Strongest Current Qualities","My Three Most Important Current Limitations","My Primary Limiting Factor","The Current Role I Am Preparing to Perform","What the Next Level of Responsibility Requires"],"w":["My Three Strongest Current Qualities",4,"My Three Most Important Current Limitations",4,"My Primary Limiting Factor",3,"The Current Role I Am Preparing to Perform",3,"What the Next Level of Responsibility Requires",3]},{"h":"Season Goal Dashboard","p":["Goal 1","Goal 2","Goal 3","Goal 4","Goal 5"],"w":["Goal 1","Goal: ___",1,"☐ On track","☐ Progressing slowly","☐ Stalled","☐ Needs revision","Evidence: ___",1,"Next action: ___",1,"Goal 2","Goal: ___",1,"☐ On track","☐ Progressing slowly","☐ Stalled","☐ Needs revision","Evidence: ___",1,"Next action: ___",1,"Goal 3","Goal: ___",1,"☐ On track","☐ Progressing slowly","☐ Stalled","☐ Needs revision","Evidence: ___",1,"Next action: ___",1,"Goal 4","Goal: ___",1,"☐ On track","☐ Progressing slowly","☐ Stalled","☐ Needs revision","Evidence: ___",1,"Next action: ___",1,"Goal 5","Goal: ___",1,"☐ On track","☐ Progressing slowly","☐ Stalled","☐ Needs revision","Evidence: ___",1,"Next action: ___",1]},{"h":"Monthly Goal Review","p":["The goal showing the most progress","Evidence","The goal showing the least progress","Evidence","The habit I followed most consistently","The habit that broke down and why","What changed in my role or circumstances","Does any goal need revision?","The most important goal for next month","The first action I will take"],"w":["Month: ___","The goal showing the most progress",3,"Evidence",3,"The goal showing the least progress",3,"Evidence",3,"The habit I followed most consistently",3,"The habit that broke down and why",3,"What changed in my role or circumstances",3,"Does any goal need revision?",3,"The most important goal for next month",3,"The first action I will take",3]},{"h":"Midseason Goal Review","p":["Outcome progress","Performance progress","Development progress","Habit consistency","Team contribution","Health and availability","Academic and personal development","The goal that remains most important","The goal that no longer fits","The new priority that has emerged","Feedback from coaches or staff","Revised second-half plan"],"w":["Date: ___","Outcome progress",3,"Performance progress",3,"Development progress",3,"Habit consistency",3,"Team contribution",3,"Health and availability",3,"Academic and personal development",3,"The goal that remains most important",3,"The goal that no longer fits",3,"The new priority that has emerged",3,"Feedback from coaches or staff",3,"Revised second-half plan",3]},{"h":"End-Of-Season Goal Review","p":["The most important development of the season","The most important habit built","The goal I did not achieve and why","What I will carry forward","The way I helped the team","The way I grew as a person","My next development direction"],"w":["The most important development of the season",3,"The most important habit built",3,"The goal I did not achieve and why",3,"What I will carry forward",3,"The way I helped the team",3,"The way I grew as a person",3,"My next development direction",3]},{"h":"My Season Goal Statement","p":["During this season, I am committed to","I will measure progress through","I will focus my daily attention on","When results are uncertain, I will return to","When a goal needs to change, I will"],"w":["During this season, I am committed to",3,"I will measure progress through",3,"I will focus my daily attention on",3,"When results are uncertain, I will return to",3,"When a goal needs to change, I will",3]},{"h":"Chapter Commitment","p":["I understand that goals create direction but do not determine my personal worth.","I will separate desired outcomes from the actions and behaviors I can control.","I will build my goals from honest baseline evidence, role requirements, coach feedback, and long-term development needs.","I will pursue meaningful performance and statistical results without allowing them to replace strong decisions, team responsibility, and professional habits.","I will limit my primary goals so that my attention and work remain focused.","I will connect season goals to monthly priorities, weekly actions, practice cues, game behaviors, and recovery habits.","I will review goals at planned intervals rather than reacting impulsively to individual games.","I will revise goals when evidence shows that they are unrealistic, unhealthy, poorly measured, or no longer relevant.","I will evaluate the season through both the competitive scoreboard and the development scoreboard.","I will take responsibility for the work, learn honestly from the result, and continue moving forward."]}]},{"n":"NINE","title":"The 90-Day Development Plan","blocks":[{"h":"Why Ninety Days?","p":["A season establishes the larger direction. A 90-day development plan identifies what deserves concentrated attention now.","Ninety days is long enough for meaningful improvement to occur, but short enough to create urgency, maintain focus, and adjust when circumstances change. It allows a player to work toward the long-term vision without attempting to solve his entire career at once.","A strong 90-day plan does not attempt to improve every part of the player’s game equally. It identifies a small number of priorities that can create the greatest benefit during the current stage of development: one hockey skill, one tactical or decision-making quality, one physical-development area, one recovery or lifestyle habit, and one personal or team responsibility.","The structure is simple: assess honestly, choose deliberately, plan specifically, act consistently, review the evidence, and adjust."]},{"h":"A Development Block Is Not A Guarantee","p":["Ninety days of focused work does not guarantee mastery. Some skills develop quickly. Others require several seasons. Physical development may be influenced by age, growth, training history, recovery, health, and the competitive schedule. Tactical learning may improve in practice before it becomes reliable in games.","The purpose of the development block is not to promise a finished result. It is to create evidence of movement and clarity about what is working."]},{"h":"Selecting The Right Priorities","p":["The most important step is choosing what deserves attention. A priority should come from evidence: the baseline assessment, coach feedback, role requirements, video patterns, physical testing, practice performance, recurring game situations, recovery trends, health and availability, and the long-term vision.","Ask which limitation affects the greatest number of situations, which improvement would create the largest benefit, what prevents an existing strength from being used, what coaches repeatedly identify, what the current role requires, what can be trained safely, and how progress can be measured."]},{"h":"Do Not Choose Too Many Priorities","p":["Focus is limited. When every area is treated as a priority, none receives enough attention. The plan should normally contain no more than five primary areas: hockey skill, tactical or decision-making, physical development, recovery or lifestyle, and personal or team contribution.","One or two priorities may deserve greater emphasis than the others. The plan should answer: If only a few areas improve meaningfully during the next ninety days, which improvements would matter most?"]},{"h":"Primary And Supporting Priorities","p":["A primary priority is the most important development need during the current block. Supporting priorities receive attention without competing with the primary work. This protects existing strengths while directing the greatest energy toward the most important limitation."]},{"h":"The Hockey-Skill Priority","p":["The hockey-skill priority should identify a technical quality that can be practiced deliberately and described in game language. “Improve my hands” is vague. “Improve puck control and protection when receiving the puck along the wall under immediate pressure” identifies the skill, situation, pressure, and desired outcome."]},{"h":"Skill Development Requires Progression","p":["Skill development usually moves through technical understanding, controlled repetition, speed, decision-making, pressure, and game transfer. A player may look excellent during controlled repetition and still struggle to access the skill in games. That identifies the next stage of progression rather than proving that practice failed."]},{"h":"The Tactical Or Decision-Making Priority","p":["Technical skill determines what a player can execute. Tactical understanding determines when, where, and why he uses it. A tactical goal should identify the information the player needs to recognize and the action that should follow.","For example: Before receiving the puck in the defensive zone, identify pressure and at least one available outlet so the first decision can be made without stopping the play."]},{"h":"Use Video To Support Tactical Development","p":["Video review should include successful examples, unsuccessful examples, examples from teammates, and examples from strong players in similar roles. The player should identify what information was available, what decision was made, what alternative existed, and what needed to be noticed earlier. The lesson should become a simple practice or game cue."]},{"h":"The Physical-Development Priority","p":["The physical priority must be established with qualified strength and conditioning staff. It may involve strength, power, acceleration, speed, conditioning, mobility, balance, stability, body control, recovery capacity, or movement quality.","The player should understand why the quality matters, how it affects hockey, what work addresses it, what technique is required, how progress will be measured, and what symptoms must be reported. More work is not automatically better work."]},{"h":"In-Season Physical Development","p":["In-season work must balance development with games, travel, practices, school, recovery, injuries, changing ice time, and accumulated fatigue. Some periods allow development; others require maintenance and recovery. Performance staff should determine the emphasis."]},{"h":"The Recovery Or Lifestyle Priority","p":["A recovery or lifestyle priority can benefit every other area. It should be practical and account for travel, late games, school, and schedule changes. A habit that only works under perfect conditions is not yet dependable."]},{"h":"The Personal Or Team Priority","p":["This priority describes visible behavior around other people: communication, body language, bench engagement, response to reduced ice time, billet responsibilities, academic organization, support for teammates, frustration management, or reliability."]},{"h":"Define The Current Baseline","p":["Every priority should include a starting description explaining what currently happens, how often it occurs, where it appears, under which conditions it breaks down, and what evidence supports the conclusion."]},{"h":"Define What Improvement Looks Like","p":["Describe the behavior you want to produce, not merely the problem you want to eliminate. Improvement should be described through execution, consistency, game situations, coach trust, measurable performance, and behavior under pressure."]},{"h":"Identify The Training Actions","p":["Each priority should include specific actions: prescribed exercises, skill repetitions, video sessions, practice cues, coach conversations, recovery routines, nutrition preparation, sleep routines, tracking, and scheduled reviews. The plan should state what will be done, how often, when, with whom, at what quality, and how completion will be recorded."]},{"h":"Build A Weekly Rhythm","p":["The plan must fit the real hockey calendar. It should distinguish non-negotiable habits, flexible development work, staff-directed training, optional work, and work that should be removed when recovery is inadequate."]},{"h":"Use Practice And Game Cues","p":["A cue directs attention toward one useful detail. It should be short enough to remember during action. One or two practice cues are usually enough. Game cues should be even simpler: one preparation cue, one tactical cue, and one response cue."]},{"h":"Track Completion And Quality","p":["Checking a box shows that an action occurred. It does not show how well it was performed. Track both completion and quality, and where useful record difficulty, confidence, pain or restriction, transfer into practice, transfer into games, and staff feedback."]},{"h":"Build Checkpoints","p":["Do not wait until day ninety. Useful checkpoints include Day 14, Day 30, Day 45, Day 60, Day 75, and Day 90. Each checkpoint should ask whether the work is being completed, whether quality is sufficient, whether the priority remains relevant, whether workload is appropriate, whether progress is visible, and whether the plan needs support or adjustment."]},{"h":"Expect A Plateau","p":["Progress may be rapid at first and then slow. A plateau does not automatically mean the plan failed. Review whether the work is still being completed, whether difficulty is appropriate, whether technique is correct, whether fatigue interferes, whether the work transfers to realistic situations, and whether the measure is sensitive enough."]},{"h":"Adjustment Is Part Of The Plan","p":["A plan should be stable enough to create repetition and flexible enough to respond to evidence. Record the reason for adjustments so the plan does not change randomly according to mood."]},{"h":"Maintenance After Improvement","p":["When a priority improves, it may move from primary work to a supporting or maintenance habit. The objective is to retain progress while allowing attention to move toward the next development need."]},{"h":"Who Should Review The Plan?","p":["The plan should be reviewed with the appropriate people: coaches for role and tactics, performance staff for physical work, medical staff for injuries, nutrition professionals for fueling, and other qualified members of the development team for their areas of responsibility."]},{"h":"The Player Owns The Follow-Through","p":["The development team may help design the plan. The player must perform it. Ownership includes knowing the priorities, completing the assigned work, recording useful information, communicating honestly, asking for feedback, and acknowledging when actions were not completed."]},{"h":"Do Not Turn Development Into Constant Self-Judgment","p":["Development is uneven. Evaluate trends rather than attacking yourself after every imperfect repetition. Use language that identifies what improved, what remained inconsistent, what broke down under pressure, what helped, and what should happen next."]},{"h":"The End Of The Block","p":["At the end of ninety days, review each priority by comparing the starting baseline, completed actions, consistency, quality, evidence, staff feedback, practice transfer, game transfer, remaining limitations, and the next decision. The next decision may be to continue, maintain, replace, pause, or seek additional evaluation."]},{"h":"90-Day Development Plan Foundation","p":["Player:","Team:","Development block dates:","Primary coach or staff member reviewing the plan:","Purpose of this development block","Why this block matters","At the end of the block, I want to be more capable of"],"w":["Player:",1,"Team:",1,"Development block dates:",1,"Primary coach or staff member reviewing the plan:",1,"☐ Training camp","☐ Early season","☐ First quarter","☐ Midseason","☐ Second half","☐ Playoffs","☐ Offseason","☐ Return from injury","☐ Other","Purpose of this development block",3,"Why this block matters",3,"At the end of the block, I want to be more capable of",3]},{"h":"Evidence Used To Select Priorities","p":["The evidence that matters most:","The pattern that appears repeatedly:"],"w":["☐ Baseline assessment","☐ Head-coach feedback","☐ Assistant-coach feedback","☐ Video review","☐ Game performance","☐ Practice performance","☐ Physical testing","☐ Strength-coach feedback","☐ Athletic-trainer feedback","☐ Nutrition feedback","☐ Mental-performance feedback","☐ Current role requirements","☐ Long-term vision","☐ Other","The evidence that matters most:",2,"The pattern that appears repeatedly:",2]},{"h":"Priority Ranking","p":["Potential Priority 1","Importance: ☐ High   ☐ Medium   ☐ Low","Evidence strength: ☐ Strong   ☐ Moderate   ☐ Limited","Impact on current role: ☐ High   ☐ Medium   ☐ Low","Can it be trained safely now? ☐ Yes   ☐ No   ☐ Staff guidance required","Potential Priority 2","Importance: ☐ High   ☐ Medium   ☐ Low","Evidence strength: ☐ Strong   ☐ Moderate   ☐ Limited","Impact on current role: ☐ High   ☐ Medium   ☐ Low","Can it be trained safely now? ☐ Yes   ☐ No   ☐ Staff guidance required","Potential Priority 3","Importance: ☐ High   ☐ Medium   ☐ Low","Evidence strength: ☐ Strong   ☐ Moderate   ☐ Limited","Impact on current role: ☐ High   ☐ Medium   ☐ Low","Can it be trained safely now? ☐ Yes   ☐ No   ☐ Staff guidance require ythm","p":["Monday","Primary development action:","Recovery responsibility:","Tuesday","Primary development action:","Recovery responsibility:","Wednesday","Primary development action:","Recovery responsibility:","Thursday","Primary development action:","Recovery responsibility:","Friday","Primary development action:","Recovery responsibility:","Saturday","Primary development action:","Recovery responsibility:","Sunday","Primary development action:","Recovery responsibility:"],"w":["Monday","Primary development action:",1,"Recovery responsibility:",1,"Tuesday","Primary development action:",1,"Recovery responsibility:",1,"Wednesday","Primary development action:",1,"Recovery responsibility:",1,"Thursday","Primary development action:",1,"Recovery responsibility:",1,"Friday","Primary development action:",1,"Recovery responsibility:",1,"Saturday","Primary development action:",1,"Recovery responsibility:",1,"Sunday","Primary development action:",1,"Recovery responsibility:",1]},{"h":"Development Session Log","p":["Date:","Priority:","Objective:","Work completed:","What improved during the session:","What remained difficult:","Technical or tactical cue:","Next progression or adjustment:","Completion: ☐ Full   ☐ Partial   ☐ Modified   ☐ Not completed","Quality: 1   2   3   4   5","Difficulty: 1   2   3   4   5"],"w":["Date:",1,"Priority:",1,"Objective:",2,"Work completed:",2,"What improved during the session:",2,"What remained difficult:",2,"Technical or tactical cue:",2,"Next progression or adjustment:",2,"☐ Skill","☐ Tactical","☐ Strength","☐ Speed","☐ Conditioning","☐ Recovery","☐ Video","☐ Mental performance","☐ Other","Completion: ☐ Full   ☐ Partial   ☐ Modified   ☐ Not completed","Quality: 1   2   3   4   5","Difficulty: 1   2   3   4   5","Pain, restriction, or health concern: ☐ None   ☐ Yes - reported to: ___"]},{"h":"Weekly 90-Day Review","p":["Week and dates:","Work completed for the primary priority:","Quality of the work:","Evidence of progress:","Where the limitation still appeared:","Supporting priority that received enough attention:","Priority that was neglected and why:","Sleep trend:","Energy trend:","Soreness or health concerns:","Evidence of transfer into practice:","Evidence of transfer into games:","Primary cue for next week:","Most important action:","Adjustment needed:"],"w":["Week and dates:",2,"Work completed for the primary priority:",2,"Quality of the work:",2,"Evidence of progress:",2,"Where the limitation still appeared:",2,"Supporting priority that received enough attention:",2,"Priority that was neglected and why:",2,"Sleep trend:",2,"Energy trend:",2,"Soreness or health concerns:",2,"Evidence of transfer into practice:",2,"Evidence of transfer into games:",2,"Primary cue for next week:",2,"Most important action:",2,"Adjustment needed:",2]},{"h":"30-Day Checkpoint","p":["Date:","Actions completed consistently:","Actions that broke down:","Early evidence of improvement:","Areas showing no clear change:","Coach or staff feedback:","Workload and recovery assessment:","Adjustment for the next thirty days:"],"w":["Date:",1,"Actions completed consistently:",2,"Actions that broke down:",2,"Early evidence of improvement:",2,"Areas showing no clear change:",2,"Coach or staff feedback:",2,"Workload and recovery assessment:",2,"Adjustment for the next thirty days:",2]},{"h":"60-Day Checkpoint","p":["Date:","Strongest evidence of progress:","Has the primary priority begun transferring into games?:","What still breaks down under pressure?:","Which action has helped most?:","Which action has helped least?:","Does the priority remain correct?:","Final thirty-day emphasis:"],"w":["Date:",1,"Strongest evidence of progress:",2,"Has the primary priority begun transferring into games?:",2,"What still breaks down under pressure?:",2,"Which action has helped most?:",2,"Which action has helped least?:",2,"Does the priority remain correct?:",2,"Final thirty-day emphasis:",2]},{"h":"90-Day Final Review","p":["Date:","Starting baseline:","Actions completed:","Consistency:","Evidence of improvement:","Practice transfer:","Game transfer:","Coach or staff feedback:","Remaining limitation:","Supporting Priority One result:","Supporting Priority Two result:","Supporting Priority Three result:","Supporting Priority Four result:"],"w":["Date:",1,"Starting baseline:",2,"Actions completed:",2,"Consistency:",2,"Evidence of improvement:",2,"Practice transfer:",2,"Game transfer:",2,"Coach or staff feedback:",2,"Remaining limitation:",2,"Supporting Priority One result:",2,"Supporting Priority Two result:",2,"Supporting Priority Three result:",2,"Supporting Priority Four result:",2]},{"h":"Next Decision","p":["Reason:","The next priority:","Evidence supporting the next priority:"],"w":["☐ Continue as the primary priority","☐ Continue as a supporting priority","☐ Move to maintenance","☐ Replace with a new priority","☐ Seek additional professional evaluation","☐ Pause because of health, recovery, or workload","Reason:",2,"The next priority:",2,"Evidence supporting the next priority:",2]},{"h":"90-Day Development Summary","p":["The most important improvement:","The most dependable new habit:","The action that produced the greatest value:","The part of the plan that did not work:","What I learned about how I develop:","The person who helped me most and why:","The lesson I will carry into the next block:"],"w":["The most important improvement:",2,"The most dependable new habit:",2,"The action that produced the greatest value:",2,"The part of the plan that did not work:",2,"What I learned about how I develop:",2,"The person who helped me most and why:",2,"The lesson I will carry into the next block:",2]},{"h":"Chapter Commitment","p":["I understand that meaningful development requires focused attention over time.","I will not attempt to improve every part of my game at once.","I will select priorities from evidence, role requirements, coach feedback, physical and medical guidance, and long-term development needs.","I will identify one primary priority and a limited number of supporting priorities.","I will define the current baseline, the desired improvement, the actions required, the person guiding the work, and the evidence that will show progress.","I will complete development work with quality rather than collecting repetitions without purpose.","I will communicate honestly about fatigue, pain, health, workload, and recovery.","I will review progress at planned checkpoints and adjust the plan according to evidence rather than emotion.","I will recognize that improvement may be uneven and that one difficult session does not determine the success of the block.","I will take ownership of the follow-through while using the expertise and support of my development team.","I will complete the ninety-day review honestly and use what I learn to build the next stage of development.","Player Signature:","Date:"]}]},{"n":"FINAL","title":"Final Thoughts: The Work Between The Games","blocks":[{"h":"","p":["Talent may create an invitation. A career is shaped by what happens after the invitation: the ordinary preparation, the honest conversation, the repeated correction, the meal packed before travel, the recovery completed after disappointment, and the decision to remain coachable when pride would prefer defensiveness.","This manual cannot perform the work for Gavin. It can help him notice the work, organize it, communicate it, and learn from it. Its value will not be measured by how perfectly every page is completed. It will be measured by whether the pages help him make clearer decisions and become more dependable over time.","There will be seasons when progress is obvious and seasons when development is hidden inside adversity. Roles will change. Teams will change. Statistics will rise and fall. The standard remains available: prepare honestly, compete fully, recover responsibly, learn continuously, and treat people well.","The highest purpose of the system is not to manufactur
